<title>Interconnections | Year 7 Geography</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Space+Grotesk:wght@600;700&display=swap');
:root{

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
 margin:0;background:

}

.key{font-size:.65rem;border:1px solid var(--line);border-radius:4px;padding:1px 5px;color:var(--muted)}
.theme{border-color:var(--line);min-width:90px;background:var(--surface)}
.hero{position:relative;overflow:hidden;border-bottom:1px solid var(--line)}
.hero:before{content:"";position:absolute;inset:0;background:

 transform:translateX(-100%);animation:sweep 9s ease-in-out infinite}
@keyframes sweep{0%,25%{transform:translateX(-80%)}65%,100%{transform:translateX(80%)}}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:24px 0}
.stat{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:13px;transition:.18s}.stat:hover{transform:translateY(-3px);border-color:var(--mint)}
.stat b{display:block;font:700 1.5rem "Space Grotesk",sans-serif;color:var(--sand)}.stat span{font-size:.82rem;color:var(--muted)}
.module-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.module-card{border:1px solid var(--line);border-radius:12px;background:linear-gradient(160deg,var(--surface),color-mix(in srgb,var(--surface2) 70%,var(--surface)));color:var(--ink);padding:18px;text-align:left;transition:transform .2s,border-color .2s,box-shadow .2s;position:relative;overflow:hidden}
.module-card:after{content:"";position:absolute;left:0;bottom:0;width:0;height:2px;background:linear-gradient(90deg,var(--coral),var(--mint));transition:width .35s}
.module-card:hover{transform:translateY(-5px);border-color:color-mix(in srgb,var(--mint) 60%,var(--line));box-shadow:var(--shadow)}.module-card:hover:after{width:100%}
.module-code{display:inline-grid;place-items:center;width:44px;height:38px;border-radius:7px;border:1px solid var(--line);background:var(--surface2);color:var(--coral);font:700 .72rem "Space Grotesk",sans-serif;letter-spacing:.08em}
.module-card h3{font:700 1.18rem "Space Grotesk",sans-serif;margin:12px 0 6px}.module-card p{color:var(--muted);font-size:.91rem;margin:0;min-height:66px}
.meter{height:5px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:16px}.meter span{display:block;height:100%;width:var(--p);background:linear-gradient(90deg,var(--coral),var(--sand),var(--mint));transition:width .8s}
.card-foot{display:flex;justify-content:space-between;align-items:center;margin-top:10px;color:var(--muted);font-size:.78rem}.card-foot b{color:var(--mint)}

.module-hero:after{content:"";position:absolute;width:230px;height:230px;border-radius:50%;right:-70px;top:-100px;background:radial-gradient(circle,color-mix(in srgb,var(--coral) 10%,transparent),transparent 70%)}
.module-big-code{width:76px;height:76px;border-radius:10px;border:1px solid var(--line);display:grid;place-items:center;color:var(--coral);font:700 1rem "Space Grotesk",sans-serif;background:var(--surface)}
.module-hero h1{font:700 clamp(2.5rem,5vw,4.7rem)/.95 "Space Grotesk",sans-serif;letter-spacing:-.05em;margin:0}.module-hero p{color:var(--muted);margin:.65rem 0 0;max-width:820px}
.module-tabs{display:flex;gap:7px;overflow:auto;padding:11px 0 16px}.module-tab{white-space:nowrap;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:7px;padding:7px 9px;font-size:.8rem;font-weight:700}.module-tab.active{background:var(--mint);color:#10241c;border-color:var(--mint)}

.topic-title{font:700 1rem "Space Grotesk",sans-serif}.chev{width:30px;height:30px;border-radius:7px;border:1px solid var(--line);display:grid;place-items:center;color:var(--mint);transition:.2s}.topic[open] .chev{transform:rotate(180deg)}
.topic-body{display:grid;grid-template-columns:minmax(0,1fr) 315px;gap:18px;padding:0 16px 17px}

.side{display:grid;gap:9px;align-content:start}
.info{border:1px solid var(--line);border-radius:9px;background:var(--surface2);padding:12px}.info.green{background:color-mix(in srgb,var(--mint) 7%,var(--surface2))}

.activity-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.choice{border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:10px;text-align:left;color:var(--ink);font-weight:700}.choice:hover{border-color:var(--mint)}.choice.correct{background:color-mix(in srgb,var(--mint) 18%,var(--surface));border-color:var(--mint)}.choice.wrong{background:color-mix(in srgb,var(--coral) 14%,var(--surface));border-color:var(--coral)}

.range{width:100%;accent-color:var(--coral)}
.sorter{display:grid;grid-template-columns:1fr 1fr;gap:10px}.dropzone{min-height:150px;border:1px dashed var(--line);border-radius:9px;padding:10px}.dropzone h4{margin:0 0 8px;font-family:"Space Grotesk",sans-serif}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);padding:6px 8px;font-weight:700;font-size:.84rem}
.flow{display:flex;gap:8px;align-items:stretch;overflow:auto;padding-bottom:6px}.flow-step{min-width:145px;border:1px solid var(--line);border-radius:9px;background:var(--surface);padding:10px;position:relative}.flow-step b{display:block;color:var(--mint)}.flow-step small{color:var(--muted)}.flow-arrow{display:grid;place-items:center;color:var(--coral);font-weight:700}
.climate{display:grid;grid-template-columns:1.2fr .8fr;gap:12px}.chart{border:1px solid var(--line);border-radius:9px;background:var(--surface);padding:12px}.chart svg{width:100%;height:auto;display:block}.month-btns{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.month-btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:6px;padding:7px}.month-btn.active{background:var(--mint);color:#10241c}
.quiz-score{font:700 2rem "Space Grotesk",sans-serif;color:var(--sand)}

footer{border-top:1px solid var(--line);padding:28px 18px;color:var(--muted)}.footer-inner{max-width:1240px;margin:auto;display:flex;justify-content:space-between;gap:18px}.footer-inner b{color:var(--ink)}

.snapshot{margin:13px 0 15px;border-left:3px solid var(--aqua);background:color-mix(in srgb,var(--aqua) 8%,var(--surface2));padding:11px 13px;border-radius:0 8px 8px 0;color:var(--ink)}.snapshot:before{content:"CURRENT DATA";display:block;font:700 .65rem "Space Grotesk",sans-serif;letter-spacing:.1em;color:var(--aqua);margin-bottom:4px}
.data-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0 34px}.data-card{border:1px solid var(--line);background:linear-gradient(160deg,var(--surface),var(--surface2));border-radius:10px;padding:14px;position:relative;overflow:hidden}.data-card:after{content:"";position:absolute;left:0;bottom:0;height:2px;width:100%;background:linear-gradient(90deg,var(--coral),var(--mint))}.data-card b{display:block;font:700 1.6rem "Space Grotesk",sans-serif;color:var(--sand)}.data-card span{display:block;color:var(--muted);font-size:.82rem;line-height:1.35}.data-card small{display:block;color:var(--mint);font-size:.66rem;letter-spacing:.09em;margin-top:7px}

<script>
const MODULES=[{"id":"foundations","code":"01","title":"Understanding Interconnections","desc":"Build the big ideas: connection, interconnection, globalisation, global citizenship, impacts on developing economies and the ways people and places influence one another.","topics":[1,2,3,4,5,46]},{"id":"personal","code":"02","title":"Everyday Global Connections","desc":"Trace the links hidden inside food, clothes, apps, media, brands and a jar of Nutella.","topics":[6,7,8,9]},{"id":"skills","code":"03","title":"Geographical Skills","desc":"Use Australian and world maps, BOLTSS, latitude, longitude and climate graphs to describe places accurately.","topics":[10,11,12,13,14]},{"id":"travel","code":"04","title":"Travel & Tourism Patterns","desc":"Explore why people travel, where they go, how travel has recovered, and how social media and apps shape decisions.","topics":[15,16,17,18,19]},{"id":"tourism","code":"05","title":"Tourism Impacts & Sustainability","desc":"Investigate economic, social and environmental impacts through Venice, ecotourism and natural-area examples.","topics":[20,21,22,23,24,25]},{"id":"transport","code":"06","title":"Transport & the Shrinking World","desc":"Follow the changes from steam power to container ships, aircraft and lower-emission transport.","topics":[26,27,28,29]},{"id":"communication","code":"07","title":"Communication Technology","desc":"See how the internet connects people to information, learning, health, business and money — with a current focus on internet access in Africa and the digital divide.","topics":[30,31,32,33]},{"id":"trade","code":"08","title":"Trade & Global Flows","desc":"Understand imports, exports, tariffs, free trade and Australia's current trading connections.","topics":[34,35,36,37,38]},{"id":"consumption","code":"09","title":"Production, Consumption & Change","desc":"Follow the life of products through the iPhone, Nike and chocolate cases, then examine responsibility and sustainability.","topics":[39,40,41,42,43,44,45]}];

const TOPICS=[{"id":1,"module":"foundations","title":"Connection and interconnection","lead":"A connection is a link. An interconnection shows how connected people, places or things can affect one another.","paras":["A road can connect two suburbs, a flight can connect two countries, and a phone call can connect two people. These are all examples of connections.","Interconnection adds the idea of influence. Tourists are connected to a destination, but they also change it by spending money, using transport, creating waste and sharing photos. The destination changes the visitors too by giving them experiences, knowledge and memories.","Geographers look for these two-way relationships. A change in technology, transport, trade, culture or the environment in one place can create effects in another place."],"example":"A short video makes a quiet beach famous. More visitors arrive, local cafés earn more money, traffic increases and the beach may need stronger protection. One online post can therefore connect media, tourism, business and the environment.","terms":[["connection","a link between people, places or things"],["interconnection","a relationship in which connected things can affect one another"]],"q":"What extra idea does the word interconnection include?","a":"It includes influence: connected people, places or things can affect one another.","sampleQuestion":"Explain the difference between a connection and an interconnection using an example. (4 marks)","peal":{"point":"A connection is a link, while an interconnection includes the way connected people or places affect one another.","evidence":"For example, tourists are connected to a beach when they visit it, but their spending, traffic and waste can also change the beach and nearby community.","analysis":"This shows that interconnection is two-way because the visitor affects the place and the place also affects the visitor's experience.","link":"Therefore, geographers use interconnection to explain relationships that create effects between people and places."}},{"id":2,"module":"foundations","title":"Four ways people connect","lead":"Technology, economics, transport and culture create different kinds of links between people and places.","paras":["Technological connections include TikTok, Instagram and YouTube, video calls on Zoom or WhatsApp, streaming through services such as Netflix and Prime Video, and online games such as Fortnite, Roblox and Minecraft. A person in Sydney can use these systems to connect with people, entertainment and ideas from many countries.","Economic connections include Australia selling products and services overseas, global food chains such as McDonald's, KFC and Subway operating in many countries, and shoppers using platforms such as Amazon or eBay to buy from distant sellers.","Transport connections move people and goods. Planes carry travellers, ships carry freight and international parcel networks deliver online purchases. Cultural connections spread food, music, sport and traditions. Sushi, K-pop, the Olympics, the World Cup and migration are all examples."],"example":"One pair of sneakers can involve an online advertisement, a factory overseas, a container ship, a local shop and a fashion trend. That single product creates technological, economic, transport and cultural connections.","terms":[["economic connection","a link created through money, work, business or trade"],["cultural connection","a link created through shared or exchanged ideas, food, language, music, sport or traditions"]],"q":"Give one example of a technological connection and one transport connection.","a":"For example: a video call is technological; an international flight or container ship is a transport connection.","sampleQuestion":"Explain two ways people can be connected to other places. (4 marks)","peal":{"point":"People can be connected through technology and economic activity.","evidence":"A video call links people instantly across countries, while buying an imported product links a consumer to overseas factories and workers.","analysis":"These connections move information, money and goods between places and reduce the importance of distance.","link":"Therefore, everyday life can involve several types of global connection at once."}},{"id":3,"module":"foundations","title":"Globalisation: how the world became more connected","lead":"Globalisation is the growing interconnection of economies, cultures, people and places through trade, transport, communication and investment.","paras":["Globalisation is the increasing interconnection of people and places through trade, communication, transport, culture and investment. It has made everyday life easier in several ways: people can communicate instantly across borders, buy products from international markets, travel long distances quickly, access global media and information, and use services supplied from other countries.","Advances in transport are a major reason these connections are possible. Container ships move large quantities of goods cheaply, aircraft move people and high-value or time-sensitive cargo rapidly, and road and rail networks connect ports and airports to factories, shops and homes. Faster transport reduces the time and cost of distance, creating what geographers call a 'shrinking world'.","Communication technologies strengthen the same process. Fibre-optic cables, mobile networks, satellites, smartphones, video calls and social media allow information to move almost instantly. A person in Australia can speak with family overseas, attend an online meeting, buy from an international seller or watch media produced in another country.","People benefit through greater choice, faster communication, new jobs, cheaper or more accessible goods and wider cultural exchange. A smartphone is a clear example: design, materials, chips, assembly, software, transport, retail and recycling can involve several countries before the device reaches a consumer.","Globalisation also creates negative impacts. International freight and production generate emissions; some workers face low wages or unsafe conditions; local businesses may struggle against multinational firms; and communities can become dependent on overseas buyers. A balanced geographical explanation therefore identifies both benefits and costs and uses a specific example."],"example":"A current smartphone supply chain can include product design and engineering in the United States, iPhone cover glass made by Corning in Kentucky, advanced Apple silicon made by TSMC in Arizona, other chips and wafers made in Texas and New York, iPhone assembly in China mainland, and a growing assembly/component-manufacturing base in India. The finished phone is then shipped to markets such as Australia.","terms":[["globalisation","the increasing interconnection of people and places through trade, communication, transport, culture and investment"],["specialisation","focusing production on goods or services a place can produce efficiently"],["global supply chain","the network of places and businesses involved in creating and moving a product"]],"q":null,"a":null,"article":true,"sources":[["Globalisation explained – Explainity video","https://www.youtube.com/watch?v=JJ0nFD19eT8"],["UNCTAD – Global trade and development","https://unctad.org/"],["Apple – Supply Chain Innovation","https://www.apple.com/au/supply-chain/"],["Apple – U.S. manufacturing program","https://www.apple.com/newsroom/2025/08/apple-increases-us-commitment-to-600-billion-usd-announces-ambitious-program/"]],"countryExamples":[["United States","Apple designs its products there; Corning in Kentucky makes iPhone cover glass, TSMC in Arizona manufactures advanced Apple silicon, and U.S. facilities in Texas and New York make semiconductor wafers, chips and wireless/power-management components."],["China mainland","Apple's own supply-chain site identifies iPhone assembly there."],["India","Apple identifies component manufacturing there, and Foxconn and Tata operate major iPhone assembly facilities as Apple diversifies production."]],"sampleQuestion":"Explain how globalisation has made everyday life more connected. (5 marks)","peal":{"point":"Globalisation has increased connections by making it easier for goods, people and information to move between countries.","evidence":"For example, a smartphone may involve design in the United States, assembly in China or India and sales in Australia.","analysis":"Transport and communication technologies allow these stages to be coordinated quickly across long distances.","link":"Therefore, globalisation has created stronger economic and technological links between places."}},{"id":4,"module":"foundations","title":"Article: the benefits and costs of globalisation","lead":"Globalisation can increase trade, jobs, investment, technology and cultural exchange, but the same connections can also create inequality, environmental pressure and dependence.","paras":["Globalisation can benefit companies because they can sell to larger markets, locate different stages of production where specialist skills or lower costs are available, access international investment and coordinate suppliers across borders. Consumers can gain more product choice and sometimes lower prices, while workers and communities may gain employment and infrastructure.","The same connections can create unequal outcomes. A multinational company may gain from lower production costs while workers in a supplier factory receive a smaller share of the final value. Small local businesses can face stronger competition, and production may create pollution, water use, waste or carbon emissions far from the final consumer.","For developing economies, globalisation can increase exports, foreign investment, jobs, technology transfer and access to products and services. Bangladesh's garment sector and Vietnam's electronics manufacturing are examples of economies that have become deeply connected to global production networks.","Risks include low wages, weak labour protection, environmental pressure, dependence on a small number of exports or foreign buyers, and cultural change. A country or community that relies heavily on one overseas market can be vulnerable if demand falls or production moves elsewhere.","The best judgement is therefore not that globalisation is simply good or bad. The outcome depends on who gains income and opportunity, who carries environmental and social costs, how strong labour and environmental rules are, and whether benefits are distributed widely."],"example":"A clothing supply chain can link design and branding in the United States or Europe with garment production in countries such as Bangladesh or Vietnam and customers in Australia. The jobs and export income are benefits, while wages, worker safety, water use and waste can create costs.","terms":[["economic benefit","a positive effect on income, employment, business or access to goods"],["external cost","a cost such as pollution that may fall on people or places outside the transaction"],["dependence","relying strongly on another market, company or supply source"]],"q":null,"a":null,"article":true,"sources":[["Globalisation effects – Video","https://www.youtube.com/watch?v=6QYOheSiMTM"],["Globalisation explained – Explainity video","https://www.youtube.com/watch?v=JJ0nFD19eT8"]],"sampleQuestion":"Assess one benefit and one cost of globalisation. (5 marks)","peal":{"point":"Globalisation can create economic opportunities but can also produce social and environmental costs.","evidence":"Factories can provide jobs and export income, while some workers may face low wages or unsafe conditions.","analysis":"This means the same global connection can benefit companies and consumers while placing costs on workers or environments elsewhere.","link":"Therefore, the effects of globalisation depend on how benefits and costs are distributed."}},{"id":5,"module":"foundations","title":"Global village and global citizenship","lead":"The global village is the idea that travel, media and communication make distant people feel part of one connected community.","paras":["The 'global village' means that improvements in travel, media and electronic communication make distant people feel part of one connected community. Distance still exists physically, but information, culture and relationships can move so quickly that events in one place can influence people elsewhere almost immediately.","Examples include watching the same international sporting event, following news from another continent in real time, video-calling relatives overseas, buying products from international sellers and joining online communities with members in several countries.","A global citizen thinks about responsibilities and relationships beyond the local area. This can involve learning about human rights, climate change, poverty, cultural diversity and waste, then taking informed action such as volunteering, reducing waste, supporting fairer supply chains or participating in community projects.","The idea behind the phrase 'we have become a global village' is therefore that technology, transport, trade and media have reduced the practical importance of distance and increased interdependence between people and places."],"example":"Sam learns that climate change affects communities around the world. Sam recycles at home, joins a local clean-up and shares ideas in an online environmental group with members in several countries. The local action is connected to a global issue.","terms":[["global village","the idea that the world feels more like one connected community"],["global citizen","a person who thinks about responsibilities and relationships beyond their own local area"]],"q":"What makes a person a global citizen?","a":"Thinking about the wider world and taking informed, responsible action on issues that affect people and places beyond the local area.","sampleQuestion":"Explain the idea of the 'global village'. (4 marks)","peal":{"point":"The global village describes how communication and transport make distant people feel more closely connected.","evidence":"For example, millions of people in different countries can watch the same live event and communicate about it immediately.","analysis":"Technology reduces the time needed to share ideas and experiences, making distance less important.","link":"Therefore, the world can function more like one connected community even though places remain geographically separate."}},{"id":6,"module":"personal","title":"Your personal global web","lead":"Everyday choices can connect one person to many countries without that person leaving home.","paras":["Family history, migration, travel and language create personal connections. Food, clothing, music, sport, films, games and devices create many more.","A label on a shirt can show where it was made. A food package can show where ingredients came from. An app can connect its user to a company, servers and other users in several countries.","Mapping these links reveals a personal geography. It also raises questions: Which places appear most often? Which connections depend on trade? Which depend on technology? Which are cultural?"],"example":"A person might live in Australia, have family in Bangladesh, eat Japanese food, listen to Korean music, wear shoes made in Vietnam and use an American-owned app.","terms":[["personal connection","a link between a person and another person, place, product or activity"],["network","a group of connected links"]],"q":"Why can one person's daily routine involve many countries?","a":"Because family, products, food, media, travel and digital services can all come from or connect to different places.","sampleQuestion":"Explain how one person's daily routine can show global interconnection. (4 marks)","peal":{"point":"Daily routines can connect one person to many countries through products, media and relationships.","evidence":"A student may wear imported clothes, use an international app and eat food containing overseas ingredients.","analysis":"Each activity links the consumer to producers, workers, cultures or digital networks in other places.","link":"Therefore, personal choices create a web of global connections even without international travel."}},{"id":7,"module":"personal","title":"Global brands, supply chains and local adaptation","lead":"Global brands connect countries through production and sales, but successful companies often adapt products to local cultures rather than selling exactly the same thing everywhere.","paras":["A global brand can begin in one country and later become part of daily life in many others. McDonald's originated in the United States, KFC in the United States, Nike in the United States, Adidas in Germany, Samsung in South Korea, Toyota in Japan and IKEA in Sweden. Their present-day supply chains and markets extend far beyond their country of origin.","A global brand creates interconnections in two directions. Its supply chain can connect raw materials, factories, ports and shops in different countries, while its advertising and digital platforms connect consumers to the brand worldwide.","International chains often keep a recognisable global identity while adapting products to local culture. McDonald's, for example, changes parts of its menu between India, Japan and Australia to reflect dietary preferences, ingredients and local tastes.","This shows the difference between origin and present-day geography: a company's brand may have one national origin, while its production, employees, suppliers and customers are spread across many countries."],"example":"A multinational restaurant may use the same logo and overall brand around the world but offer different menu items in India, Japan or Australia. The business is global, while parts of the product remain local.","terms":[["global brand","a brand sold and marketed across multiple national markets, such as Australia, India, Japan and the United States"],["adaptation","changing a product or strategy to fit a particular market"],["standardisation","using similar products or strategies across different markets"]],"q":null,"a":null,"article":true,"sources":[["Globalisation of McDonald's – Video","https://www.youtube.com/watch?v=HqXMvFH9EoY"]],"sampleQuestion":"Explain why global brands adapt products for different countries. (4 marks)","peal":{"point":"Global brands adapt products because consumer preferences and cultural expectations differ between places.","evidence":"McDonald's offers different menu items in India, Japan and Australia while keeping the same global brand.","analysis":"Local adaptation helps the company remain relevant to customers while still benefiting from international recognition.","link":"Therefore, successful global brands often combine standardisation with local adaptation."}},{"id":8,"module":"personal","title":"Case study article: MrBeast and global influencer reach","lead":"MrBeast demonstrates how a creator based in one country can reach hundreds of millions of people worldwide and turn digital attention into economic, cultural and charitable effects in real places.","paras":["Jimmy Donaldson, known online as MrBeast, is an American YouTube creator. He is known for large-scale challenge videos, giveaways, high-budget entertainment and philanthropic projects such as building homes, funding wells and supporting charitable causes.","He became known worldwide because YouTube distributes videos internationally, recommendation algorithms expose content to new viewers, social sharing spreads clips across other platforms, and subtitles or dubbed audio reduce language barriers. His videos can therefore reach audiences far beyond the United States.","In the 2024 video 'I Built 100 Homes And Gave Them Away!', 100 homes were built for families in Jamaica, El Salvador, Argentina, Mexico and Colombia. This shows a direct geographical interconnection between a creator, global viewers, sponsors, construction teams and communities in five countries.","Social Blade recorded the main MrBeast YouTube channel at about 520 million subscribers on 7 October 2026. The exact number changes continuously, but the scale demonstrates how digital platforms allow one person to develop a worldwide audience.","Influencer reach can create economic effects through advertising, sponsorship and consumer demand; cultural effects when formats and trends are copied internationally; and social effects when audiences are directed toward fundraising or community projects. It can also create problems such as excessive consumption, unrealistic expectations or sudden visitor pressure on places featured online."],"example":"A video filmed in one country can be watched by millions of viewers elsewhere, generate advertising revenue, inspire copycat content and direct donations or visitors toward communities that most viewers have never physically visited.","terms":[["influencer","a person whose online content can affect the choices or behaviour of an audience"],["platform algorithm","a system that helps decide which content is recommended to users"],["digital reach","the size and geographic spread of an online audience"]],"q":null,"a":null,"article":true,"snapshot":"Current snapshot · 7 October 2026: Social Blade recorded the main MrBeast YouTube channel at about 520 million subscribers.","sources":[["MrBeast – I Built 100 Homes And Gave Them Away!","https://www.youtube.com/watch?v=KkCXLABwHP0"],["Social Blade – MrBeast current channel statistics","https://socialblade.com/youtube/handle/mrbeast"]],"countryExamples":[["Jamaica","The video begins with housing projects for families living in unsafe conditions and includes rebuilding away from flood risk."],["El Salvador","Families received homes; the project also added a community soccer field and equipment."],["Argentina","The team built homes for a small community so children had safer places to live and learn."],["Mexico","Additional homes were constructed for families in local communities."],["Colombia","Homes were built for families affected by severe windstorm damage; one family also received transport support."]],"sampleQuestion":"Explain how a social-media influencer can create global interconnections. (5 marks)","peal":{"point":"Influencers create global interconnections by spreading content, ideas and economic activity across borders.","evidence":"MrBeast's housing project involved five countries and was watched by a worldwide online audience.","analysis":"YouTube distribution, algorithms and sharing connect creators to viewers, sponsors and communities far from where a video is produced.","link":"Therefore, digital influence can create real economic and social effects in multiple places."}},{"id":9,"module":"personal","title":"Case study article: Nutella and its global ingredient network","lead":"Nutella is a global product whose creation, ingredients, production plants, transport network and consumers connect farms, factories and markets across many countries.","paras":["Nutella was created by Michele Ferrero in 1964. The product developed from the Ferrero family's earlier hazelnut-and-cocoa recipes: Pietro Ferrero had developed the post-war Giandujot and later Supercrema, and Michele Ferrero improved the recipe and launched the first jar carrying the Nutella name in Alba, Italy, in 1964.","A commonly cited annual sales benchmark is about 400 million jars worldwide. For a more current scale, Ferrero stated in April 2026 that Nutella production is about 500,000 tonnes a year. That current production volume is equal by weight to roughly 1 billion 500-gram jars or about 667 million 750-gram jars, although real sales use many different jar sizes.","Nutella is now distributed in about 170 countries. Ferrero's April 2026 brand update describes Nutella as a global product reaching roughly 170 national markets, substantially wider than older figures that listed 160 countries.","France is the best-documented largest national consumer market for Nutella. A long-standing consumption benchmark reports that France accounted for about 26% of worldwide Nutella consumption, ahead of Germany and Italy. France also remains a major production centre: Ferrero states that the Villers-Écalles factory in Normandy produces more than one-quarter of the world's Nutella.","The raw-material network is international. Hazelnuts come mainly from Türkiye, Italy, Chile and the United States. Cocoa comes mainly from Côte d'Ivoire and Ghana. Nutella's palm oil comes mainly from Malaysia, followed by Indonesia. Ferrero also sources milk ingredients largely from European dairy supply chains and sugar from both European sugar beet and sugarcane-producing countries.","Nutella is produced in 11 Ferrero plants worldwide. The production network publicly identified across Ferrero and Nutella sources includes Lithgow in Australia; Poços de Caldas in Brazil; Brantford in Canada; Villers-Écalles in France; Stadtallendorf in Germany; Alba and Sant'Angelo dei Lombardi in Italy; Belsk Duzy in Poland; Vladimir in Russia; San José Iturbide in Mexico; and Manisa in Türkiye. Italy therefore has two of the 11 Nutella production plants.","After production, jars move to Ferrero warehouses and distribution centres, then by truck, rail and/or ship to national distributors, supermarkets, grocery stores, food-service businesses and online retailers. For example, Mexico's Nutella line supplies Mexico and exports to the United States, Canada, Central America and South America; Brazil's Poços de Caldas plant supplies Brazil and exports to other regions; and France's Villers-Écalles plant exports part of its production to the European Union.","Nutella does not source every ingredient from one place because the ingredients need different climates and growing conditions. Cocoa requires humid tropical conditions, oil palm grows in tropical regions, and hazelnuts perform well in temperate or Mediterranean-type climates. Different harvest seasons also improve year-round availability. Multiple sourcing regions increase supply volume, spread risks such as drought or crop disease, and allow Ferrero to use specialised agricultural regions for each ingredient."],"example":"A jar bought in Sydney can connect hazelnut growers in Türkiye or Chile, cocoa farmers in Côte d'Ivoire or Ghana, palm-oil producers in Malaysia or Indonesia, dairy suppliers in France or Germany, a Ferrero production site such as Villers-Écalles in France, international freight networks and an Australian supermarket.","terms":[["traceability","the ability to follow an ingredient back through the supply chain to its origin"],["raw material","a basic material used to make a product"],["supply resilience","the ability of a supply chain to continue operating when one source or route is disrupted"]],"q":null,"a":null,"snapshot":"Current Nutella scale · 2026: created by Michele Ferrero in 1964; produced in 11 Ferrero plants; about 500,000 tonnes per year; distributed in about 170 countries.","article":true,"sources":[["Nutella – Our Heritage","https://www.nutella.com/au/en/inside-nutella/our-heritage"],["Ferrero – 2025 Sustainability Report highlights","https://www.ferrero.com/us/en/news-stories/news/ferrero-group-2025-sustainability-report-spotlights-ferrero-farming-values-as-a-driver-of-resilience-across-supply-chains"],["Ferrero – Our sourcing approach","https://www.ferrero.com/int/en/people-planet/source-our-ingredients-sustainably/our-sourcing-approach"],["Nutella global-product","https://prezi.com/ojmtw6kd6nrb/nutella-a-global-product/"],["Nutella video","https://www.youtube.com/watch?v=EN-plHDGQAM"],["Ferrero – 2024 Sustainability Report","https://www.ferrero.com/int/sites/ferrero_int/files/2025-07/ferrero-group-2024-sustainability-report.pdf"],["Ferrero – Key figures 2024/25","https://www.ferrero.com/au/en/about-us/key-figures"],["Ferrero Italy – Nutella 62 years: 11 plants, 170 countries, 500,000 tonnes","https://www.ferrero.com/it/it/news-media/comunicati-stampa/nutella-compie-gli-anni"],["Ferrero – Family history and creation of Nutella","https://www.ferrero.com/it/it/chi-siamo/una-storia-di-famiglia"],["Nutella Australia – ingredient FAQ","https://www.nutella.com/au/en/faq"],["Nutella Australia – palm-oil sourcing","https://www.nutella.com/au/en/inside-nutella/sustainability/palm-oil"],["Ferrero Mexico – Nutella production","https://www.ferrero.com/mx/es/sobre-nosotros/ferrero-de-mexico"],["Ferrero Brazil – Nutella production and exports","https://www.ferrero.com/br/en/noticias-e-artigos/noticias/nutella-homenageia-o-brasil-em-nova-campanha-exclusiva"],["Ferrero France – Villers-Écalles Nutella production","https://www.ferrero.com/fr/fr/a-propos-de-nous/ferrero-en-france"]],"countryExamples":[["Türkiye, Italy, Chile, United States","Main Nutella hazelnut origins."],["Côte d'Ivoire and Ghana","Main cocoa origins."],["Malaysia and Indonesia","Main palm-oil origins; Malaysia supplies the largest share."],["Australia — Lithgow","Nutella production for Australia and New Zealand."],["Brazil — Poços de Caldas","Nutella production for Brazil and export markets."],["Canada — Brantford","Nutella production for the Canadian market."],["France — Villers-Écalles","World's largest Nutella production site; more than one-quarter of global production."],["Germany — Stadtallendorf","Nutella production for Germany and northern European markets."],["Italy — Alba and Sant'Angelo dei Lombardi","Two Nutella production plants."],["Poland — Belsk Duzy","Nutella production serving eastern European markets."],["Russia — Vladimir","Nutella production plant."],["Mexico — San José Iturbide","Nutella production and exports across the Americas."],["Türkiye — Manisa","One of the 11 Nutella-producing plants."]],"sampleQuestion":"Explain how Nutella demonstrates global interconnection. (5 marks)","peal":{"point":"Nutella demonstrates global interconnection because its ingredients, production and consumers are spread across many countries.","evidence":"Hazelnuts, cocoa and palm oil are sourced from different regions, while Nutella is produced in 11 plants and sold in about 170 countries.","analysis":"Different climates and specialised production locations make the supply chain depend on transport and trade between places.","link":"Therefore, one jar of Nutella represents a global network of farms, factories, transport and consumers."}},{"id":10,"module":"skills","title":"Australia map essentials","lead":"A strong map reader can locate major Australian features and use direction and position accurately.","paras":["Australia's national capital is Canberra. Tasmania is the island state south of mainland Australia. Queensland, New South Wales and Victoria form the main east-coast state sequence, with capitals Brisbane, Sydney and Melbourne.","The Tropic of Capricorn, about 23.5° south, crosses mainland Australia. Uluru is in the southern part of the Northern Territory, southwest of Alice Springs.","The Indian Ocean lies to the west and northwest of Australia, the Pacific Ocean lies to the east, the Southern Ocean is to the south, and the Tasman Sea lies between Australia and New Zealand. The Great Australian Bight is the large open bay along the central-southern coast.","These locations answer the main Australian-map skills: Canberra is the capital; Tasmania is the southern island state; the Tropic of Capricorn crosses the mainland; Uluru belongs in southern Northern Territory; Brisbane, Sydney and Melbourne are the capitals of Queensland, New South Wales and Victoria; the Tasman Sea lies east of Tasmania and southeast of the mainland; and the Great Australian Bight lies along the south coast."],"example":"If a map question asks you to locate Uluru, first find the Northern Territory, then place it in the southern interior rather than near Darwin.","terms":[["capital city","the city where a national or state government is based"],["Great Australian Bight","the large open bay along the southern coast of mainland Australia"]],"q":"Which latitude line crosses mainland Australia?","a":"The Tropic of Capricorn, about 23.5°S.","sampleQuestion":"Describe the location of Uluru using Australian map knowledge. (4 marks)","peal":{"point":"Uluru is located in the southern part of the Northern Territory in central Australia.","evidence":"It lies southwest of Alice Springs and north of the South Australian border.","analysis":"Using state and territory boundaries helps describe its relative location accurately.","link":"Therefore, map knowledge allows places to be located using clear geographical references."}},{"id":11,"module":"skills","title":"World maps, oceans and hemispheres","lead":"World maps help us describe where places are in relation to continents, oceans and hemispheres.","paras":["The Equator divides Earth into the Northern and Southern Hemispheres. The Prime Meridian helps divide locations into eastern and western positions.","Major oceans connect continents through shipping, travel and climate systems. The Pacific Ocean lies east of Australia, while the Indian Ocean lies to the west.","Relative location describes where something is compared with another place. Absolute location uses coordinates such as latitude and longitude."],"example":"Australia is south of the Equator and mostly east of the Prime Meridian. It lies between the Indian and Pacific oceans.","terms":[["hemisphere","half of Earth"],["relative location","the position of a place described in relation to other places"]],"q":"Which two major oceans lie on the western and eastern sides of Australia?","a":"The Indian Ocean to the west and the Pacific Ocean to the east.","sampleQuestion":"Describe Australia's relative location using hemispheres and oceans. (4 marks)","peal":{"point":"Australia is mainly in the Southern and Eastern Hemispheres.","evidence":"It lies south of the Equator, east of the Prime Meridian, between the Indian Ocean and Pacific Ocean.","analysis":"These large geographical reference points make Australia's global position easy to describe.","link":"Therefore, hemispheres and oceans are useful for explaining relative location."}},{"id":12,"module":"skills","title":"BOLTSS: making a useful map","lead":"BOLTSS is a checklist for the information a clear geographical map should include.","paras":["B is Border, the line around the map. O is Orientation, usually a north arrow. L is Legend, the key explaining symbols and colours.","T is Title, which states the map's purpose. The first S is Scale, showing the relationship between map distance and real distance. The final S is Source, explaining where the information came from.","A map can be colourful but still weak if the reader cannot work out what symbols mean, which way is north or where the information came from."],"example":"A map showing countries connected to your clothes should include a title, a legend for different product types, a north arrow if direction matters and a source for the country information.","terms":[["legend","a key explaining map symbols and colours"],["scale","the relationship between a distance on a map and the real distance"]],"q":"What do the two S letters in BOLTSS stand for?","a":"Scale and Source.","sampleQuestion":"Explain why BOLTSS is important when constructing a map. (4 marks)","peal":{"point":"BOLTSS makes a map easier to understand and use accurately.","evidence":"A legend explains symbols, orientation shows direction and scale shows the relationship between map distance and real distance.","analysis":"Without these elements, a reader may misinterpret where features are or how far apart they are.","link":"Therefore, BOLTSS improves the clarity and reliability of geographical maps."}},{"id":13,"module":"skills","title":"Latitude and longitude","lead":"Latitude and longitude work together like a global address.","paras":["Latitude measures north–south position from the Equator. The Equator is 0°. The Tropic of Cancer is about 23.5°N, the Tropic of Capricorn about 23.5°S, the Arctic Circle about 66.5°N and the Antarctic Circle about 66.5°S.","The tropics lie between the Tropic of Cancer and the Tropic of Capricorn. The Sun can be very high in the sky in this region, so tropical areas are generally warm. Rainfall varies, but many tropical places have clear wet and dry seasons.","Longitude measures east–west position from the Prime Meridian at 0°, which passes through Greenwich in London. The Prime Meridian also crosses parts of France, Spain, Algeria, Mali, Burkina Faso, Togo and Ghana.","The International Date Line is roughly opposite the Prime Meridian near 180°. It bends through the Pacific to avoid splitting some countries and island groups into different calendar days.","Crossing the International Date Line changes the calendar date. Near the Bering Strait, eastern Russia and Alaska are geographically close but can be on different calendar days."],"example":"Sydney is south of the Equator and east of the Prime Meridian, so its coordinates use S and E.","terms":[["latitude","distance north or south of the Equator, measured in degrees"],["longitude","distance east or west of the Prime Meridian, measured in degrees"],["International Date Line","the line near 180° longitude where the calendar date changes"]],"q":"What is the reference line for longitude?","a":"The Prime Meridian at 0° longitude.","sampleQuestion":"Explain how latitude and longitude can be used to locate a place. (4 marks)","peal":{"point":"Latitude and longitude provide a global coordinate system for locating places.","evidence":"Sydney is approximately 34° south and 151° east.","analysis":"Latitude measures north-south position from the Equator, while longitude measures east-west position from the Prime Meridian.","link":"Therefore, combining both coordinates gives a precise global location."}},{"id":14,"module":"skills","title":"How to read a climate graph","lead":"A climate graph shows how temperature and precipitation change through a year.","paras":["The horizontal axis normally shows the months. A line shows average monthly temperature in degrees Celsius. Columns show monthly precipitation, usually in millimetres.","To describe the graph, find the warmest and coolest months, calculate the temperature range, and identify the wettest and driest months. Then look for a seasonal pattern.","Halifax, Canada, is used in the interactive example on this site. The graph lets you select a month and read temperature and precipitation together. The important skill is not memorising the numbers; it is learning how the two sets of data are displayed and compared."],"example":"If the line rises strongly from winter to summer and then falls, the place has a clear seasonal temperature pattern. If the bars stay similar, precipitation is spread more evenly through the year.","terms":[["precipitation","water falling from the atmosphere, including rain and snow"],["temperature range","the highest temperature minus the lowest temperature"]],"q":"What do the columns usually show on a climate graph?","a":"Precipitation or rainfall.","sampleQuestion":"Explain how a climate graph helps describe a place's climate. (4 marks)","peal":{"point":"A climate graph shows seasonal patterns in temperature and precipitation.","evidence":"The line shows average monthly temperature while the bars show monthly precipitation.","analysis":"Comparing both sets of data reveals warm and cool periods as well as wetter and drier months.","link":"Therefore, climate graphs allow geographers to describe climate patterns across a year."}},{"id":15,"module":"travel","title":"Why do people travel?","lead":"People travel for leisure, family, health, culture, study, work and new experiences.","paras":["Leisure travel includes holidays, relaxation and recreation. Cultural travel may focus on food, heritage, festivals or learning about different ways of life.","People also travel to visit relatives and friends, seek medical treatment, attend meetings, study, inspect work sites or build business networks.","One trip can have several purposes. Faster transport and digital booking systems have also made it easier for many people to organise long-distance trips."],"example":"A person may travel overseas for a family wedding, visit relatives, explore local food and spend several days on holiday during the same journey.","terms":[["leisure","free time used for enjoyment"],["tourism","temporary travel away from home for leisure, culture, business or other purposes"]],"q":"Name three different reasons people may travel.","a":"Examples include holidays, family, culture, health, study, work or business.","sampleQuestion":"Explain two reasons why people travel. (4 marks)","peal":{"point":"People travel for both leisure and practical reasons.","evidence":"A person may take a holiday for recreation or travel for work, health or family reasons.","analysis":"Different motivations create different travel patterns and demands for transport and tourism services.","link":"Therefore, travel is influenced by a range of personal, economic and social needs."}},{"id":16,"module":"travel","title":"International tourism: current global patterns","lead":"International tourism has recovered beyond pre-pandemic levels, but growth is uneven and can change quickly when conflict, prices, climate events or transport disruption affect travel.","paras":["International tourism reached an estimated 1.52 billion international tourist arrivals in 2025, about 4% more than in 2024. Europe remained the world's largest destination region with about 793 million arrivals.","France was the world's most visited country in 2025, with roughly 102 million international visitors. France is in Europe, so Europe contains the world's most visited country as well as several other major destinations such as Spain and Italy.","Asia and the Pacific recorded about 331 million international tourist arrivals in 2025, an increase of about 6% from 2024. The region was still recovering toward its pre-pandemic level, with especially strong growth in North-East Asia.","Among destinations with full-year data highlighted by UN Tourism for 2025, Brazil recorded one of the strongest increases in international arrivals at about 37% above 2024. Within OECD countries, Finland (+16.5%), Japan (+15.8%), Korea (+15.7%) and Norway (+12.5%) recorded double-digit growth.","Some countries received fewer international tourists in 2025 than in 2024. OECD data show declines in the United States (-5.5%), Ireland (-2.8%), Germany (-0.8%) and Canada (-0.6%). Reasons differ by destination and can include prices, exchange rates, air connectivity, economic conditions, safety perceptions, border or visa conditions and geopolitical events.","Travel patterns are therefore not fixed. A country may have famous scenery and heritage but still record a temporary decline if travel becomes more expensive or difficult. Current tourism comparisons should always state the year and whether the figure measures international arrivals, nights or day visits."],"example":"A viral destination may experience rapid visitor growth, but a conflict, heatwave or rise in airfares can change demand within months. Tourism is therefore both globally connected and highly sensitive to events.","terms":[["international tourist arrival","an overnight visitor who travels to another country"],["tourism pattern","the spatial distribution and movement of tourists"],["tourism resilience","the ability of tourism systems to cope with disruption and recover"]],"q":null,"a":null,"snapshot":"2025 · World: 1.52b international arrivals · Europe: 793m · Asia-Pacific: 331m · France: ~102m visitors.","article":true,"sources":[["UN Tourism – World Tourism Barometer","https://www.untourism.int/zh-hans/node/11628"],["France – 2025 tourism record","https://presse.economie.gouv.fr/?p=171344"],["UN Tourism – International arrivals 2025","https://www.untourism.int/news/international-tourist-arrivals-up-4-in-2025-reflecting-strong-travel-demand-around-the-world"],["OECD – Tourism trends and country changes 2025","https://www.oecd.org/en/about/news/press-releases/2026/07/tourist-arrivals-reach-new-record-but-the-sector-must-adapt-to-keep-growing.html"]],"sampleQuestion":"Explain one pattern in current international tourism. (5 marks)","peal":{"point":"International tourism is strongly concentrated in major destination regions, especially Europe.","evidence":"In 2025 Europe received about 793 million international arrivals and France about 102 million visitors.","analysis":"Dense transport networks, famous cultural attractions and well-developed tourism infrastructure help attract large visitor numbers.","link":"Therefore, tourism flows are uneven and are concentrated in places with strong accessibility and attractions."}},{"id":17,"module":"travel","title":"Article: social media and the tourism effect","lead":"Social media can change where people travel by turning landscapes, cafés and viewpoints into globally recognisable destinations, creating both new income and new pressure.","paras":["Social media can be both beneficial and harmful to tourist destinations. Attractive photos and videos can promote a place quickly, bring customers to hotels, restaurants, guides and transport businesses, and expose viewers to new cultures.","The same attention can create overcrowding, traffic, litter, erosion and damage to vegetation when too many visitors concentrate at one viewpoint. Residents can lose access to quiet public spaces, and a viral image can create unrealistic expectations when it is heavily edited or photographed at an unusually quiet time.","Wanagiri Hidden Hills in Bali and the hot-air-balloon landscapes of Cappadocia in Türkiye show how travellers may arrive with a specific social-media photograph already in mind. Online attention can therefore change real visitor flows and the way a destination is experienced.","Other current travel trends include shorter and more frequent trips, mobile booking and navigation, experience-based travel, food and cultural tourism, ecotourism, wellness travel, remote-work travel and increasing interest in lower-impact or less crowded destinations.","Good management can retain the economic benefits while reducing harm through visitor limits, timed entry, stronger paths, waste facilities, public transport, protection of sensitive habitats and promotion of alternative locations and seasons."],"example":"If thousands of people copy the same photograph at one viewpoint, local businesses can gain customers while the exact spot experiences erosion, queues, litter and traffic.","terms":[["Instagram effect","the influence of highly shareable online images on travel interest and visitor flows"],["destination image","the ideas and expectations people hold about a place"],["overtourism","visitor pressure that exceeds what a place or community can comfortably manage"]],"q":null,"a":null,"article":true,"sources":[["UN Tourism – tourism trends and destination management","https://www.untourism.int/"],["Venice overtourism case – ABC News","https://www.abc.net.au/news/2019-03-13/saving-venice/10893508"]],"sampleQuestion":"Assess one positive and one negative effect of social media on tourism. (5 marks)","peal":{"point":"Social media can increase tourism income but can also create overcrowding and environmental pressure.","evidence":"A viral photo may attract customers to hotels and cafés while concentrating visitors at one viewpoint.","analysis":"The same digital exposure that creates economic opportunities can increase traffic, waste and damage in a small area.","link":"Therefore, social media can have both beneficial and harmful effects on tourist destinations."}},{"id":18,"module":"travel","title":"Australian tourism after COVID-19: recovery and current conditions","lead":"Australian tourism has recovered strongly from the pandemic, but different statistics measure different parts of the visitor economy and should not be mixed together.","paras":["Tourism helps Australia's economy in at least three direct ways. First, visitors spend money on accommodation, meals, attractions, shopping and transport. Second, tourism supports employment in hospitality, aviation, accommodation, events, guiding and retail. Third, tourism supports local businesses and regional economies because visitor spending flows to suppliers such as food producers, transport operators and maintenance services.","Tourism Research Australia reported about 727,000 tourism jobs in March 2026 and tourism GDP of A$81.1 billion in 2024–25. In the year ending June 2026, Australia received 8.4 million international trips and international visitors spent A$40.5 billion inside Australia.","Popular Australian destinations include Sydney and Sydney Harbour, Melbourne, the Gold Coast, the Great Barrier Reef and Whitsundays, Uluru–Kata Tjuta National Park, the Great Ocean Road, Tasmania and tropical North Queensland. Sydney alone received 3.8 million international visitors in the year ending June 2026.","COVID-19 caused international travel to collapse when borders closed. Australians shifted toward domestic and regional travel and staycations. After borders reopened, international travel returned strongly, while domestic day trips and shorter breaks remained important. In the June quarter 2026 Australians made 27.1 million domestic overnight trips and 74.2 million domestic day trips.","Travel apps reduce the difficulty of planning and moving between places. Booking.com, Expedia and Airbnb support accommodation searches and bookings; airline apps provide tickets and flight updates; Google Maps supports navigation; and review platforms such as TripAdvisor help travellers compare destinations and services. These tools connect tourists to information, businesses and transport in real time.","Ecotourism means responsible travel to natural areas that protects the environment, supports local communities and includes education. It has become popular in Australia because the country has globally significant reefs, rainforests, wildlife and national parks, and many travellers want nature-based experiences with lower environmental impact.","An Australian ecotourism example is the Daintree Wilderness Lodge in the Wet Tropics World Heritage Area. Its sustainability features include elevated cabins and walkways, stand-alone solar power with battery support, careful water sourcing, a Bio Cycle wastewater system, recycling and practices designed to reduce disturbance to the rainforest."],"example":"A visitor who flies to Cairns, stays in a hotel, books a reef tour, eats at restaurants and buys local products supports several connected sectors of the Australian economy.","terms":[["visitor economy","the businesses and activities supported by people travelling away from their usual environment"],["domestic tourism","travel within a person's own country"],["international visitor spend","money spent in Australia by overseas visitors"]],"q":null,"a":null,"snapshot":"Latest Australia data · YE Jun 2026: 8.4m international trips and A$40.5b spent in Australia · Mar 2026: ~727,000 tourism jobs.","article":true,"sources":[["Tourism Research Australia – International tourism results","https://www.tra.gov.au/en/tourism-statistics/international-tourism-results"],["Tourism Research Australia – Annual benchmark report","https://www.tra.gov.au/en/tourism-industry-analysis/annual-benchmark-report"],["WTTC – Australia Travel & Tourism 2025","https://wttc.org/news/australias-travel-tourism-sector-set-to-reach-record-315bn-in-2025"],["Post-COVID tourism background article","https://www.torrens.edu.au/blog/6-reasons-why-tourism-is-so-important-to-australias-post-covid19-economy"],["Tourism Research Australia – Domestic tourism June 2026","https://www.tra.gov.au/en/tourism-statistics/domestic-tourism-statistics-results"],["Tourism Research Australia – Visitor economy dashboard","https://www.tra.gov.au/"],["Destination NSW – Sydney statistics","https://www.destinationnsw.com.au/insights/sydney-statistics"]],"sampleQuestion":"Explain how tourism in Australia changed after COVID-19. (5 marks)","peal":{"point":"Australian tourism shifted toward domestic travel during the pandemic and then recovered strongly as international borders reopened.","evidence":"By the year ending June 2026 Australia recorded 8.4 million international trips and A$40.5 billion in international visitor spending inside Australia.","analysis":"The recovery restored international demand while domestic and regional travel remained an important part of the visitor economy.","link":"Therefore, post-COVID tourism combines international recovery with travel habits strengthened during border closures."}},{"id":19,"module":"travel","title":"Travel apps and changing travel behaviour","lead":"Digital tools now influence how people plan, book, navigate and review trips.","paras":["Map apps help with navigation and public transport. Airline and accommodation apps support bookings and updates. Review platforms provide opinions from previous visitors, while ride-hailing apps connect travellers with local transport.","These tools reduce uncertainty. A traveller can compare prices, translate information, check opening times and change plans while already travelling.","Digital convenience can also create problems. Reviews may be unreliable, app-based recommendations can send too many people to the same place, and travellers without good internet access or payment options may be disadvantaged."],"example":"A visitor can use Google Maps for directions, an airline app for a boarding pass, Booking.com for accommodation and a ride-hailing app for a trip from the station.","terms":[["digital platform","an online system that connects users, information or services"],["review","a user's opinion or rating of a service, product or place"]],"q":"Give two ways travel apps can make a trip easier.","a":"Examples include navigation, booking, price comparison, transport updates, translation and reviews.","sampleQuestion":"Explain how travel apps have changed travel behaviour. (4 marks)","peal":{"point":"Travel apps make planning and travelling faster and more independent.","evidence":"Apps allow travellers to compare accommodation, navigate unfamiliar places and receive real-time flight updates.","analysis":"Easy access to information reduces uncertainty and allows travellers to change decisions quickly while travelling.","link":"Therefore, digital technology has changed how people choose, book and experience destinations."}},{"id":20,"module":"tourism","title":"Positive and negative impacts of tourism","lead":"Tourism can change the economy, society and environment at the same time.","paras":["Tourism can create economic benefits by bringing visitor spending into hotels, restaurants, attractions, shops and transport businesses. It creates jobs and can encourage investment in roads, airports, public spaces and visitor facilities that local residents may also use.","Tourism can support cultural exchange because visitors learn about local history, food and traditions, while communities can earn income by sharing cultural experiences. Tourism revenue can also support conservation when park fees or tourism taxes are directed toward environmental management.","Negative effects include pollution, litter, carbon emissions, habitat damage and pressure on water and waste systems. Popular destinations can also experience overcrowding, traffic and disturbance to wildlife.","Social and economic costs can include higher rents and prices, conversion of housing into short-term accommodation, seasonal jobs and commercialisation of local traditions. The overall effect depends on visitor numbers, management, local ownership and how tourism income is distributed."],"example":"A resort creates jobs and pays local suppliers, but it may also increase traffic, waste and demand for land or water.","terms":[["economic impact","an effect on jobs, income, business or costs"],["social impact","an effect on communities, culture, behaviour or quality of life"],["environmental impact","an effect on natural systems such as land, water, plants and animals"]],"q":"Why should tourism impacts be examined in more than one category?","a":"Because tourism can affect the economy, communities and the environment in different ways at the same time.","sampleQuestion":"Explain one positive and one negative impact of tourism. (5 marks)","peal":{"point":"Tourism can create economic benefits while also producing social or environmental costs.","evidence":"Visitor spending supports local jobs and businesses, but high visitor numbers can increase congestion and waste.","analysis":"This shows that tourism brings income while placing extra pressure on places and communities.","link":"Therefore, sustainable management is needed to keep tourism benefits while reducing negative impacts."}},{"id":21,"module":"tourism","title":"Case study article: Venice, overtourism and visitor management","lead":"Venice shows how tourism can support an economy while simultaneously placing intense pressure on housing, public space, infrastructure, residents and a fragile lagoon environment.","paras":["Tourism has changed daily life for Venice residents. Crowding can make streets, water buses and public spaces difficult to use, while demand for visitor accommodation can encourage homes to be converted to short-term rentals and place pressure on housing costs. Businesses increasingly serve visitors, which can support jobs but can also make the historic centre less convenient for permanent residents.","Venice receives millions of overnight visitors plus very large numbers of day visitors. Municipal tourism statistics count people staying in registered accommodation separately from day-trippers, so totals vary by measure. A widely used overall estimate is roughly 25–30 million visitor trips or visits a year when day visitors are included. In 2024 the historic centre had an average daily presence of about 170,000 people, including residents, workers, students, tourists and other city users.","Tourism has important positive effects. Visitors support hotels, restaurants, cafés, museums, guides, shops, water transport and cultural institutions. Tourism provides employment and revenue that can contribute to maintenance of a city with exceptionally valuable historic buildings and public spaces.","Large cruise ships created several problems. Their passengers could arrive in large groups over short periods, adding to crowding; ships produced air emissions and raised concerns about effects on the fragile lagoon and the visual and physical environment around the historic city. Italy therefore restricted large cruise ships from the San Marco Basin, San Marco Canal and Giudecca Canal and shifted large-vessel activity away from the historic centre.","Venice uses several measures to manage tourism. Large cruise ships are restricted from the historic lagoon; selected day visitors pay an access fee on designated busy days; authorities monitor visitor flows; and the city promotes advance planning and management of high-demand periods. In 2026 the access-fee system operated on 60 selected days and recorded 679,553 paid vouchers, with the average daily number of paid vouchers 32.3% lower than in 2024.","Rising sea levels and high-water events threaten Venice's buildings, squares, transport and tourism infrastructure. More frequent or severe flooding can damage heritage, interrupt access and increase maintenance costs. The MOSE movable-barrier system can temporarily isolate the lagoon from unusually high Adriatic tides, reducing flood risk during selected events, although long-term sea-level rise still requires continuing adaptation."],"example":"A day visitor may contribute some spending but also uses bridges, streets, water transport, waste services and public space. When very large numbers arrive at the same time, these small individual impacts combine into major pressure.","terms":[["overtourism","visitor pressure that exceeds what a destination can comfortably manage"],["day-tripper","a visitor who arrives and leaves without staying overnight"],["carrying capacity","the level of use a place can accommodate without unacceptable damage or loss of quality"]],"q":null,"a":null,"snapshot":"Venice management update · 2026 access fee: 60 selected days, 679,553 paid vouchers; average daily paid vouchers 32.3% below 2024.","article":true,"sources":[["ABC News – Saving Venice","https://www.abc.net.au/news/2019-03-13/saving-venice/10893508"],["Venice – 2026 access-fee results","https://live.comune.venezia.it/index.php/it/2026/07/contributo-di-accesso-i-dati-provvisori-del-2026-calano-la-media-giornaliera-dei-voucher-e"],["Italian law restricting large cruise ships","https://www.normattiva.it/atto/caricaDettaglioAtto?atto.codiceRedazionale=21G00114&atto.dataPubblicazioneGazzetta=2021-07-20"],["Venice tourism video","https://www.youtube.com/watch?v=8KB0CkzvT6Y"],["Venice tourism video","https://www.youtube.com/watch?v=TwX0PmLdbqc"],["Venice visitor-count methodology","https://visit.venice.it/plan-your-trip/venice-overtourism"],["City of Venice – tourism studies and annual reports","https://www.comune.venezia.it/it/content/studi"]],"sampleQuestion":"Assess how tourism has affected Venice. (6 marks)","peal":{"point":"Tourism has brought major economic benefits to Venice but has also created strong social and environmental pressures.","evidence":"Visitors support hotels, restaurants and museums, while crowding and tourist accommodation can make daily life and housing more difficult for residents.","analysis":"Cruise ships and large day-visitor flows also concentrate pressure on the historic city and lagoon, leading to measures such as cruise restrictions and access fees.","link":"Therefore, Venice shows why overtourism requires active visitor management to balance income with liveability and conservation."}},{"id":22,"module":"tourism","title":"How tourism can damage environments","lead":"Tourism can affect coasts, mountains, forests, wetlands, reefs, wildlife and soils if visitor use and development are poorly managed.","paras":["On coasts, people can trample sand dunes and developers may clear vegetation for resorts, roads, parking and other facilities. Unplanned growth can spread buildings along scenic coastlines and increase waste and sewage.","In marine environments, anchors, boating, diving and shoreline development can damage coral and seagrass. Land clearing increases sediment in water, while nutrient-rich sewage can disturb coral-reef conditions.","In mountains and forests, clearing land for ski facilities or resorts can increase erosion and land risk. Trails can compact soil and damage vegetation. Wildlife viewing can also disturb feeding, breeding or movement if people get too close.","Draining coastal wetlands removes habitats that support many species. Building on fertile soils can also reduce land available for agriculture. Good planning tries to keep visitors away from sensitive areas and set limits before damage becomes difficult to reverse."],"example":"A popular walking trail becomes wider as visitors step around muddy sections. Vegetation dies, bare soil is exposed and heavy rain then washes more soil away.","terms":[["erosion","the wearing away and movement of soil or rock"],["biodiversity","the variety of living things in an area"],["sediment","small particles of soil or rock carried by water"]],"q":"How can a walking trail eventually cause biodiversity loss?","a":"Heavy trampling can kill vegetation and compact or expose soil, leading to erosion and habitat loss.","sampleQuestion":"Explain how tourism can damage a natural environment. (4 marks)","peal":{"point":"Tourism can damage environments when visitor activities exceed the ability of ecosystems to recover.","evidence":"Walking across dunes can destroy vegetation, while anchors and diving can damage coral reefs.","analysis":"Loss of vegetation or reef structure reduces habitat quality and can increase erosion or biodiversity loss.","link":"Therefore, tourism needs careful management in environmentally sensitive places."}},{"id":23,"module":"tourism","title":"What is ecotourism?","lead":"Ecotourism is responsible travel in natural areas that aims to protect the environment and support local communities.","paras":["Ecotourism is not simply any holiday in nature. A more sustainable operation tries to reduce waste, protect wildlife, control visitor behaviour and use water and energy carefully.","Local communities should benefit through employment, local purchasing, cultural experiences and a real voice in tourism decisions. This helps keep more benefits in the destination.","Common strategies include renewable energy, recycling, locally grown food, low-emission transport, visitor limits, environmental rules and education about conservation."],"example":"A small rainforest lodge uses solar power, employs local guides, keeps visitors on marked tracks and contributes money to habitat restoration.","terms":[["ecotourism","responsible tourism in natural areas that supports conservation and local communities"],["sustainable tourism","tourism managed so economic, social and environmental benefits can continue into the future"]],"q":"What makes ecotourism different from simply visiting a natural place?","a":"It includes active efforts to protect the environment and support local communities.","sampleQuestion":"Explain what makes tourism 'ecotourism'. (4 marks)","peal":{"point":"Ecotourism is responsible travel to natural areas that supports conservation and local communities.","evidence":"A genuine ecotourism operator may use local guides, follow wildlife rules and contribute to environmental protection.","analysis":"These practices reduce damage while allowing tourism income to support the place being visited.","link":"Therefore, ecotourism combines nature-based experiences with conservation and community benefits."}},{"id":24,"module":"tourism","title":"Case study article: Daintree Wilderness Lodge and sustainable ecotourism","lead":"Daintree Wilderness Lodge demonstrates how accommodation can reduce its footprint while helping visitors experience a sensitive rainforest landscape and learn about Kuku Yalanji Country.","paras":["Daintree Wilderness Lodge is in the Wet Tropics World Heritage Area of far north Queensland. Its seven cabins are elevated above the ground, which reduces trampling, soil compaction and disturbance to rainforest vegetation and root systems.","The lodge uses a stand-alone solar-array system with battery and generator backup, reducing reliance on conventional fossil-fuel electricity. It accesses spring water through a bore and monitors water quality, while a Bio Cycle wastewater system treats wastewater rather than releasing untreated sewage into the rainforest. Recycling and waste-reduction practices lower the amount of material sent away as waste.","These features make the operation more sustainable because they reduce energy emissions, protect soil and vegetation, conserve water quality and limit waste. The location also gives visitors an opportunity to learn about the ecological importance of one of the world's oldest tropical rainforests.","Tourist destinations can become more sustainable by reducing waste and single-use items, recycling, using renewable energy, conserving water, employing local workers, purchasing local products, using low-emission or shared transport, protecting sensitive habitats and limiting visitor numbers where carrying capacity is being exceeded.","Ecotourism resorts are important because tourism income can depend on keeping the natural environment healthy rather than replacing it with high-impact development. A well-managed rainforest lodge can provide jobs and visitor spending while using low-impact buildings, educating guests and supporting conservation. The long-term goal is for the environment and local community to remain capable of supporting tourism into the future."],"example":"Raised cabins and walkways allow guests to stay inside the rainforest while reducing direct trampling and disturbance of the forest floor.","terms":[["ecotourism","responsible nature-based tourism that supports conservation and local communities"],["off-grid","operating without relying fully on public utility networks"],["regenerative tourism","tourism that aims to leave communities and environments better rather than only reducing harm"]],"q":null,"a":null,"snapshot":"Current snapshot · Daintree Wilderness Lodge operates seven elevated eco-certified cabins and reports a stand-alone solar system, Bio Cycle wastewater treatment, recycling and low-impact construction.","article":true,"sources":[["Daintree Wilderness Lodge – Sustainability","https://daintreewildernesslodge.com.au/sustainability/"],["Daintree Wilderness Lodge – Eco-certified cabins","https://daintreewildernesslodge.com.au/stay/daintree-cabins/"],["Daintree Wilderness Lodge – Indigenous cultural tours","https://daintreewildernesslodge.com.au/local-attractions/indigenous-cultural-tours-walkabout-cultural-adventures/"]],"sampleQuestion":"Explain how Daintree Wilderness Lodge demonstrates sustainable tourism. (5 marks)","peal":{"point":"Daintree Wilderness Lodge demonstrates sustainable tourism by reducing environmental impact while providing a tourism experience.","evidence":"Its elevated cabins reduce ground disturbance, while solar power and wastewater treatment reduce pressure on the rainforest.","analysis":"These practices protect the natural environment that visitors have travelled to experience and help maintain the destination over time.","link":"Therefore, low-impact design and resource management make ecotourism more sustainable."}},{"id":25,"module":"tourism","title":"Ecotourism examples around the world","lead":"Different natural destinations use differe
