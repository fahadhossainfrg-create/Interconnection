local networks and long-distance fibre cables crossing the ocean floor.","terms":[["infrastructure","the physical systems needed for services to operate"],["fibre-optic cable","a cable that carries data as pulses of light"]],"q":"Why can remote communities be harder to connect to the internet?","a":"Networks must cover long distances for fewer users, and infrastructure, electricity, devices and data can be expensive."},{"id":34,"module":"trade","title":"What is global trade?","lead":"Global trade is the buying and selling of goods and services between countries.","paras":["An export is a good or service sold to another country. An import is a good or service bought from another country.","Countries trade because they have different climates, resources, skills, industries and costs. Trade gives consumers and businesses access to products that may not be available locally.","Trade creates links between farms, mines, factories, ports, shipping companies, airports, shops, digital services and consumers."],"example":"Australia can export wheat or education services and import passenger cars, computers or telecommunications equipment.","terms":[["export","a good or service sold to another country"],["import","a good or service bought from another country"],["global trade","buying and selling goods and services between countries"]],"q":"A smartphone made overseas and bought in Australia is what from Australia's point of view?","a":"An import."},{"id":35,"module":"trade","title":"Why countries trade","lead":"Countries trade because no place has every resource, climate, industry or skill it wants in the same amount.","paras":["A tropical crop may not grow well in a cold climate. Some countries have large mineral deposits, while others specialise in manufacturing, finance, education or technology.","Businesses also trade to reach larger markets. Selling to international customers can increase demand, income and employment.","Trade also creates dependence. A factory that relies on one overseas supplier may face delays if a port closes, a conflict interrupts shipping or a natural disaster damages production."],"example":"Australia imports coffee from warmer growing regions and exports resources and services that overseas buyers want.","terms":[["market","people or places where goods and services are bought and sold"],["trade partner","a country that regularly buys from or sells to another country"]],"q":"Give one reason a country may import a product.","a":"It may lack the climate, resources, skills or supply to produce enough locally, or importing may be more efficient."},{"id":36,"module":"trade","title":"Free trade, tariffs and agreements","lead":"Free trade agreements reduce some barriers so countries can exchange goods and services more easily.","paras":["A tariff is a tax on an imported good. A tariff can make the imported product more expensive and may protect local producers, but it can also raise costs for consumers or businesses.","Australia and New Zealand have a long-standing free-trade relationship through the Closer Economic Relations agreement. Australia also has many other agreements with individual countries and regional groups.","The China–Australia Free Trade Agreement, known as ChAFTA, entered into force in 2015. DFAT states that by 1 January 2029, 99% of Australia's goods exports to China will enter duty-free.","Free trade does not remove every rule. Quarantine, safety standards, customs procedures and rules about where a product comes from can still apply."],"example":"If an import tariff is removed, an overseas product may enter at a lower cost. An Australian exporter may also gain better access to the other country's market.","terms":[["tariff","a tax on imported goods"],["free trade agreement","an agreement that reduces selected trade barriers between economies"]],"q":"What usually happens to the price pressure on an import when a tariff is removed?","a":"The tariff cost disappears, which can make the import cheaper, although other costs still affect the final price.","snapshot":"Current snapshot · ChAFTA entered into force in 2015; DFAT says 99% of Australian goods exports to China will enter duty-free by 1 January 2029."},{"id":37,"module":"trade","title":"Australia's current trading connections","lead":"Australia's trade network links the country strongly to Asia and North America, and the pattern changes as demand, prices, exchange rates and world events change.","paras":["Trade is the exchange of goods and services. Australia exports products and services it can supply competitively and imports products and services produced elsewhere. These links connect Australian mines, farms, universities and service businesses to consumers overseas, while Australian households and firms depend on imported vehicles, electronics, machinery, medicines and many other goods.","DFAT data for calendar year 2025 show that China remained Australia's largest two-way trading partner in goods and services at about A$326 billion. The United States was second at about A$158 billion, Japan third at about A$97.5 billion, the Republic of Korea fourth at about A$67.5 billion and India fifth at about A$50.2 billion.","The country relationships are different, not interchangeable. China buys large volumes of Australian iron ore, natural gas, agricultural products and education services. Japan buys Australian coal, natural gas, iron ore, beef and copper, while Australia buys Japanese passenger vehicles, goods vehicles and refined petroleum. The Republic of Korea buys Australian iron ore, coal, natural gas and beef, while Australia imports Korean cars and refined petroleum.","India's relationship has a strong services component: education was Australia's largest service export to India in 2025, valued at A$9.4 billion. Australian exports to India also include resources and industrial products, while imports from India include clothing, household linen, automotive parts and electrical parts. The United States relationship is especially important for services, technology and investment as well as goods, with Australia importing more from the United States than it exports there.","Trade rankings must always include a year because they change. Commodity prices, exchange rates, wars, tariffs, consumer demand and supply disruptions can quickly alter values. A current trade table is therefore more useful than an undated list."],"example":"Iron ore can leave an Australian port for an Asian steel producer, while cars, electronics or machinery travel in the opposite direction. Both flows depend on ports, shipping, contracts, finance and international relationships.","terms":[["two-way trade","the combined value of exports and imports between two economies"],["trade partner","an economy that regularly buys from or sells to another economy"],["trade balance","the difference between the value of exports and imports"]],"q":null,"a":null,"snapshot":"DFAT 2025 top five two-way partners · China A$326b; United States A$158b; Japan A$97.5b; Republic of Korea A$67.5b; India A$50.2b.","article":true,"sources":[["DFAT – Trade in goods and services","https://www.dfat.gov.au/trade/trade-and-investment-data-information-and-publications/trade-statistics/trade-in-goods-and-services"],["DFAT – China country brief","https://www.dfat.gov.au/geo/china/china-country-brief"],["DFAT – Trade and Investment at a Glance background material","https://www.dfat.gov.au/publications/trade-and-investment/trade-and-investment-glance-2020"],["DFAT – Japan country brief","https://www.dfat.gov.au/geo/japan/japan-country-brief"],["DFAT – Republic of Korea country brief","https://www.dfat.gov.au/geo/republic-of-korea/republic-of-korea-country-brief"],["DFAT – India country brief","https://www.dfat.gov.au/geo/india/india-country-brief"],["DFAT – United States country brief","https://www.dfat.gov.au/geo/united-states-of-america/united-states-of-america-country-brief"]],"countryExamples":[["China","Australia provides iron ore, natural gas, agricultural products and education-related travel services; China is Australia's largest two-way trading partner."],["United States","Major two-way trade in goods and services plus very large investment links; Australia imported over A$98b of U.S. goods and services in 2025 and exported about A$60b."],["Japan","Australia provides coal, natural gas, iron ore, beef and copper; Japan provides passenger vehicles, goods vehicles and refined petroleum."],["Republic of Korea","Australia provides iron ore, coal, natural gas and beef; Korea provides cars and refined petroleum."],["India","Australia provides education services, resources and agricultural/industrial exports; India provides goods including clothing, household linen, automotive and electrical parts."]]},{"id":38,"module":"trade","title":"Trade routes, disruption and interdependence","lead":"Trade networks make products widely available, but they also mean a disruption in one place can affect distant places.","paras":["Ships follow major sea routes between ports, while railways, roads and aircraft connect ports and airports to inland markets. Digital systems coordinate orders, tracking and payments.","A disruption can come from severe weather, conflict, strikes, port congestion, a factory shutdown or a shortage of shipping capacity. When one link fails, delays and costs can spread through the network.","Businesses can reduce risk by using several suppliers, keeping emergency stock or changing transport routes. These choices may increase resilience but can also cost more."],"example":"If a major shipping route is blocked, containers may take a longer route. Delivery times and freight prices can rise even for customers thousands of kilometres away.","terms":[["interdependence","a situation where people or places depend on one another"],["resilience","the ability to cope with disruption and recover"]],"q":"How can a port disruption affect a shop in another country?","a":"Goods may arrive late or cost more because the shop depends on the wider transport and supply network."},{"id":39,"module":"consumption","title":"Production and consumption","lead":"Production is how goods are made. Consumption is how goods and resources are bought, used, reused and disposed of.","paras":["Production can begin with farming, mining or other raw-material extraction. Materials are processed, parts are manufactured and products are assembled and packaged.","Consumption includes purchasing, using, maintaining, repairing, sharing, reusing, recycling and disposal. Consumer demand can influence how much companies produce.","Every stage can create economic, social and environmental effects. A factory may create jobs while using energy and water. A consumer gains a useful product but may later create waste."],"example":"Buying a phone connects a customer to mining, factories, software, freight, retail, repair and e-waste systems.","terms":[["production","the processes that turn materials into goods"],["consumption","the ways goods and resources are purchased, used and disposed of"]],"q":"What is the main difference between production and consumption?","a":"Production is making goods; consumption is buying, using, reusing and disposing of them."},{"id":40,"module":"consumption","title":"Case study article: the global journey of an iPhone","lead":"An iPhone connects mining, advanced component manufacturing, assembly, software, international freight, retail, repair and recycling across a global supply chain.","paras":["The journey starts long before final assembly. Apple's current supply-chain site says its supplier network includes thousands of supplier facilities in more than 60 countries. Those suppliers support design, materials sourcing, component manufacturing, assembly, logistics, repair and recycling.","The United States provides several clearly identified iPhone inputs. Corning's Harrodsburg, Kentucky facility is being expanded to make 100% of the cover glass used on iPhone and Apple Watch units sold worldwide. TSMC's Arizona facility manufactures advanced Apple silicon. GlobalWafers in Texas produces semiconductor wafers, Samsung's Austin facility is developing chip technology for Apple, GlobalFoundries in New York supplies advanced wireless and power-management technologies, and Amkor in Arizona packages and tests Apple silicon.","China mainland remains an important assembly location: Apple's own 2026 supply-chain site explicitly shows iPhone assembly in China mainland. India is another major production base. Apple identifies component manufacturing in India, while Foxconn and Tata operate iPhone assembly operations there as Apple diversifies production away from reliance on one country.","This is why the phrase 'made in' can oversimplify an iPhone. A phone can contain U.S.-made glass and chips, components made at supplier facilities in several other countries, and final assembly in China or India before being shipped to Australia or another consumer market.","The product then moves through global transport and distribution systems. Apple states that shifting freight from air to ocean can reduce transport emissions substantially; sea freight emits far less carbon on average than air freight, although aircraft remain useful when speed is essential.","The original learning questions ask for an 'intended lifespan'. Apple does not publish one fixed number of years for every iPhone. Instead, the company describes longevity through durable design, software support and repair access. Apple states that service and parts are generally available for at least five years after a model was last distributed, and may be available for up to seven years depending on law and parts availability.","When a phone becomes old or damaged, several pathways are possible. It can be repaired, traded in, refurbished and sold to another user, stored unused, exported as second-hand equipment or sent for recycling. Apple uses systems such as its Daisy disassembly robot to separate devices and recover materials from models that cannot be reused.","The case shows why consumers and producers both benefit but in different ways. Consumers receive communication, entertainment, navigation and work tools; Apple and suppliers earn revenue and support employment. The costs include resource extraction, factory energy use, transport emissions, labour risks and eventual electronic waste. A balanced judgement therefore considers benefits and costs across the entire lifecycle."],"example":"The phone in a student's hand may connect mineral extraction in one region, chip production in another, assembly elsewhere, software teams, ocean and air freight, an Australian retailer and an eventual recycling system.","terms":[["product lifecycle","the stages from raw-material extraction through production, use and end-of-life"],["component","a part used to make a larger product"],["refurbishment","repairing and restoring a used product so it can be used again"]],"q":null,"a":null,"snapshot":"Current supply-chain picture · Apple says its network spans 60+ countries. Named iPhone inputs include U.S.-made cover glass and silicon, with iPhone assembly in China mainland and a major assembly/component base in India.","article":true,"sources":[["Apple – Supply Chain Innovation","https://www.apple.com/au/supply-chain/"],["Apple – 2026 Environmental Progress Report","https://www.apple.com/environment/pdf/Apple_Environmental_Progress_Report_2026.pdf"],["Apple – Service after warranty","https://support.apple.com/en-au/102772"],["Globalisation impacts background video","https://www.youtube.com/watch?v=dWjWfyzmk1Q"],["Apple – Corning Kentucky iPhone cover glass","https://www.apple.com/newsroom/2025/08/apple-corning-to-manufacture-all-iphone-apple-watch-cover-glass-in-kentucky/"],["Apple – American Manufacturing Program","https://www.apple.com/newsroom/2025/08/apple-increases-us-commitment-to-600-billion-usd-announces-ambitious-program/"],["Reuters – Apple expands iPhone assembly in India","https://www.reuters.com/world/china/apple-aims-source-all-us-iphones-india-pivot-away-china-ft-reports-2025-04-25/"]],"countryExamples":[["United States – Kentucky","Corning manufactures iPhone cover glass."],["United States – Arizona","TSMC manufactures advanced Apple silicon; Amkor packages and tests Apple silicon."],["United States – Texas","GlobalWafers produces semiconductor wafers and Samsung's Austin facility supplies chip technology for Apple products."],["United States – New York","GlobalFoundries manufactures wireless and power-management technologies used in Apple devices."],["China mainland","Apple identifies iPhone assembly at supplier facilities there."],["India","Apple identifies component manufacturing there; Foxconn and Tata are major iPhone assembly partners."]]},{"id":41,"module":"consumption","title":"iPhone impacts, e-waste and more sustainable electronics","lead":"The environmental and social impact of a smartphone depends on how materials are sourced, how the device is manufactured and transported, how long it is used and what happens at the end of its life.","paras":["Environmental impacts begin with extracting and processing materials. Mining and refining use land, water and energy and can create pollution. Manufacturing complex electronics also requires large amounts of electricity and highly specialised industrial processes. Shipping finished devices adds further emissions.","Electronic waste is a rapidly growing global problem. The Global E-waste Monitor reported that the world generated about 62 million tonnes of e-waste in 2022. Only 22.3% was documented as formally collected and recycled in an environmentally sound way. The report projects continued growth if consumption and recycling systems do not change.","Discarded electronics can contain valuable metals as well as substances that create environmental and health risks if devices are burned, dumped or dismantled unsafely. Informal recycling may expose workers and communities to hazardous materials while also losing valuable resources that could be recovered.","There are several ways to reduce the impact. The most powerful is often extending product life: protect a device, replace a battery, repair damage, sell it second-hand or refurbish it rather than replacing it unnecessarily. At the end of useful life, formal take-back and recycling systems can recover materials more safely.","Apple reported in April 2026 that 30% of material by weight across products shipped in 2025 came from recycled content. It also reported 100% recycled cobalt in Apple-designed batteries and 100% recycled rare-earth elements in magnets. These are company-specific achievements rather than proof that the entire electronics sector is sustainable, but they show how design can reduce demand for some newly mined materials.","Economic and social impacts are mixed. Smartphones create jobs, support digital businesses and connect people to education and services. At the same time, unequal access contributes to the digital divide, and global supply chains require continued attention to labour rights and responsible mineral sourcing."],"example":"Replacing a worn battery can keep a phone in use for several more years, delaying the environmental cost of manufacturing a replacement and reducing e-waste.","terms":[["e-waste","discarded electrical and electronic equipment"],["formal recycling","collection and recycling through regulated systems designed to manage materials safely"],["circular economy","a system that keeps products and materials in use for longer through repair, reuse and recycling"]],"q":null,"a":null,"snapshot":"Current evidence · 62m tonnes of global e-waste in 2022; 22.3% formally collected and recycled. Apple: 30% recycled material by weight across products shipped in 2025.","article":true,"sources":[["Global E-waste Monitor 2024","https://www.itu.int/en/ITU-D/Environment/Pages/Publications/The-Global-E-Waste-Monitor-2024.aspx"],["Apple – 2026 recycled-material update","https://www.apple.com/au/newsroom/2026/04/apple-accelerates-progress-with-highest-ever-recycled-material-in-its-products/"],["Apple – Environment","https://www.apple.com/au/environment/"]]},{"id":42,"module":"consumption","title":"Case study article: Nike as a transnational corporation","lead":"Nike is a transnational corporation because brand management, design, sourcing, manufacturing and sales operate across many countries through a large network of independent suppliers.","paras":["Nike is a transnational corporation because its headquarters, design and brand management are separated geographically from most manufacturing. Nearly all Nike footwear and apparel is made by independent contract manufacturers rather than in factories owned by Nike.","The latest Nike annual filing makes the geography specific. In fiscal 2026, Vietnam produced about 52% of NIKE Brand footwear, Indonesia 27% and China 16%. Together, those three countries produced about 95% of Nike footwear.","Apparel has a different pattern. In fiscal 2026, Vietnam produced about 34% of NIKE Brand apparel, Cambodia 15% and China 12%. The remaining apparel was spread across other manufacturing countries. This is a useful example of why a statement such as 'Nike makes products in 37 countries' is not enough: the largest shares are heavily concentrated in a few named places.","Nike's contract manufacturers also buy materials from Tier 2 suppliers. The main footwear materials include natural and synthetic rubber, plastic compounds, foam cushioning, natural and synthetic leather, nylon, polyester, natural-fibre textiles and polyurethane films used in Nike Air cushioning components.","This global network creates economic opportunities. Supplier factories provide employment and export income, while Nike gains specialised manufacturing capacity and the ability to serve a worldwide market. The same concentration also creates risk: a disruption in Vietnam, Indonesia, China or Cambodia can affect production far beyond those countries.","The negative side of the case concerns responsibility across the supply chain. Nike uses a Code of Conduct and Code Leadership Standards and audits Tier 1 finished-goods suppliers and Tier 2 materials suppliers. Labour, wage, health, safety and environmental risks therefore remain part of the geographical analysis, not an optional extra.","The geography lesson is that responsibility follows interconnection. Decisions made by a global brand about prices, deadlines, supplier selection and standards can affect workers and environments in factories thousands of kilometres from the company's headquarters."],"example":"A Nike shoe can be designed and marketed through a global brand, manufactured by an independent supplier in Asia, shipped through international ports and sold in Australia. The product links corporate decisions to distant workers and consumers.","terms":[["transnational corporation","a company that organises business activities across more than one country"],["Tier 1 supplier","a supplier that provides finished goods directly to a company"],["supplier code of conduct","standards a company requires suppliers to follow"]],"q":null,"a":null,"snapshot":"Nike FY2026 · Footwear: Vietnam 52%, Indonesia 27%, China 16%. Apparel: Vietnam 34%, Cambodia 15%, China 12%.","article":true,"sources":[["The Globalisation of Nike – background video","https://www.youtube.com/watch?v=b0jG8jJCMfU"],["Nike – Responsible Supply Chain","https://about.nike.com/en/mission/focus-areas/responsible-supply-chain"],["Nike Manufacturing Map","https://manufacturingmap.nikeinc.com/"],["Nike – FY25 foundational expectations","https://about.nike.com/en/mission/initiatives/foundational-expectations-and-code-of-conduct"],["Nike FY2026 Form 10-K – SEC","https://www.sec.gov/Archives/edgar/data/320187/000032018726000088/nke-20260531.htm"]],"countryExamples":[["Vietnam","About 52% of NIKE Brand footwear and 34% of apparel in FY2026."],["Indonesia","About 27% of NIKE Brand footwear in FY2026."],["China","About 16% of NIKE Brand footwear and 12% of apparel in FY2026."],["Cambodia","About 15% of NIKE Brand apparel in FY2026."],["Other supplier countries","The remaining footwear/apparel production is distributed across additional countries shown in Nike's Manufacturing Map; Nike updates that map quarterly."]]},{"id":43,"module":"consumption","title":"Case study article: the dark side of chocolate","lead":"Chocolate connects consumers to cocoa-growing communities, traders, processors and manufacturers, but the cocoa supply chain also exposes serious problems involving poverty, child labour and environmental pressure.","paras":["Chocolate begins with cocoa beans grown in tropical countries. Côte d'Ivoire and Ghana are the two countries at the centre of the child-labour case used here; Nigeria is another West African cocoa origin, while Ecuador and Colombia are important Latin American origins used by global chocolate companies such as Ferrero. Beans are fermented and dried near farms, then sold through traders and processors before becoming cocoa liquor, cocoa butter, cocoa powder and finished chocolate.","The economic connection is unequal. Farmers produce the essential raw material but may receive only a small share of the final retail value. Low and unstable farm incomes make it difficult for households to pay for labour, education and basic services, which can increase the risk that children work on farms.","The International Cocoa Initiative currently estimates that about 1.56 million children are in child labour in cocoa-growing areas of Côte d'Ivoire and Ghana. It emphasises that not all tasks performed by children are child labour: the concern is work that is hazardous, interferes with schooling or harms children's development.","Hazardous activities can include using sharp tools, carrying heavy loads or exposure to agrochemicals. The problem is connected to poverty, limited school access, labour shortages and weak services rather than having one simple cause. This is why banning a product alone does not automatically solve the underlying conditions.","Responses involve governments, cocoa companies, NGOs and farming communities. Child Labour Monitoring and Remediation Systems identify children at risk and connect households with support. ICI reports that tested interventions can reduce child-labour prevalence by up to one-third when properly implemented.","Environmental sustainability is another issue. Expanding cocoa farming can contribute to forest loss if production moves into protected or high-conservation areas. More traceable supply chains, better farm productivity, agroforestry and stronger income support can help reduce pressure to clear new land.","Consumers are connected to these issues through demand, but responsibility is shared. Companies control sourcing systems and prices, governments set and enforce rules, NGOs provide monitoring and support, and consumers can seek credible information and certification. Sustainable chocolate requires changes across the supply chain."],"example":"A chocolate bar purchased in Sydney may begin with beans grown by a smallholder family in Côte d'Ivoire or Ghana, then pass through exporters, processors and manufacturers before reaching a supermarket.","terms":[["child labour","work that harms children's development or interferes with education, as defined by international standards"],["smallholder","a farmer operating on a relatively small area of land"],["remediation","action taken to address and reduce an identified problem"]],"q":null,"a":null,"snapshot":"Current estimate · International Cocoa Initiative: about 1.56m children in child labour in cocoa in Côte d'Ivoire and Ghana.","article":true,"sources":[["International Cocoa Initiative – Child labour in cocoa","https://www.cocoainitiative.org/issues/child-labour-cocoa"],["International Cocoa Initiative – What works to tackle child labour","https://www.cocoainitiative.org/knowledge-hub/resources/what-works-tackle-child-labour"]],"countryExamples":[["Côte d'Ivoire","Major cocoa-producing country and one of the two countries covered by the ICI child-labour estimate."],["Ghana","Major cocoa-producing country and the other country covered by the ICI child-labour estimate."],["Nigeria","Another West African cocoa origin used in international cocoa supply chains."],["Ecuador and Colombia","Examples of Latin American cocoa origins; Ferrero lists both among its cocoa-source countries."]]},{"id":44,"module":"consumption","title":"Who can respond to production and consumption problems?","lead":"Governments, NGOs, companies and individuals have different powers, so effective change usually needs more than one group.","paras":["Governments can create laws, safety rules, environmental standards, waste systems and inspections. In the cocoa sector, current 2024–2029 action frameworks in Ghana and Côte d’Ivoire include education, social protection, traceability and child-protection systems.","NGOs can support communities, monitor conditions, provide education, restore environments and campaign for change. Organisations such as World Vision are examples of NGOs working on development and community issues.","Businesses can trace suppliers, improve standards, redesign products, reduce waste and publish supply-chain information. Consumers can keep products longer, repair and recycle, choose products carefully and ask companies for better information.","No group can solve a complex global supply-chain problem alone. Rules need enforcement, businesses need workable systems, communities need resources and consumers need realistic choices."],"example":"Reducing e-waste may involve government recycling rules, company take-back programs, repair businesses and consumers choosing to repair a device instead of replacing it immediately.","terms":[["NGO","a non-government organisation working independently from government, often on social, humanitarian or environmental issues"],["regulation","an official rule used to control an activity"]],"q":"Why are several groups usually needed to solve a global supply-chain problem?","a":"Because governments, businesses, NGOs and consumers control different parts of the system and have different powers and responsibilities."},{"id":45,"module":"consumption","title":"Making production and consumption more sustainable","lead":"Sustainable production and consumption try to reduce harm while still meeting people's needs.","paras":["Businesses can design products that last longer, use recycled materials, reduce packaging, improve energy efficiency and make repair easier. They can also improve supply-chain transparency and working conditions.","Governments can set product standards, regulate pollution, support recycling and create rules for waste and worker safety. Communities and NGOs can raise awareness and help monitor impacts.","Individuals can buy less when a purchase is not needed, reuse products, repair them, share or buy second-hand, recycle correctly and learn where products come from.","The strongest solution is often circular: materials remain in use for longer and waste becomes an input for another product instead of being thrown away."],"example":"A phone is used for several years, its battery is replaced, it is sold second-hand, and the device is eventually recycled so some metals can be recovered for new products.","terms":[["circular economy","a system that keeps products and materials in use for longer through reuse, repair and recycling"],["sustainable consumption","using goods and resources in ways that reduce long-term harm"]],"q":"What is one way to make a product's lifecycle more circular?","a":"Repair, reuse, refurbishment, sharing or recycling can keep a product or its materials in use for longer."},{"id":46,"module":"foundations","title":"Globalisation and developing economies","lead":"Globalisation can create jobs, investment and access to technology in developing economies, but it can also reproduce inequality when bargaining power, wages and environmental protections are weak.","paras":["The original globalisation material asks students to consider both positive and negative impacts on developing countries. The positive side begins with access to global markets. Farmers, factories and service businesses can sell to customers overseas, while foreign companies can invest money, technology and management expertise.","Employment can raise household incomes and government revenue. Infrastructure such as ports, roads, telecommunications and electricity may improve when a place becomes part of a major production network. Consumers can also gain access to cheaper products, smartphones, medicines and information.","However, investment does not guarantee fair outcomes. Companies may locate production where wages are lower, and workers can face long hours, unsafe conditions or weak bargaining power if regulation and enforcement are poor. Local firms may struggle to compete with very large multinational companies.","Environmental costs can also be shifted toward producing regions. Mining, intensive farming, industrial water use, factory pollution and freight emissions may occur far from the final consumer. This means the places that receive jobs can also carry a large share of the environmental burden.","Dependence is another risk. If a community relies heavily on one export, factory or foreign market, a global price fall or corporate decision to relocate can cause rapid job losses. Diversifying industries, strengthening skills and improving local value-added production can reduce this vulnerability.","A good judgement therefore avoids saying globalisation is simply beneficial or harmful. The outcome depends on wages, worker protection, environmental rules, taxation, local ownership, education, infrastructure and whether the benefits are distributed widely."],"example":"A garment factory may create hundreds of jobs and export income, while also creating concerns about wages, safety and pollution. Both effects are part of the same interconnection.","terms":[["foreign direct investment","investment by a company in business operations in another country"],["bargaining power","the ability of a person or group to influence wages or conditions"],["economic dependence","relying heavily on a limited market, company or export"]],"q":null,"a":null,"article":true,"sources":[["Globalisation explained – Explainity video","https://www.youtube.com/watch?v=JJ0nFD19eT8"]]}];

 return '<section class="activity-wrap reveal-card"><div class="eyebrow">Cause-and-effect simulator</div><h3>What if a place goes viral?</h3><p>Move the social-media attention r. This is a simple model, not real measured data.</p><div class="sim-grid"><div class="sim-panel"><label><b>Social-media attention</b></label><input class="range" id="viralRange" type="range" min="0" max="100" value="45"><div class="mission"><b id="viralLabel">Growing attention</b><span id="viralText">More people discover the place.</span></div></div><div class="sim-panel">'+["Visitors","Local income","Crowding","Environmental pressure"].map((x,i)=>'<div class="bar-row"><span>'+x+'</span><div class="bar-track"><div class="bar-fill" id="viralBar'+i+'"></div></div><output id="viralOut'+i+'"></output></div>').join("")+'</div></div></section>'

function tourismSorter(){
 const items=[["Jobs for local people","p"],["Litter and pollution","n"],["Income for local businesses","p"],["Habitat destruction","n"],["Improved infrastructure","p"],["Higher cost of living","n"],["Conservation funding","p"],["Overcrowding","n"]];

}
function containerActivity(){
 const steps=[["1","Factory","Goods are packed into a standard container."],["2","Truck","The sealed container moves to a port."],["3","Ship","A container ship carries it overseas."],["4","Port","Cranes move the same container off the ship."],["5","Rail / truck","The container travels inland."],["6","Shop","Goods reach a warehouse or retailer."]];

}
function digitalActivity(){
 return '<section class="activity-wrap reveal-card"><div class="eyebrow">Access simulator</div><h3>What can internet access change?</h3><p>Move the r from limited to strong access. This is a concept model, not country data.</p><div class="sim-grid"><div class="sim-panel"><label><b>Digital access</b></label><input class="range" id="digitalRange" type="range" min="0" max="100" value="30"><div class="mission"><b id="digitalLabel">Limited access</b><span id="digitalText"></span></div></div><div class="sim-panel">'+["Learning","Health services","Business","Communication"].map((x,i)=>'<div class="bar-row"><span>'+x+'</span><div class="bar-track"><div class="bar-fill" id="digitalBar'+i+'"></div></div><output id="digitalOut'+i+'"></output></div>').join("")+'</div></div></section>'

function tradeSorter(){
 const items=[["Car bought from Japan","i"],["Australian wheat sold overseas","e"],["Phone bought from overseas","i"],["Australian coal sold overseas","e"],["Coffee beans bought from Brazil","i"],["Australian education service sold to an overseas student","e"]];

function lifecycleActivity(){
 const steps=[["RAW MATERIALS","Materials are extracted or grown."],["PARTS","Factories make components."],["ASSEMBLY","Parts become the finished product."],["TRANSPORT","The product moves to markets."],["USE","Consumers buy and use it."],["END OF LIFE","Repair, reuse, recycle or waste."]];

function wireActivity(id){
 if(id==="foundations"){document.querySelectorAll("[data-flow]").forEach((b,i)=>b.onclick=()=>{document.querySelectorAll("[data-flow]").forEach(x=>x.classList.remove("correct"));b.classList.add("correct");const copy=["Design choices can connect to culture, trends and technology.","Raw materials connect products to farms, mines and environments.","Factories connect products to workers, energy and production places.","Transport creates links through roads, rail, ports, ships and planes.","Retail and online systems connect products to markets and consumers.","Consumer choices affect demand, waste, reuse and future production."];document.getElementById("flowReadout").innerHTML="<b>"+b.querySelector("b").textContent+"</b>"+copy[i]})}
 if(id==="personal"){const flows={"T-shirt":["Cotton / fibre","Factory","Container ship","Shop","You"],Phone:["Minerals","Parts","Assembly","Air / sea freight","You"],Chocolate:["Cocoa farm","Processor","Factory","Shipping","You"],Sneakers:["Materials","Factory","Distribution centre","Shop / website","You"],"Video game":["Developers","Servers","Online store","Internet network","You"]};document.querySelectorAll("[data-product]").forEach(b=>b.onclick=()=>{document.getElementById("productFlow").innerHTML=flows[b.dataset.product].map((x,i)=>'<div class="flow-step"><b>'+String(i+1).padStart(2,"0")+'</b><small>'+x+'</small></div>').join('<span class="flow-arrow">→</span>')})}
 if(id==="skills")setupClimate();
 if(id==="travel")setupInstagram();
 if(id==="tourism")setupImpactSorter();
 if(id==="transport")document.querySelectorAll("[data-container]").forEach(b=>b.onclick=()=>{document.querySelectorAll("[data-container]").forEach(x=>x.classList.remove("correct"));b.classList.add("correct");document.getElementById("containerReadout").innerHTML="<b>"+b.querySelector("b").textContent+"</b>"+b.querySelector("small").textContent});
 if(id==="communication")setupDigital();
 if(id==="trade")setupTrade();
 if(id==="consumption"){const copy=["Extraction can create jobs, but it can also disturb land and use water.","Parts factories use workers, energy and materials.","Assembly creates jobs and connects many suppliers.","Transport links markets but uses fuel and infrastructure.","Consumers gain benefits, but demand encourages more production.","Repair and recycling can reduce waste; disposal can create pollution and e-waste."];document.querySelectorAll("[data-life]").forEach((b,i)=>b.onclick=()=>{document.querySelectorAll("[data-life]").forEach(x=>x.classList.remove("correct"));b.classList.add("correct");document.getElementById("lifeReadout").innerHTML="<b>"+b.querySelector("b").textContent+"</b>"+copy[i]})}
}
function setupClimate(){
 const temps=[-3,-4,0,5,10,14,19,19,16,10,5,-1],rain=[141,119,113,112,119,94,94,96,117,120,143,126],months=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
 const svg=document.getElementById("climateSvg"),btns=document.getElementById("monthBtns");if(!svg)return;
 let s='<line x1="48" y1="250" x2="610" y2="250" stroke="currentColor" opacity=".35"/><line x1="48" y1="30" x2="48" y2="250" stroke="currentColor" opacity=".35"/>';
 const baseY=250,maxR=160;rain.forEach((v,i)=>{const x=55+i*45,h=v/maxR*170;s+='<rect x="'+x+'" y="'+(baseY-h)+'" width="28" height="'+h+'" rx="3" fill="currentColor" opacity=".18"/>';s+='<text x="'+(x+14)+'" y="270" text-anchor="middle" font-size="12" fill="currentColor" opacity=".65">'+months[i]+'</text>'});
 const pts=temps.map((v,i)=>[(69+i*45),(220-(v+5)/25*160)]);s+='<polyline points="'+pts.map(p=>p.join(",")).join(" ")+'" fill="none" stroke="currentColor" stroke-width="3"/>';pts.forEach(p=>s+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="4" fill="currentColor"/>');svg.innerHTML=s;
 btns.innerHTML=months.map((m,i)=>'<button class="month-btn '+(i===0?"active":"")+'" data-month="'+i+'">'+m+'</button>').join("");
 document.querySelectorAll("[data-month]").forEach(b=>b.onclick=()=>{const i=+b.dataset.month;document.querySelectorAll("[data-month]").forEach(x=>x.classList.toggle("active",x===b));document.getElementById("climateReadout").innerHTML="<b>"+months[i]+"</b>Temperature: "+temps[i]+"°C · Precipitation: "+rain[i]+" mm"})
}
function setupInstagram(){const r=document.getElementById("viralRange");const update=()=>{const v=+r.value,vals=[Math.min(100,v+15),Math.round(v*.78),Math.max(5,Math.round(v*.92)),Math.max(5,Math.round(v*.75))];vals.forEach((x,i)=>{document.getElementById("viralBar"+i).style.setProperty("--v",x+"%");document.getElementById("viralOut"+i).textContent=x});let label,text;if(v<30){label="Low attention";text="The place is less visible online and visitor pressure is lower."}else if(v<70){label="Growing attention";text="More people discover the place. Income can rise, but crowding also grows."}else{label="Viral destination";text="Very high visibility can create strong business demand and strong pressure on the place."}document.getElementById("viralLabel").textContent=label;document.getElementById("viralText").textContent=text};r.oninput=update;update()}
function setupDigital(){const r=document.getElementById("digitalRange");const update=()=>{const v=+r.value,[a,b,c,d]=[v,Math.max(0,v-8),Math.max(0,v-4),Math.min(100,v+7)];[a,b,c,d].forEach((x,i)=>{document.getElementById("digitalBar"+i).style.setProperty("--v",x+"%");document.getElementById("digitalOut"+i).textContent=x});if(v<35){document.getElementById("digitalLabel").textContent="Limited access";document.getElementById("digitalText").textContent="People may miss online learning, telehealth, markets and fast communication."}else if(v<70){document.getElementById("digitalLabel").textContent="Growing access";document.getElementById("digitalText").textContent="More services and information become reachable, but gaps can remain."}else{document.getElementById("digitalLabel").textContent="Strong access";document.getElementById("digitalText").textContent="Digital links can support learning, services, business and communication more consistently."}};r.oninput=update;update()}
function setupImpactSorter(){let selected=null,score=0,done=new Set;document.querySelectorAll("[data-impact]").forEach(b=>b.onclick=()=>{selected=b;b.style.borderColor="var(--sand)"});const place=kind=>{if(!selected||done.has(selected.dataset.impact))return;const ok=selected.dataset.kind===kind;if(ok){score++;selected.classList.add("correct")}else selected.classList.add("wrong");done.add(selected.dataset.impact);document.getElementById(kind==="p"?"positiveZone":"negativeZone").appendChild(selected);document.getElementById("sortFeedback").innerHTML="<b>Score: "+score+" / "+done.size+"</b>"+(ok?"Correct.":"Not quite. Think about who or what is affected.");selected=null};document.getElementById("positiveBtn").onclick=()=>place("p");document.getElementById("negativeBtn").onclick=()=>place("n")}
function setupTrade(){const correct=["i","e","i","e","i","e"],done=new Set;let score=0;document.querySelectorAll("[data-trade]").forEach(b=>b.onclick=()=>{const i=+b.dataset.trade;if(done.has(i))return;done.add(i);const ok=b.dataset.pick===correct[i];if(ok){score++;b.classList.add("correct")}else b.classList.add("wrong");document.getElementById("tradeMsg"+i).textContent=ok?"Correct.":("Answer: "+(correct[i]==="i"?"IMPORT":"EXPORT"));document.getElementById("tradeScore").textContent=score+" / "+done.size+" correct"})}

function doSearch(){
 const q=search.value.trim().toLowerCase();if(!q){currentModule?showModule(currentModule):home();return}
 currentModule=null;
 const hits=TOPICS.filter(t=>[t.title,t.lead,...t.paras,t.example,...t.terms.flat(),t.q,t.a,t.snapshot||""].join(" ").toLowerCase().includes(q));
 app.innerHTML='<main class="topic-page"><button class="back" id="back">← Back to overview</button><div class="section-head"><div><div class="eyebrow">Search</div><h2>'+hits.length+' result'+(hits.length===1?"":"s")+'</h2></div><p>Showing matches for “'+esc(q)+'”.</p></div><div class="topic-list">'+(hits.length?hits.map(topicHTML).join(""):'<div class="empty">No match yet. Try a shorter word such as trade, travel, map, internet or tourism.</div>')+'</div></main>';
 document.getElementById("back").onclick=()=>{search.value="";home()};wireTopics();document.querySelectorAll(".topic").forEach(d=>d.open=true)
}

search.addEventListener("input",doSearch);
document.getElementById("brand").onclick=e=>{e.preventDefault();home()};
document.getElementById("overviewBtn").onclick=home;
document.getElementById("glossaryBtn").onclick=showGlossary;
document.getElementById("sourcesBtn").onclick=showSources;
document.getElementById("missionBtn").onclick=()=>{home();setTimeout(()=>document.querySelector(".fun-grid").scrollIntoView({behavior:"smooth"}),0)};

document.addEventListener("keydown",e=>{if(e.key==="/"&&document.activeElement!==search){e.preventDefault();search.focus()}if(e.key==="Escape"&&document.activeElement===search){search.value="";search.blur();home()}});
window.addEventListener("scroll",()=>{const h=document.documentElement.scrollHeight-innerHeight;document.getElementById("scrollbar").style.width=(h>0?scrollY/h*100:0)+"%"},{passive:true});
const savedTheme=localStorage.getItem("ic_theme");if(savedTheme)document.documentElement.dataset.theme=savedTheme;
function themeLabel(){theme.textContent=document.documentElement.dataset.theme==="dark"?"LIGHT":"DARK"}
theme.onclick=()=>{document.documentElement.dataset.theme=document.documentElement.dataset.theme==="dark"?"light":"dark";localStorage.setItem("ic_theme",document.documentElement.dataset.theme);themeLabel()};
themeLabel();updateProgress();home();
