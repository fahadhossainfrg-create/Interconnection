nt strategies because ecosystems and communities have different needs.","paras":["Ecotourism is responsible travel to natural areas that aims to conserve the environment, support local communities and educate visitors. It is different from ordinary nature tourism because sustainability and conservation are part of the purpose, not simply the scenery.","Examples include the Great Barrier Reef in Australia, where operators must follow marine-park rules; the Galápagos Islands in Ecuador, where access and visitor behaviour are tightly managed; rainforest and wildlife tourism in Costa Rica; Yellowstone National Park in the United States; and orangutan-focused rainforest experiences in Malaysian and Indonesian Borneo.","Good ecotourism uses trained local guides, follows wildlife-viewing rules, reduces waste and emissions, protects habitats and directs some economic benefit toward local communities or conservation. The strongest examples therefore connect tourism income to protection of the place visitors came to experience."],"example":"A wildlife tour that keeps a safe distance, uses trained local guides and limits group size can create income without encouraging visitors to approach or feed animals.","terms":[["carrying capacity","the level of use a place can handle without unacceptable damage"],["conservation","protection and careful management of environments and species"]],"q":null,"a":null,"article":true,"sampleQuestion":"Compare two ways ecotourism can protect natural areas. (5 marks)","peal":{"point":"Ecotourism can protect natural areas through visitor management and by creating economic value for conservation.","evidence":"The Galápagos uses strict visitor controls, while Costa Rican nature tourism supports protected forests and local employment.","analysis":"Both approaches reduce pressure to damage natural environments while still allowing communities to benefit economically.","link":"Therefore, ecotourism can link conservation with sustainable local development."}},{"id":26,"module":"transport","title":"Transport and the shrinking world","lead":"Faster and cheaper transport makes long distances feel smaller because people and goods can cross them more easily.","paras":["The steam engine transformed ships and railways. The internal combustion engine later supported cars, trucks and many aircraft technologies. Each change increased speed, reliability or the amount that could be moved.","Modern transport connects people to work, family, tourism and services. It connects businesses to suppliers and customers and makes global production possible.","The phrase shrinking world does not mean Earth is physically smaller. It means that the time, cost and difficulty of connecting across distance have been reduced."],"example":"A voyage between Europe and Australia once took many weeks or months by sailing ship. Modern aircraft can cover the intercontinental journey in about a day.","terms":[["transport network","connected routes used to move people or goods"],["shrinking world","the idea that faster transport and communication reduce the importance of distance"]],"q":"Why is the world described as shrinking?","a":"Because improved transport and communication reduce the time and difficulty of connecting over long distances.","sampleQuestion":"Explain the idea of the 'shrinking world'. (4 marks)","peal":{"point":"The shrinking world describes how faster transport and communication reduce the practical importance of distance.","evidence":"Modern aircraft can move people between Australia and Europe in about a day instead of months by sailing ship.","analysis":"Reduced travel time makes business, tourism and personal connections easier across long distances.","link":"Therefore, technological change makes the world feel more connected even though physical distances remain the same."}},{"id":27,"module":"transport","title":"How the shipping container changed global trade","lead":"Standard shipping containers reduced the time and cost of moving goods between ships, trains and trucks, helping create today's highly interconnected global supply chains.","paras":["Before containerisation, cargo was often loaded and unloaded piece by piece. This was slow, labour-intensive and vulnerable to damage or theft. Standard containers transformed the system because the same sealed box could move from factory to truck, rail terminal, ship and another truck without repeatedly unpacking the goods.","Containerisation helped ports become faster and more specialised. Cranes, container terminals, tracking systems and standard dimensions allowed much larger volumes of goods to move through global networks. Factories could be located far from consumers because transport became more predictable and relatively cheaper.","The result is visible in everyday products. Clothing, furniture, electronics, toys and machinery can cross oceans in containers and then move inland by rail or road. This helps businesses use global supply chains but also increases dependence on ports, shipping routes and logistics systems.","UN Trade and Development reports that more than 80% of international trade in goods by volume is carried by sea. Its 2025 review also shows the vulnerability of these networks: global maritime trade growth was expected to slow to about 0.5% in 2025 as geopolitical tensions and route disruptions increased distances and costs.","Container shipping therefore creates both efficiency and interdependence. When a major port closes or ships avoid a chokepoint, containers may arrive late, freight costs can rise and factories or shops thousands of kilometres away may feel the effects."],"example":"A pair of shoes can leave a factory in a sealed container, travel by truck to a port, cross the ocean by container ship and move by rail and truck to a distribution centre without the individual boxes being handled at every stage.","terms":[["containerisation","the use of standard freight containers across different transport modes"],["intermodal transport","moving goods using more than one form of transport without unloading the cargo itself"],["chokepoint","a narrow route through which a large amount of transport or trade must pass"]],"q":null,"a":null,"article":true,"snapshot":"Current context · UNCTAD 2025: more than 80% of world merchandise trade by volume moves by sea; maritime trade growth was projected at only 0.5% in 2025.","sources":[["UNCTAD – Review of Maritime Transport 2025","https://unctad.org/publication/review-maritime-transport-2025"]],"sampleQuestion":"Explain how containerisation changed global trade. (5 marks)","peal":{"point":"Containerisation made global trade faster, cheaper and more efficient.","evidence":"Standard containers can move between trucks, ships and trains without goods being unpacked at each stage.","analysis":"This reduces handling time, labour costs, damage and delays and makes long global supply chains easier to organise.","link":"Therefore, the shipping container helped increase the scale and speed of international trade."}},{"id":28,"module":"transport","title":"How airplanes strengthen global interconnections","lead":"Air transport compresses time by moving people and high-value or time-sensitive goods across continents within hours rather than days or weeks.","paras":["Airplanes strengthen global interconnections by reducing the time needed to move between countries and continents. Journeys that once took weeks by sea can now be completed in hours, making international holidays, family visits, migration, study and work much easier.","Aviation supports trade and business by moving people and high-value or time-sensitive cargo such as medicines, electronics, spare parts and fresh produce. IATA reported global air-cargo demand in August 2026 was 4.4% higher than a year earlier, with international cargo traffic up 5.3%.","Air travel also supports tourism and cultural exchange. Students, workers and tourists carry languages, ideas, food traditions and experiences between places, while hub airports connect cities through global route networks.","The benefit comes with an environmental cost because aircraft burn large quantities of fuel and create greenhouse-gas emissions. This is why aviation efficiency, sustainable aviation fuels and alternatives such as rail are increasingly important parts of transport planning."],"example":"A medical device made in another continent can be flown to Australia within a short time when a hospital needs it urgently, while less time-sensitive equipment may travel by sea.","terms":[["air cargo","goods transported by aircraft"],["hub airport","a major airport where passengers or cargo connect between routes"],["time-space compression","the idea that faster transport and communication make distance feel less significant"]],"q":null,"a":null,"article":true,"snapshot":"Latest cargo indicator · August 2026: global air-cargo demand +4.4% year on year; international cargo traffic +5.3%.","sources":[["Airplanes and global interconnections – Video","https://www.youtube.com/watch?v=B65k9h0Y7HY"],["Airplanes and global interconnections – Video","https://www.youtube.com/watch?v=YYFckQbvpxI"],["IATA – Air Cargo Market Analysis August 2026","https://www.iata.org/en/publications/economics/reports/air-cargo-market-analysis-august-2026/"]],"sampleQuestion":"Explain how airplanes strengthen global interconnections. (5 marks)","peal":{"point":"Airplanes strengthen interconnections by moving people and time-sensitive goods rapidly across long distances.","evidence":"Aircraft transport tourists, workers and students as well as cargo such as medicines, electronics and fresh produce.","analysis":"Fast air travel supports business, trade, tourism and cultural exchange between distant places.","link":"Therefore, aviation reduces the barrier of distance and connects economies and communities globally."}},{"id":29,"module":"transport","title":"Transport emissions and new technology","lead":"Transport creates connections, but burning fossil fuels also creates pollution and greenhouse-gas emissions.","paras":["Cars, trucks, ships and aircraft traditionally rely heavily on petrol, diesel or other fossil fuels. These fuels release carbon dioxide when burned.","Vehicle manufacturers have developed electric and hybrid vehicles to reduce fuel use and tailpipe emissions. Public transport, walking and cycling can also reduce emissions per person in some journeys.","No transport technology has zero impact. Electric vehicles still require materials and electricity, and public infrastructure uses land and resources. Sustainable transport compares the whole system rather than assuming one technology solves every problem."],"example":"Replacing a short car trip with walking or cycling avoids fuel use, while an electric bus can move many passengers with lower direct emissions than many separate petrol cars.","terms":[["hybrid vehicle","a vehicle combining more than one power source, often an engine and electric motor"],["electric vehicle","a vehicle powered mainly by electricity stored in batteries"]],"q":"Why are electric and hybrid vehicles being developed?","a":"To reduce dependence on fossil fuels and lower some transport emissions.","sampleQuestion":"Explain why new transport technologies are being developed. (4 marks)","peal":{"point":"New transport technologies are being developed to reduce pollution and greenhouse-gas emissions from fossil fuels.","evidence":"Electric and hybrid vehicles can use less petrol or diesel than conventional vehicles.","analysis":"Lower fuel use can reduce urban air pollution and transport emissions, although electricity generation and battery production also have environmental impacts.","link":"Therefore, cleaner transport technology is part of reducing the environmental cost of global mobility."}},{"id":30,"module":"communication","title":"How the internet connects people and services","lead":"Digital networks let information, entertainment, education, health services and business cross distance quickly.","paras":["Messaging, video calls, social media and online games connect people who may never be in the same place. Music, films, news and trends can spread internationally within minutes.","Online learning can connect people to courses and information beyond their local area. Telehealth can allow a person in a remote community to speak with a health professional by video.","Businesses use websites and apps for advertising, shopping, payments and customer service. Digital communication therefore creates social and economic connections at the same time."],"example":"A person in a remote town can video-call a specialist, pay a bill online and order a product from a business in another city on the same day.","terms":[["information technology","digital systems used to create, store and share information"],["telehealth","healthcare delivered partly through communication technology"]],"q":"How can the internet reduce the importance of distance for services?","a":"It can deliver information, communication and some services online without requiring the user and provider to be in the same place.","sampleQuestion":"Explain how the internet improves access to services. (4 marks)","peal":{"point":"The internet improves access by allowing information and services to be delivered across distance.","evidence":"Telehealth connects patients to doctors, while online learning and shopping connect users to education and businesses.","analysis":"Digital communication reduces the need to be physically close to a service provider.","link":"Therefore, internet access can improve opportunities for people living far from major service centres."}},{"id":31,"module":"communication","title":"Internet access in Africa: a current digital-divide article","lead":"Internet access is expanding across Africa, but current data still show the world's largest regional connectivity gaps in overall use, rural access, gender and affordability.","paras":["Internet access in Africa has improved substantially, but the continent still has the world's largest regional connectivity gap. ITU estimates that 35.7% of people in its Africa region used the internet in 2025, compared with 73.6% worldwide.","Current country data show large differences inside Africa. Morocco had about 91.2% internet use in 2024, South Africa about 78.4% and Egypt about 74.6%. At the lower end, Burundi was about 8.6%, Chad 12.6% and the Central African Republic 13.8%. These figures replace much older maps with more current country evidence.","The overall pattern is that communication technology is spreading, especially through mobile networks, but progress is uneven. Urban areas generally have better infrastructure, electricity and affordability than remote rural areas. ITU's 2025 regional figures also show a gender and rural-urban gap.","Positive effects of better connectivity include easier communication with family and customers, mobile banking, access to market prices, online education, telehealth, digital government services, job searching and the ability for small businesses to advertise or sell beyond their local area.","Countries can remain poorly connected because fibre networks and mobile towers are expensive to build across large or sparsely populated areas; electricity can be unreliable; devices and data may be unaffordable; international bandwidth and undersea-cable access can be limited; and people may lack digital skills.","Limited internet access can weaken trade in developing economies. Businesses may struggle to contact overseas buyers, compare prices, advertise products, receive digital payments, complete customs paperwork or track shipments. Reliable connectivity therefore affects both local opportunity and participation in global markets.","At the broad regional level, Europe and the Americas are among the world's most connected regions. ITU reported 92.2% internet use in Europe and 88.1% in the Americas in 2025, compared with 77.1% in Asia-Pacific and 35.7% in Africa. Highly connected individual countries include Denmark and Luxembourg in Europe, Canada in North America, and South Korea in Asia."],"example":"Two students can live in the same country but have very different digital opportunities if one has affordable urban broadband and the other depends on weak or expensive rural mobile coverage.","terms":[["digital divide","inequality in access to and effective use of digital technology"],["usage gap","when network coverage exists but people still do not use the internet"],["digital inclusion","ensuring people can afford, access and use digital services safely and effectively"]],"q":null,"a":null,"snapshot":"ITU · 2025 regional internet use: Africa 35.7% · World 73.6% · Europe 92.2% · Americas 88.1%.","article":true,"sources":[["IEEE – What Is the Digital Divide?","https://ctu.ieee.org/blog/2022/12/14/what-is-the-digital-divide/"],["ITU – Facts and Figures 2025","https://www.itu.int/itu-d/reports/statistics/facts-figures-2025/"],["ITU – State of digital development in Africa","https://www.itu.int/itu-d/reports/statistics/wp-content/uploads/sites/5/2025/04/2500037E_SDDT_2025_Africa_FINAL.pdf"],["ITU DataHub – South Africa","https://datahub.itu.int/data/?e=ZAF"],["ITU DataHub – Kenya","https://datahub.itu.int/data/?e=KEN"],["Africa internet-penetration country comparison, 2025","https://www.statista.com/statistics/1124283/internet-penetration-in-africa-by-country/"],["ITU DataHub – Individuals using the Internet","https://datahub.itu.int/data/?c=&e=GNQ&i=11624"],["ITU – Facts and Figures 2025: Internet use","https://www.itu.int/itu-d/reports/statistics/2025/10/15/ff25-internet-use/"],["ITU DataHub – Morocco","https://datahub.itu.int/data/?Affordability=Interconnection&Connectivity=Access&Markets=Licensing&Sustainability=Society&e=MAR"],["ITU DataHub – Chad","https://datahub.itu.int/data/?Affordability=Price+regulation&Connectivity=Use&Markets=Taxation&Sustainability=Economy&e=TCD"]],"countryExamples":[["Morocco","91.2% of individuals used the internet in 2024."],["South Africa","78.4% in 2024."],["Egypt","74.6% in 2024."],["Burundi","8.6% in 2024."],["Chad","12.6% in 2024."],["Central African Republic","13.8% in 2024."]],"sampleQuestion":"Explain two reasons for the digital divide in Africa. (5 marks)","peal":{"point":"The digital divide in Africa is caused by unequal infrastructure and affordability.","evidence":"Remote areas may have fewer fibre links or mobile towers, while devices and data plans can be too expensive for some households.","analysis":"Without reliable networks, electricity and affordable access, people cannot fully use online education, banking, health or business services.","link":"Therefore, digital inequality reflects both physical infrastructure and people's ability to afford and use technology."}},{"id":32,"module":"communication","title":"Case study article: Kenya, mobile phones and M-PESA","lead":"Kenya shows how mobile technology can connect people to financial services, markets and information even where traditional bank infrastructure is limited.","paras":["Kenya shows how mobile phones can provide practical services as well as communication. Farmers and small businesses use phones to contact customers and receive market information, households transfer money without travelling to a bank branch, and people can pay bills or send support to relatives in other places.","M-PESA, launched commercially in Kenya in 2007, is the best-known example. Users deposit or withdraw cash through local agents and transfer value through mobile accounts. Safaricom reported 35.82 million one-month active M-PESA customers in FY2025 and almost 299,000 agents.","World Bank analysis of Kenya's 2024 FinAccess survey reported that 82.3% of adults were current mobile-money users. This demonstrates how mobile infrastructure can extend financial services beyond traditional bank branches.","Mobile technology also connects users to weather information, produce prices, education, health information and government or business services. The benefits are greatest when coverage, electricity, affordable devices, agent networks, digital skills and consumer protection are available together."],"example":"A rural farmer can receive a mobile payment, check prices, pay a supplier and send money to a family member using the same phone network.","terms":[["mobile money","a service that stores and transfers value through a mobile account"],["agent network","local businesses or representatives that provide cash-in, cash-out and customer services"],["financial inclusion","access to useful and affordable financial services"]],"q":null,"a":null,"snapshot":"Current case data · Kenya: 82.3% of adults were current mobile-money users in 2024; Safaricom FY2025 reported 35.82m active M-PESA customers and KSh38.29tn in transaction value.","article":true,"sources":[["Kenya mobile-phone video","https://www.youtube.com/watch?v=zGCxiD4qREM"],["World Bank – Mobile money use in Kenya","https://documents1.worldbank.org/curated/en/099112425071537101/pdf/P509058-c0bd5027-d246-4da9-bc0c-fafb5fb4a3e2.pdf"],["Safaricom – FY25 audited results","https://www.safaricom.co.ke/images/Downloads/FY25-Press-Release_May-9-2025.pdf"]],"sampleQuestion":"Explain how M-PESA has improved access to services in Kenya. (5 marks)","peal":{"point":"M-PESA improves financial inclusion by allowing people to send, receive and store money using mobile phones.","evidence":"Kenya had 35.82 million active M-PESA customers in FY2025 and a large network of local agents.","analysis":"People can transfer money, pay bills and receive income without needing a traditional bank branch nearby.","link":"Therefore, mobile money connects people to financial services and economic opportunities across distance."}},{"id":33,"module":"communication","title":"What makes internet access possible?","lead":"The internet feels wireless, but it depends on physical infrastructure, electricity, cables, towers, devices and data centres.","paras":["Mobile towers connect phones locally, while fibre-optic networks move large amounts of data. Undersea fibre-optic cables carry most international internet traffic between continents.","Remote areas can be expensive to connect because networks must cover long distances for fewer users. High device prices, data costs and unreliable electricity can create extra barriers.","When connectivity improves, people can gain better access to information, markets, online learning, telehealth and digital payments. But technology works best when people also have digital skills and safe, affordable services."],"example":"A video call between Australia and Africa may feel instant, but the data can travel through local networks and long-distance fibre cables crossing the ocean floor.","terms":[["infrastructure","the physical systems needed for services to operate"],["fibre-optic cable","a cable that carries data as pulses of light"]],"q":"Why can remote communities be harder to connect to the internet?","a":"Networks must cover long distances for fewer users, and infrastructure, electricity, devices and data can be expensive.","sampleQuestion":"Explain what infrastructure is needed for internet access. (4 marks)","peal":{"point":"Internet access depends on physical infrastructure as well as user devices.","evidence":"Fibre-optic cables, undersea cables, data centres, mobile towers, routers and reliable electricity all support digital connections.","analysis":"If one part of this system is missing or unreliable, internet speed and access can be limited.","link":"Therefore, the internet depends on a large physical network even when users connect wirelessly."}},{"id":34,"module":"trade","title":"What is global trade?","lead":"Global trade is the buying and selling of goods and services between countries.","paras":["Global trade is the buying and selling of goods and services between countries. An export is a good or service sold to another country, while an import is a good or service bought from another country.","Australia exports products such as iron ore, coal, natural gas, agricultural goods and education services. It imports products such as vehicles, electronics, machinery, medicines and many manufactured consumer goods.","Trade connects producers and consumers through contracts, finance, ports, airports, roads, shipping and digital information systems. A product sold in Australia may therefore link raw materials, manufacturing and consumers in several countries."],"example":"Australia can export wheat or education services and import passenger cars, computers or telecommunications equipment.","terms":[["export","a good or service sold to another country"],["import","a good or service bought from another country"],["global trade","buying and selling goods and services between countries"]],"q":"A smartphone made overseas and bought in Australia is what from Australia's point of view?","a":"An import.","sampleQuestion":"Distinguish between imports and exports using an example. (4 marks)","peal":{"point":"Exports are goods or services sold to another country, while imports are goods or services bought from another country.","evidence":"Australia exports iron ore and education services but imports many vehicles and electronics.","analysis":"These two-way flows connect Australian producers and consumers to overseas markets.","link":"Therefore, imports and exports are the basic movements that make up global trade."}},{"id":35,"module":"trade","title":"Why countries trade","lead":"Countries trade because no place has every resource, climate, industry or skill it wants in the same amount.","paras":["A tropical crop may not grow well in a cold climate. Some countries have large mineral deposits, while others specialise in manufacturing, finance, education or technology.","Businesses also trade to reach larger markets. Selling to international customers can increase demand, income and employment.","Trade also creates dependence. A factory that relies on one overseas supplier may face delays if a port closes, a conflict interrupts shipping or a natural disaster damages production."],"example":"Australia imports coffee from warmer growing regions and exports resources and services that overseas buyers want.","terms":[["market","people or places where goods and services are bought and sold"],["trade partner","a country that regularly buys from or sells to another country"]],"q":"Give one reason a country may import a product.","a":"It may lack the climate, resources, skills or supply to produce enough locally, or importing may be more efficient.","sampleQuestion":"Explain why countries trade with one another. (4 marks)","peal":{"point":"Countries trade because they have different resources, skills, industries and production costs.","evidence":"Australia exports large amounts of minerals but imports many manufactured electronics.","analysis":"Specialisation allows countries to sell products they can produce efficiently and buy products that are cheaper or unavailable domestically.","link":"Therefore, trade connects economies with different strengths and needs."}},{"id":36,"module":"trade","title":"Free trade, tariffs and agreements","lead":"Free trade agreements reduce some barriers so countries can exchange goods and services more easily.","paras":["Free trade means reducing barriers such as tariffs and quotas so goods and services can move more easily between economies. It can lower some prices, increase competition and give businesses access to larger markets, although governments may still keep rules for safety, biosecurity and other public purposes.","A free trade agreement is a negotiated agreement between economies to reduce selected trade barriers. The Australia–New Zealand Closer Economic Relations agreement is one example.","The China–Australia Free Trade Agreement (ChAFTA) was signed on 17 June 2015 and entered into force on 20 December 2015. It progressively reduced tariffs and improved market access for many goods and services traded between Australia and China.","China remains Australia's largest two-way trading partner. Current trade relationships include Australian exports such as iron ore, natural gas, agricultural products and services, alongside imports of manufactured goods, electronics and machinery."],"example":"If an import tariff is removed, an overseas product may enter at a lower cost. An Australian exporter may also gain better access to the other country's market.","terms":[["tariff","a tax on imported goods"],["free trade agreement","an agreement that reduces selected trade barriers between economies"]],"q":"What usually happens to the price pressure on an import when a tariff is removed?","a":"The tariff cost disappears, which can make the import cheaper, although other costs still affect the final price.","snapshot":"Current snapshot · ChAFTA entered into force in 2015; DFAT says 99% of Australian goods exports to China will enter duty-free by 1 January 2029.","sampleQuestion":"Explain how a free trade agreement can influence trade. (4 marks)","peal":{"point":"A free trade agreement can increase trade by reducing selected tariffs and other barriers.","evidence":"ChAFTA progressively lowered barriers between Australia and China after entering into force in 2015.","analysis":"Lower barriers can reduce costs for exporters and importers and give businesses better access to overseas markets.","link":"Therefore, trade agreements can strengthen economic connections between countries."}},{"id":37,"module":"trade","title":"Australia's current trading connections","lead":"Australia's trade network links the country strongly to Asia and North America, and the pattern changes as demand, prices, exchange rates and world events change.","paras":["Trade is the exchange of goods and services. Australia exports products and services it can supply competitively and imports products and services produced elsewhere. These links connect Australian mines, farms, universities and service businesses to consumers overseas, while Australian households and firms depend on imported vehicles, electronics, machinery, medicines and many other goods.","DFAT data for calendar year 2025 show that China remained Australia's largest two-way trading partner in goods and services at about A$326 billion. The United States was second at about A$158 billion, Japan third at about A$97.5 billion, the Republic of Korea fourth at about A$67.5 billion and India fifth at about A$50.2 billion.","The country relationships are different, not interchangeable. China buys large volumes of Australian iron ore, natural gas, agricultural products and education services. Japan buys Australian coal, natural gas, iron ore, beef and copper, while Australia buys Japanese passenger vehicles, goods vehicles and refined petroleum. The Republic of Korea buys Australian iron ore, coal, natural gas and beef, while Australia imports Korean cars and refined petroleum.","India's relationship has a strong services component: education was Australia's largest service export to India in 2025, valued at A$9.4 billion. Australian exports to India also include resources and industrial products, while imports from India include clothing, household linen, automotive parts and electrical parts. The United States relationship is especially important for services, technology and investment as well as goods, with Australia importing more from the United States than it exports there.","Trade rankings must always include a year because they change. Commodity prices, exchange rates, wars, tariffs, consumer demand and supply disruptions can quickly alter values. A current trade table is therefore more useful than an undated list."],"example":"Iron ore can leave an Australian port for an Asian steel producer, while cars, electronics or machinery travel in the opposite direction. Both flows depend on ports, shipping, contracts, finance and international relationships.","terms":[["two-way trade","the combined value of exports and imports between two economies"],["trade partner","an economy that regularly buys from or sells to another economy"],["trade balance","the difference between the value of exports and imports"]],"q":null,"a":null,"snapshot":"DFAT 2025 top five two-way partners · China A$326b; United States A$158b; Japan A$97.5b; Republic of Korea A$67.5b; India A$50.2b.","article":true,"sources":[["DFAT – Trade in goods and services","https://www.dfat.gov.au/trade/trade-and-investment-data-information-and-publications/trade-statistics/trade-in-goods-and-services"],["DFAT – China country brief","https://www.dfat.gov.au/geo/china/china-country-brief"],["DFAT – Trade and Investment at a Glance background material","https://www.dfat.gov.au/publications/trade-and-investment/trade-and-investment-glance-2020"],["DFAT – Japan country brief","https://www.dfat.gov.au/geo/japan/japan-country-brief"],["DFAT – Republic of Korea country brief","https://www.dfat.gov.au/geo/republic-of-korea/republic-of-korea-country-brief"],["DFAT – India country brief","https://www.dfat.gov.au/geo/india/india-country-brief"],["DFAT – United States country brief","https://www.dfat.gov.au/geo/united-states-of-america/united-states-of-america-country-brief"]],"countryExamples":[["China","Australia provides iron ore, natural gas, agricultural products and education-related travel services; China is Australia's largest two-way trading partner."],["United States","Major two-way trade in goods and services plus very large investment links; Australia imported over A$98b of U.S. goods and services in 2025 and exported about A$60b."],["Japan","Australia provides coal, natural gas, iron ore, beef and copper; Japan provides passenger vehicles, goods vehicles and refined petroleum."],["Republic of Korea","Australia provides iron ore, coal, natural gas and beef; Korea provides cars and refined petroleum."],["India","Australia provides education services and growing agricultural and industrial exports; India provides goods including clothing, household linen, automotive parts and electrical parts."]],"sampleQuestion":"Explain how Australia's trade links demonstrate interconnection. (5 marks)","peal":{"point":"Australia's trade links demonstrate interconnection because Australian industries and consumers depend on overseas buyers and suppliers.","evidence":"In 2025 China was Australia's largest two-way trading partner at about A$326 billion, while Japan was also a major partner.","analysis":"Exports support Australian jobs and income, while imports provide products such as vehicles and manufactured goods.","link":"Therefore, international trade creates mutual economic dependence between Australia and its major partners."}},{"id":38,"module":"trade","title":"Trade routes, disruption and interdependence","lead":"Trade networks make products widely available, but they also mean a disruption in one place can affect distant places.","paras":["Ships follow major sea routes between ports, while railways, roads and aircraft connect ports and airports to inland markets. Digital systems coordinate orders, tracking and payments.","A disruption can come from severe weather, conflict, strikes, port congestion, a factory shutdown or a shortage of shipping capacity. When one link fails, delays and costs can spread through the network.","Businesses can reduce risk by using several suppliers, keeping emergency stock or changing transport routes. These choices may increase resilience but can also cost more."],"example":"If a major shipping route is blocked, containers may take a longer route. Delivery times and freight prices can rise even for customers thousands of kilometres away.","terms":[["interdependence","a situation where people or places depend on one another"],["resilience","the ability to cope with disruption and recover"]],"q":"How can a port disruption affect a shop in another country?","a":"Goods may arrive late or cost more because the shop depends on the wider transport and supply network.","sampleQuestion":"Explain how disruption to a trade route can affect other places. (5 marks)","peal":{"point":"Trade-route disruption can affect distant places because global supply chains depend on reliable transport links.","evidence":"If ships are forced to avoid a major chokepoint, journeys become longer and freight costs can increase.","analysis":"Higher transport costs and delays can reduce factory supplies, increase prices and change business decisions in countries far from the disruption.","link":"Therefore, global trade creates interdependence between transport routes, businesses and consumers."}},{"id":39,"module":"consumption","title":"Production and consumption","lead":"Production is how goods are made. Consumption is how goods and resources are bought, used, reused and disposed of.","paras":["Production can begin with farming, mining or other raw-material extraction. Materials are processed, parts are manufactured and products are assembled and packaged.","Consumption includes purchasing, using, maintaining, repairing, sharing, reusing, recycling and disposal. Consumer demand can influence how much companies produce.","Every stage can create economic, social and environmental effects. A factory may create jobs while using energy and water. A consumer gains a useful product but may later create waste."],"example":"Buying a phone connects a customer to mining, factories, software, freight, retail, repair and e-waste systems.","terms":[["production","the processes that turn materials into goods"],["consumption","the ways goods and resources are purchased, used and disposed of"]],"q":"What is the main difference between production and consumption?","a":"Production is making goods; consumption is buying, using, reusing and disposing of them.","sampleQuestion":"Explain the difference between production and consumption using a product example. (4 marks)","peal":{"point":"Production is the process of making a good, while consumption is the way the good is bought, used and eventually disposed of.","evidence":"For a T-shirt, production includes growing cotton and sewing the garment, while consumption includes buying, wearing and discarding it.","analysis":"Both stages use resources and create environmental and economic impacts.","link":"Therefore, the full lifecycle of a product includes both production and consumption."}},{"id":40,"module":"consumption","title":"Case study article: the global journey of an iPhone","lead":"An iPhone connects mining, advanced component manufacturing, assembly, software, international freight, retail, repair and recycling across a global supply chain.","paras":["The iPhone journey begins with raw-material extraction and processing. Metals and minerals used in batteries, circuitry and other components are mined and refined before suppliers turn them into glass, chips, batteries, cameras, circuit boards and other parts. Design and engineering are centred in the United States, while the physical supply chain spans more than 60 countries.","Named production examples include iPhone cover glass made by Corning in Kentucky; advanced Apple silicon made at TSMC's Arizona facility; semiconductor wafers and chip technology from U.S. sites in Texas and New York; iPhone assembly in China mainland; and a major component-manufacturing and assembly base in India through suppliers including Foxconn and Tata.","Apple does not set one fixed 'intended lifespan' for every iPhone model. A useful current measure is repair support: Apple says service and parts are generally available for at least five years after it last distributed a product for sale and may continue for up to seven years, depending on law and parts availability. Software support and actual user lifespan vary by model and use.","The United States and China are two of the largest individual iPhone markets, with Japan and major Western European markets also important. Counterpoint tracks iPhone sell-through across the United States, China, Japan, Western Europe and many other national markets; in 2026 the iPhone 17 was still recording strong sales growth in the United States and especially Japan.","When an old or broken iPhone is discarded, several pathways are possible. A device may be repaired, traded in, refurbished and resold, stored, exported as second-hand equipment or sent to a recycler. Apple screens returned devices for reuse and sends non-reusable products or parts to recycling systems, including the Daisy and Cora systems.","E-waste can harm the environment when devices are burned, dumped or dismantled unsafely. Valuable metals are lost, batteries can create fire and pollution risks, and hazardous substances can contaminate air, soil or water. Informal recycling can also expose workers to dangerous dust and chemicals.","Measures that reduce iPhone impacts include longer-lasting design, battery and screen repair, trade-in and refurbishment, recycled materials, renewable electricity in the supply chain, lower-impact transport and specialised recycling. Apple reported in 2026 that 30% of material across products shipped in 2025 came from recycled content, with 100% recycled cobalt in Apple-designed batteries and 100% recycled rare-earth elements in magnets.","Environmental impacts include mining, factory energy use, freight emissions and e-waste. Economic impacts include high-value design and technology jobs, supplier employment, retail and app-economy activity, but also costs associated with materials, energy and waste management. Social impacts include communication, education and access to services, alongside labour risks, unequal access to expensive devices and the digital divide.","Both producers and consumers benefit, but in different ways. Apple and suppliers receive revenue and profit and build valuable technology and intellectual property; workers receive employment and wages. Consumers receive years of communication, navigation, education, entertainment and productivity. The fairest conclusion is that producers often capture a large share of the financial value, while consumers receive practical and social value from use; environmental and labour costs can fall on other groups in the supply chain."],"example":"The phone in a student's hand may connect mineral extraction in one region, chip production in another, assembly elsewhere, software teams, ocean and air freight, an Australian retailer and an eventual recycling system.","terms":[["product lifecycle","the stages from raw-material extraction through production, use and end-of-life"],["component","a part used to make a larger product"],["refurbishment","repairing and restoring a used product so it can be used again"]],"q":null,"a":null,"snapshot":"Current iPhone case · supply chain in 60+ countries · service/parts generally 5+ years and up to 7 years · 30% recycled material across Apple products shipped in 2025.","article":true,"sources":[["Apple – Supply Chain Innovation","https://www.apple.com/au/supply-chain/"],["Apple – 2026 Environmental Progress Report","https://www.apple.com/environment/pdf/Apple_Environmental_Progress_Report_2026.pdf"],["Apple – Service after warranty","https://support.apple.com/en-au/102772"],["Globalisation impacts video","https://www.youtube.com/watch?v=dWjWfyzmk1Q"],["Apple – Corning Kentucky iPhone cover glass","https://www.apple.com/newsroom/2025/08/apple-corning-to-manufacture-all-iphone-apple-watch-cover-glass-in-kentucky/"],["Apple – American Manufacturing Program","https://www.apple.com/newsroom/2025/08/apple-increases-us-commitment-to-600-billion-usd-announces-ambitious-program/"],["Reuters – Apple expands iPhone assembly in India","https://www.reuters.com/world/china/apple-aims-source-all-us-iphones-india-pivot-away-china-ft-reports-2025-04-25/"],["Apple 2025 annual report and geographic sales","https://www.sec.gov/Archives/edgar/data/320193/000032019325000079/aapl-20250927.htm"],["Apple – 2026 recycled-material progress","https://www.apple.com/newsroom/2026/04/apple-accelerates-progress-with-highest-ever-recycled-material-in-its-products/"],["Apple Australia – Environment and Daisy","https://www.apple.com/au/environment/"],["Counterpoint – Apple smartphone sales in the United States","https://dir.counterpointresearch.com/smartphones/us/apple"]],"countryExamples":[["United States – Kentucky","Corning manufactures iPhone cover glass."],["United States – Arizona","TSMC manufactures advanced Apple silicon; Amkor packages and tests Apple silicon."],["United States – Texas","GlobalWafers produces semiconductor wafers and Samsung's Austin facility supplies chip technology for Apple products."],["United States – New York","GlobalFoundries manufactures wireless and power-management technologies used in Apple devices."],["China mainland","Apple identifies iPhone assembly at supplier facilities there."],["India","Apple identifies component manufacturing there; Foxconn and Tata are major iPhone assembly partners."]],"sampleQuestion":"Explain how the production of an iPhone shows global interconnection. (6 marks)","peal":{"point":"iPhone production shows global interconnection because design, components, assembly, transport and sales occur across different countries.","evidence":"Apple's supply chain spans more than 60 countries, with named production in the United States, China and India.","analysis":"Specialist suppliers contribute different parts before final assembly and global distribution, linking workers and industries across continents.","link":"Therefore, one iPhone connects raw materials, technology, manufacturing and consumers through a global supply chain."}},{"id":41,"module":"consumption","title":"iPhone impacts, e-waste and more sustainable electronics","lead":"The environmental and social impact of a smartphone depends on how materials are sourced, how the device is manufactured and transported, how long it is used and what happens at the end of its life.","paras":["Environmental impacts begin with extracting and processing materials. Mining and refining use land, water and energy and can create pollution. Manufacturing complex electronics also requires large amounts of electricity and highly specialised industrial processes. Shipping finished devices adds further emissions.","Electronic waste is a rapidly growing global problem. The Global E-waste Monitor reported that the world generated about 62 million tonnes of e-waste in 2022. Only 22.3% was documented as formally collected and recycled in an environmentally sound way. The report projects continued growth if consumption and recycling systems do not change.","Discarded electronics can contain valuable metals as well as substances that create environmental and health risks if devices are burned, dumped or dismantled unsafely. Informal recycling may expose workers and communities to hazardous materials while also losing valuable resources that could be recovered.","There are several ways to reduce the impact. The most powerful is often extending product life: protect a device, replace a battery, repair damage, sell it second-hand or refurbish it rather than replacing it unnecessarily. At the end of useful life, formal take-back and recycling systems can recover materials more safely.","Apple reported in April 2026 that 30% of material by weight across products shipped in 2025 came from recycled content. It also reported 100% recycled cobalt in Apple-designed batteries and 100% recycled rare-earth elements in magnets. These are company-specific achievements rather than proof that the entire electronics sector is sustainable, but they show how design can reduce demand for some newly mined materials.","Economic and social impacts are mixed. Smartphones create jobs, support digital businesses and connect people to education and services. At the same time, unequal access contributes to the digital divide, and global supply chains require continued attention to labour rights and responsible mineral sourcing."],"example":"Replacing a worn battery can keep a phone in use for several more years, delaying the environmental cost of manufacturing a replacement and reducing e-waste.","terms":[["e-waste","discarded electrical and electronic equipment"],["formal recycling","collection and recycling through regulated systems designed to manage materials safely"],["circular economy","a system that keeps products and materials in use for longer through repair, reuse and recycling"]],"q":null,"a":null,"snapshot":"Current evidence · 62m tonnes of global e-waste in 2022; 22.3% formally collected and recycled. Apple: 30% recycled material by weight across products shipped in 2025.","article":true,"sources":[["Global E-waste Monitor 2024","https://www.itu.int/en/ITU-D/Environment/Pages/Publications/The-Global-E-Waste-Monitor-2024.aspx"],["Apple – 2026 recycled-material update","https://www.apple.com/au/newsroom/2026/04/apple-accelerates-progress-with-highest-ever-recycled-material-in-its-products/"],["Apple – Environment","https://www.apple.com/au/environment/"]],"sampleQuestion":"Explain one way electronic consumption can become more sustainable. (4 marks)","peal":{"point":"Electronic consumption becomes more sustainable when products are kept in use longer and materials are recovered.","evidence":"Repairing a phone, replacing its battery or buying refurbished can delay disposal and reduce demand for new production.","analysis":"Longer product life reduces waste and the need for additional mining, manufacturing and transport.","link":"Therefore, repair, reuse and recycling can reduce the environmental impact of electronics."}},{"id":42,"module":"consumption","title":"Case study article: Nike as a transnational corporation","lead":"Nike is a transnational corporation because brand management, design, sourcing, manufacturing and sales operate across many countries through a large network of independent suppliers.","paras":["A transnational corporation is a company that organises business activities across more than one country. Examples include Nike, Apple, Samsung, Toyota, McDonald's and Adidas. Nike is a clear case because its headquarters, design, marketing, sourcing, manufacturing and sales are spread across a global network.","Nike benefits from globalisation because it can coordinate design and branding centrally while using specialist manufacturing clusters in countries with large footwear and apparel industries. It can then distribute products through international logistics networks and market the same global brand to consumers worldwide.","Nike does not manufacture most products in factories it owns. Independent contract manufacturers make nearly all NIKE Brand footwear and apparel. In fiscal 2026, Vietnam produced about 52% of NIKE Brand footwear, Indonesia 27% and China 16%. For apparel, Vietnam produced about 34%, Cambodia 15% and China 12%.","Benefits include access to specialised manufacturing skills, large-scale production, international consumer markets and lower unit costs. Supplier factories also provide jobs and export income in manufacturing economies.","Negative issues include long-distance transport emissions, dependence on contract manufacturers, labour and wage concerns, workplace health and safety, and the difficulty of monitoring environmental and labour standards across a large network. Corporate decisions about price, deadlines and supplier selection can affect workers thousands of kilometres from Nike's headquarters.","The Nike case is linked to globalisation because a single shoe can be designed and marketed in the United States, manufactured by an independent supplier in Vietnam or Indonesia, shipped through international ports and sold to a consumer in Australia. One product therefore connects companies, workers, transport systems and consumers in several countries."],"example":"A Nike shoe can be designed and marketed through a global brand, manufactured by an independent supplier in Asia, shipped through international ports and sold in Australia. The product links corporate decisions to distant workers and consumers.","terms":[["transnational corporation","a company that organises business activities across more than one country"],["Tier 1 supplier","a supplier that provides finished goods directly to a company"],["supplier code of conduct","standards a company requires suppliers to follow"]],"q":null,"a":null,"snapshot":"Nike FY2026 · Footwear: Vietnam 52%, Indonesia 27%, China 16%. Apparel: Vietnam 34%, Cambodia 15%, China 12%.","article":true,"sources":[["The Globalisation of Nike – Video","https://www.youtube.com/watch?v=b0jG8jJCMfU"],["Nike – Responsible Supply Chain","https://about.nike.com/en/mission/focus-areas/responsible-supply-chain"],["Nike Manufacturing Map","https://manufacturingmap.nikeinc.com/"],["Nike – FY25 foundational expectations","https://about.nike.com/en/mission/initiatives/foundational-expectations-and-code-of-conduct"],["Nike FY2026 Form 10-K – SEC","https://www.sec.gov/Archives/edgar/data/320187/000032018726000088/nke-20260531.htm"]],"countryExamples":[["Vietnam","About 52% of NIKE Brand footwear and 34% of apparel in FY2026."],["Indonesia","About 27% of NIKE Brand footwear in FY2026."],["China","About 16% of NIKE Brand footwear and 12% of apparel in FY2026."],["Cambodia","About 15% of NIKE Brand apparel in FY2026."]],"sampleQuestion":"Explain why Nike is described as a transnational corporation. (5 marks)","peal":{"point":"Nike is a transnational corporation because its business activities operate across many countries.","evidence":"Nike manages a global brand while independent manufacturers in Vietnam, Indonesia, China and other countries produce footwear and apparel.","analysis":"Design, production, transport and sales are geographically separated but coordinated as one international business network.","link":"Therefore, Nike demonstrates how transnational corporations organise activities across borders."}},{"id":43,"module":"consumption","title":"Case study article: the dark side of chocolate","lead":"Chocolate connects consumers to cocoa-growing communities, traders, processors and manufacturers, but the cocoa supply chain also exposes serious problems involving poverty, child labour and environmental pressure.","paras":["Chocolate begins with cocoa beans grown in tropical countries. Côte d'Ivoire and Ghana are the two countries at the centre of the child-labour case used here; Nigeria is another West African cocoa origin, while Ecuador and Colombia are important Latin American origins used by global chocolate companies such as Ferrero. Beans are fermented and dried near farms, then sold through traders and processors before becoming cocoa liquor, cocoa butter, cocoa powder and finished chocolate.","The economic connection is unequal. Farmers produce the essential raw material but may receive only a small share of the final retail value. Low and unstable farm incomes make it difficult for households to pay for labour, education and basic services, which can increase the risk that children work on farms.","The International Cocoa Initiative currently estimates that about 1.56 million children are in child labour in cocoa-growing areas of Côte d'Ivoire and Ghana. It emphasises that not all tasks performed by children are child labour: the concern is work that is hazardous, interferes with schooling or harms children's development.","Hazardous activities can include using sharp tools, carrying heavy loads or exposure to agrochemicals. The problem is connected to poverty, limited school access, labour shortages and weak services rather than having one simple cause. This is why banning a product alone does not automatically solve the underlying conditions.","Responses involve governments, cocoa companies, NGOs and farming communities. Child Labour Monitoring and Remediation Systems identify children at risk and connect households with support. ICI reports that tested interventions can reduce child-labour prevalence by up to one-third when properly implemented.","Environmental sustainability is another issue. Expanding cocoa farming can contribute to forest loss if production moves into protected or high-conservation areas. More traceable supply chains, better farm productivity, agroforestry and stronger income support can help reduce pressure to clear new land.","Consumers are connected to these issues through demand, but responsibility is shared. Companies control sourcing systems and prices, governments set and enforce rules, NGOs provide monitoring and support, and consumers can seek credible information and certification. Sustainable chocolate requires changes across the supply chain.","The chocolate industry illustrates how production and consumption are connected. Cocoa-growing households in Côte d'Ivoire and Ghana receive income when beans are sold, while traders, processors, manufacturers and supermarkets add further value as beans become chocolate products. Low farm incomes and insecure livelihoods can contribute to hazardous child labour; loss of forest habitat and unsustainable agricultural expansion can also create environmental harm. Governments can enforce labour and forest laws, companies can trace sourcing and improve purchasing practices, NGOs can support monitoring and schooling, and consumers can choose well-documented responsible products."],"example":"A chocolate bar purchased in Sydney may begin with beans grown by a smallholder family in Côte d'Ivoire or Ghana, then pass through exporters, processors and manufacturers before reaching a supermarket.","terms":[["child labour","work that harms children's development or interferes with education, as defined by international standards"],["smallholder","a farmer operating on a relatively small area of land"],["remediation","action taken to address and reduce an identified problem"]],"q":null,"a":null,"snapshot":"Current estimate · International Cocoa Initiative: about 1.56m children in child labour in cocoa in Côte d'Ivoire and Ghana.","article":true,"sources":[["International Cocoa Initiative – Child labour in cocoa","https://www.cocoainitiative.org/issues/child-labour-cocoa"],["International Cocoa Initiative – What works to tackle child labour","https://www.cocoainitiative.org/knowledge-hub/resources/what-works-tackle-child-labour"]],"countryExamples":[["Côte d'Ivoire","Major cocoa-producing country and one of the two countries covered by the ICI child-labour estimate."],["Ghana","Major cocoa-producing country and the other country covered by the ICI child-labour estimate."],["Nigeria","Another West African cocoa origin used in international cocoa supply chains."],["Ecuador and Colombia","Examples of Latin American cocoa origins; Ferrero lists both among its cocoa-source countries."]],"sampleQuestion":"Explain one social problem connected to global chocolate production. (5 marks)","peal":{"point":"A major social problem in cocoa production is hazardous child labour linked to poverty and insecure farm incomes.","evidence":"The International Cocoa Initiative estimates about 1.56 million children are in child labour in cocoa-growing areas of Côte d'Ivoire and Ghana.","analysis":"Low household incomes and limited access to services can increase pressure for children to work instead of attending school safely.","link":"Therefore, improving chocolate supply chains requires action on both labour conditions and the causes of poverty."}},{"id":44,"module":"consumption","title":"Who can respond to production and consumption problems?","lead":"Governments, NGOs, companies and individuals have different powers, so effective change usually needs more than one group.","paras":["Governments can create laws, safety rules, environmental standards, waste systems and inspections. In the cocoa sector, current 2024–2029 action frameworks in Ghana and Côte d’Ivoire include education, social protection, traceability and child-protection systems.","NGOs can support communities, monitor conditions, provide education, restore environments and campaign for change. Organisations such as World Vision are examples of NGOs working on development and community issues.","Businesses can trace suppliers, improve standards, redesign products, reduce waste and publish supply-chain information. Consumers can keep products longer, repair and recycle, choose products carefully and ask companies for better information.","No group can solve a complex global supply-chain problem alone. Rules need enforcement, businesses need workable systems, communities need resources and consumers need realistic choices.","The cocoa case shows why action must extend beyond personal shopping decisions. Ghanaian and Ivorian authorities can strengthen access to schools, child-protection services and forest governance; cocoa-buying companies can improve traceability and purchasing practices; NGOs can help identify children at risk and support families; and consumers can ask brands for evidence of progress. Similarly, reducing smartphone e-waste requires repairable product design, safe recycling infrastructure, government standards and consumers who keep devices in use."],"example":"Reducing e-waste may involve government recycling rules, company take-back programs, repair businesses and consumers choosing to repair a device instead of replacing it immediately.","terms":[["NGO","a non-government organisation working independently from government, often on social, humanitarian or environmental issues"],["regulation","an official rule used to control an activity"]],"q":null,"a":null,"article":true,"sampleQuestion":"Explain why several groups are needed to solve global production problems. (5 marks)","peal":{"point":"Complex production problems require several groups because responsibility and power are spread across the supply chain.","evidence":"Governments can regulate, businesses can change sourcing and design, NGOs can monitor conditions and consumers can change purchasing and disposal behaviour.","analysis":"One group acting alone cannot control every stage from raw materials to final waste.","link":"Therefore, coordinated action is more effective than relying on individuals or companies alone."}},{"id":45,"module":"consumption","title":"Making production and consumption more sustainable","lead":"Sustainable production and consumption try to reduce harm while still meeting people's needs.","paras":["Businesses can design products that last longer, use recycled materials, reduce packaging, improve energy efficiency and make repair easier. They can also improve supply-chain transparency and working conditions.","Governments can set product standards, regulate pollution, support recycling and create rules for waste and worker safety. Communities and NGOs can raise awareness and help monitor impacts.","Individuals can buy less when a purchase is not needed, reuse products, repair them, share or buy second-hand, recycle correctly and learn where products come from.","The strongest solution is often circular: materials remain in use for longer and waste becomes an input for another product instead of being thrown away."],"example":"A phone is used for several years, its battery is replaced, it is sold second-hand, and the device is eventually recycled so some metals can be recovered for new products.","terms":[["circular economy","a system that keeps products and materials in use for longer through reuse, repair and recycling"],["sustainable consumption","using goods and resources in ways that reduce long-term harm"]],"q":"What is one way to make a product's lifecycle more circular?","a":"Repair, reuse, refurbishment, sharing or recycling can keep a product or its materials in use for longer.","sampleQuestion":"Explain how a circular economy can make consumption more sustainable. (5 marks)","peal":{"point":"A circular economy makes consumption more sustainable by keeping products and materials in use for longer.","evidence":"Repair, reuse, refurbishment and recycling can extend a phone's life and recover useful materials.","analysis":"This reduces waste and decreases demand for new raw-material extraction and manufacturing.","link":"Therefore, circular systems reduce the environmental pressure created by a take-make-dispose economy."}},{"id":46,"module":"foundations","title":"Globalisation and developing economies","lead":"Globalisation can create jobs, investment and access to technology in developing economies, but it can also reproduce inequality when bargaining power, wages and environmental protections are weak.","paras":["Globalisation can have both positive and negative impacts on developing economies. The positive side begins with access to global markets: farmers, factories and service businesses can sell to customers overseas, while foreign companies can invest money, technology and management expertise.","Employment can raise household incomes and government revenue. Infrastructure such as ports, roads, telecommunications and electricity may improve when a place becomes part of a major production network. Consumers can also gain access to cheaper products, smartphones, medicines and information.","However, investment does not guarantee fair outcomes. Companies may locate production where wages are lower, and workers can face long hours, unsafe conditions or weak bargaining power if regulation and enforcement are poor. Local firms may struggle to compete with very large multinational companies.","Environmental costs can also be shifted toward producing regions. Mining, intensive farming, industrial water use, factory pollution and freight emissions may occur far from the final consumer. This means the places that receive jobs can also carry a large share of the environmental burden.","Dependence is another risk. If a community relies heavily on one export, factory or foreign market, a global price fall or corporate decision to relocate can cause rapid job losses. Diversifying industries, strengthening skills and improving local value-added production can reduce this vulnerability.","A good judgement therefore avoids saying globalisation is simply beneficial or harmful. The outcome depends on wages, worker protection, environmental rules, taxation, local ownership, education, infrastructure and whether the benefits are distributed widely."],"example":"A garment factory may create hundreds of jobs and export income, while also creating concerns about wages, safety and pollution. Both effects are part of the same interconnection.","terms":[["foreign direct investment","investment by a company in business operations in another country"],["bargaining power","the ability of a person or group to influence wages or conditions"],["economic dependence","relying heavily on a limited market, company or export"]],"q":null,"a":null,"article":true,"sources":[["Globalisation explained – Explainity video","https://www.youtube.com/watch?v=JJ0nFD19eT8"]],"sampleQuestion":"Assess the impacts of globalisation on developing economies. (6 marks)","peal":{"point":"Globalisation can improve wellbeing in developing economies through jobs, trade and investment, but benefits are not always evenly shared.","evidence":"Export industries can create employment and infrastructure, while some workers may experience low wages, unsafe conditions or environmental pollution.","analysis":"This means participation in global markets can increase income while also creating dependence on foreign companies and exposing communities to social or environmental costs.","link":"Therefore, the impact of globalisation depends on labour protection, environmental regulation and how widely economic gains are distributed."}}];

function setupClimate(){
 const temps=[-3,-4,0,5,10,14,19,19,16,10,5,-1],rain=[141,119,113,112,119,94,94,96,117,120,143,126],months=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

 const baseY=250,maxR=160;rain.forEach((v,i)=>{const x=55+i*45,h=v/maxR*170;s+='<rect x="'+x+'" y="'+(baseY-h)+'" width="28" height="'+h+'" rx="3" fill="currentColor" opacity=".18"/>';s+='<text x="'+(x+14)+'" y="270" text-anchor="middle" font-size="12" fill="currentColor" opacity=".65">'+months[i]+'</text>'});
 const pts=temps.map((v,i)=>[(69+i*45),(220-(v+5)/25*160)]);s+='<polyline points="'+pts.map(p=>p.join(",")).join(" ")+'" fill="none" stroke="currentColor" stroke-width="3"/>';pts.forEach(p=>s+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="4" fill="currentColor"/>');svg.innerHTML=s;
 btns.innerHTML=months.map((m,i)=>'<button class="month-btn '+(i===0?"active":"")+'" data-month="'+i+'">'+m+'</button>').join("");
 document.querySelectorAll("[data-month]").forEach(b=>b.onclick=()=>{const i=+b.dataset.month;document.querySelectorAll("[data-month]").forEach(x=>x.classList.toggle("active",x===b));document.getElementById("climateReadout").innerHTML="<b>"+months[i]+"</b>Temperature: "+temps[i]+"°C · Precipitation: "+rain[i]+" mm"})
}
function setupInstagram(){const r=document.getElementById("viralRange");const update=()=>{const v=+r.value,vals=[Math.min(100,v+15),Math.round(v*.78),Math.max(5,Math.round(v*.92)),Math.max(5,Math.round(v*.75))];vals.forEach((x,i)=>{document.getElementById("viralBar"+i).style.setProperty("--v",x+"%");document.getElementById("viralOut"+i).textContent=x});let label,text;if(v<30){label="Low attention";text="The place is less visible online and visitor pressure is lower."}else if(v<70){label="Growing attention";text="More people discover the place. Income can rise, but crowding also grows."}else{label="Viral destination";text="Very high visibility can create strong business demand and strong pressure on the place."}document.getElementById("viralLabel").textContent=label;document.getElementById("viralText").textContent=text};r.oninput=update;update()}
function setupDigital(){const r=document.getElementById("digitalRange");const update=()=>{const v=+r.value,[a,b,c,d]=[v,Math.max(0,v-8),Math.max(0,v-4),Math.min(100,v+7)];[a,b,c,d].forEach((x,i)=>{document.getElementById("digitalBar"+i).style.setProperty("--v",x+"%");document.getElementById("digitalOut"+i).textContent=x});if(v<35){document.getElementById("digitalLabel").textContent="Limited access";document.getElementById("digitalText").textContent="People may miss online learning, telehealth, markets and fast communication."}else if(v<70){document.getElementById("digitalLabel").textContent="Growing access";document.getElementById("digitalText").textContent="More services and information become reachable, but gaps can remain."}else{document.getElementById("digitalLabel").textContent="Strong access";document.getElementById("digitalText").textContent="Digital links can support learning, services, business and communication more consistently."}};r.oninput=update;update()}
function setupImpactSorter(){let selected=null,score=0,done=new Set;document.querySelectorAll("[data-impact]").forEach(b=>b.onclick=()=>{selected=b;b.style.borderColor="var(--sand)"});const place=kind=>{if(!selected||done.has(selected.dataset.impact))return;const ok=selected.dataset.kind===kind;if(ok){score++;selected.classList.add("correct")}else selected.classList.add("wrong");done.add(selected.dataset.impact);document.getElementById(kind==="p"?"positiveZone":"negativeZone").appendChild(selected);document.getElementById("sortFeedback").innerHTML="<b>Score: "+score+" / "+done.size+"</b>"+(ok?"Correct.":"Not quite. Think about who or what is affected.");selected=null};document.getElementById("positiveBtn").onclick=()=>place("p");document.getElementById("negativeBtn").onclick=()=>place("n")}
function setupTrade(){const correct=["i","e","i","e","i","e"],done=new Set;let score=0;document.querySelectorAll("[data-trade]").forEach(b=>b.onclick=()=>{const i=+b.dataset.trade;if(done.has(i))return;done.add(i);const ok=b.dataset.pick===correct[i];if(ok){score++;b.classList.add("correct")}else b.classList.add("wrong");document.getElementById("tradeMsg"+i).textContent=ok?"Correct.":("Answer: "+(correct[i]==="i"?"IMPORT":"EXPORT"));document.getElementById("tradeScore").textContent=score+" / "+done.size+" correct"})}

document.getElementById("missionBtn").onclick=()=>{home();setTimeout(()=>document.querySelector(".fun-grid").scrollIntoView({behavior:"smooth"}),0)};
document.getElementById("topBtn").onclick=()=>scrollTo({top:0,behavior:"smooth"});
document.addEventListener("keydown",e=>{if(e.key==="/"&&document.activeElement!==search){e.preventDefault();search.focus()}if(e.key==="Escape"&&document.activeElement===search){search.value="";search.blur();home()}});
window.addEventListener("scroll",()=>{const h=document.documentElement.scrollHeight-innerHeight;document.getElementById("scrollbar").style.width=(h>0?scrollY/h*100:0)+"%"},{passive:true});
const savedTheme=localStorage.getItem("ic_theme");if(savedTheme)document.documentElement.dataset.theme=savedTheme;
function themeLabel(){theme.textContent=document.documentElement.dataset.theme==="dark"?"LIGHT":"DARK"}
theme.onclick=()=>{document.documentElement.dataset.theme=document.documentElement.dataset.theme==="dark"?"light":"dark";localStorage.setItem("ic_theme",document.documentElement.dataset.theme);themeLabel()};
themeLabel();updateProgress();home();
</script>
