"A global citizen thinks about how choices can affect people and environments beyond their own local area. This can include learning about global issues, reducing waste, helping others or caring for the environment."
],example:"A person in Sydney can join an online environmental group with members in several countries and share ideas about reducing plastic waste.",terms:[["global village","the idea that the world feels like one connected community"],["global citizen","a person who sees the wider world as part of their community"]],q:"Why can the world feel like a 'global village' today?",a:"Because travel, media and digital communication let people connect and share information across long distances very quickly."},
{id:4,module:"foundations",title:"Positive and negative effects of globalisation",lead:"Globalisation can help people and places, but the benefits and costs are not always shared equally.",paras:[
"Positive effects can include more trade, new jobs, investment, access to technology and faster sharing of ideas. Consumers can also choose from more products.",
"Negative effects can include low wages or poor working conditions, pressure on small local businesses, environmental damage and the loss or weakening of local traditions.",
"A balanced geographical answer explains both sides. It also asks: Who benefits? Who may be harmed? Where does the impact happen? Is the impact short-term or long-term?"
],example:"A global company may create factory jobs in a developing country. This can increase income, but workers may still face low pay or unsafe conditions if protections are weak.",terms:[["impact","an effect or result"],["developing country","a country where many people may still have lower incomes and access to services"]],q:"Give one positive and one negative effect of globalisation.",a:"Possible answer: positive — more jobs or access to technology. Negative — local businesses may struggle or workers may face poor conditions."},

{id:5,module:"personal",title:"Your personal global web",lead:"Your everyday life is connected to many places, even when you stay at home.",paras:[
"Think about where your family comes from, places you have lived or travelled, your favourite foods, the clothes you wear and the apps or games you use.",
"Each item can create a connection to another place. A favourite meal may come from one culture. A shoe may be designed in one country and made in another. A game may connect you with players around the world.",
"Mapping these connections helps us see that personal geography is global. Our daily choices are linked to production, transport, culture and communication networks."
],example:"A student may live in Australia, have family in Bangladesh, eat Japanese food, wear shoes made in Vietnam and use an app created in the United States.",terms:[["personal connection","a link between you and another person, place or activity"],["network","a group of connected links"]],q:"Why can one person have connections to many countries?",a:"Because family, travel, food, clothes, media, products and technology can all link a person to different places."},
{id:6,module:"personal",title:"Global brands connect people and places",lead:"Large brands depend on networks of design, production, transport, advertising and customers.",paras:[
"A global brand can sell the same product in many countries. But the product may not be made in the country where the company began.",
"Brands depend on transport systems to move raw materials and finished products. They also depend on communication systems for advertising, online shopping, payments and customer service.",
"Technology makes it easier for brands to reach people across the world. Social media, search engines, videos and online stores can connect a company with millions of users."
],example:"A phone brand may design a device in one country, use parts made in several countries, assemble it somewhere else and sell it through shops and websites worldwide.",terms:[["global brand","a brand sold or recognised in many countries"],["supply chain","the steps and places involved in making and moving a product"]],q:"Name two systems that global brands rely on.",a:"Transport systems and communication systems."},
{id:7,module:"personal",title:"Nutella: one product, many places",lead:"Nutella is a useful example of a global product because its ingredients, production and sales connect many places.",paras:[
"The unit materials show that Nutella ingredients come from different world regions because different crops need different climates and because one place may not produce enough for global demand.",
"After ingredients are collected, they are moved to factories. Finished jars are then distributed to retailers in many countries. The product therefore creates a network of farms, factories, shipping routes, shops and consumers.",
"The case study shows why interconnection matters: a jar on a supermarket shelf can represent thousands of kilometres of transport and many people working in different places."
],example:"Hazelnuts can come from Turkey, while cocoa can come from West Africa. Those ingredients travel before they become part of the final product.",terms:[["raw material","a basic material used to make a product"],["distribution","moving finished products to places where they will be sold"]],q:"Why does Nutella not get every ingredient from one place?",a:"Different ingredients grow best in different climates, supply can be limited, and companies may use several sources for cost, quality and availability."},

{id:8,module:"skills",title:"BOLTSS: the parts of a useful map",lead:"BOLTSS is a checklist that helps a map communicate clearly.",paras:[
"B means Border: the line around the map. O means Orientation: a north arrow or direction. L means Legend: a key that explains symbols and colours.",
"T means Title: what the map is about. S means Scale: how map distance compares with real distance. The final S means Source: where the information came from.",
"A map can look attractive but still be weak if it is missing important information. BOLTSS helps you check whether a map can be understood and trusted."
],example:"A map of global brands should have a title, a legend for different brand locations, and a source for the information used.",terms:[["legend","a key explaining symbols or colours"],["scale","the relationship between map distance and real distance"]],q:"What does the L in BOLTSS stand for?",a:"Legend."},
{id:9,module:"skills",title:"Latitude",lead:"Latitude tells us how far north or south a place is from the Equator.",paras:[
"Latitude lines run around Earth from west to east, but they measure north-south position. The Equator is 0°. The North Pole is 90°N and the South Pole is 90°S.",
"Important latitude lines include the Tropic of Cancer at 23.5°N and the Tropic of Capricorn at 23.5°S.",
"Latitude can help explain climate. Places close to the Equator receive strong sunlight and are often warmer than places at high latitudes."
],example:"Much of Australia lies south of the Equator. The Tropic of Capricorn crosses Australia at about 23.5°S.",terms:[["latitude","distance north or south of the Equator, measured in degrees"],["Equator","the 0° latitude line dividing Northern and Southern Hemispheres"]],q:"Does latitude measure east-west position or north-south position?",a:"North-south position."},
{id:10,module:"skills",title:"Longitude",lead:"Longitude tells us how far east or west a place is from the Prime Meridian.",paras:[
"Longitude lines run from the North Pole to the South Pole. The Prime Meridian is 0° and passes through Greenwich in London.",
"Longitude divides the world into eastern and western positions. The International Date Line is roughly 180° from the Prime Meridian and passes mainly through the Pacific Ocean.",
"Latitude and longitude work together like an address. One latitude and one longitude can identify a location on Earth."
],example:"Sydney is south of the Equator and east of the Prime Meridian, so its coordinates use S and E.",terms:[["longitude","distance east or west of the Prime Meridian, measured in degrees"],["Prime Meridian","the 0° longitude reference line"]],q:"What is the starting line for longitude?",a:"The Prime Meridian at 0°."},
{id:11,module:"skills",title:"How to read a climate graph",lead:"A climate graph combines rainfall bars with a temperature line across the months of a year.",paras:[
"The horizontal axis shows the months. One vertical axis shows temperature in degrees Celsius. The other vertical axis shows rainfall or precipitation in millimetres.",
"To describe a climate graph, find the highest and lowest temperature, the temperature range, and the wettest and driest months. You can also look for seasonal patterns.",
"The worksheet examples compare Halifax and Churchill. Looking at the shape of the line and bars helps you compare how temperature and precipitation change through the year."
],example:"If July and August have the highest temperature, you can say the warmest part of the year occurs in mid-year. If rainfall bars are similar all year, rainfall is fairly even.",terms:[["precipitation","water that falls from the atmosphere, such as rain or snow"],["temperature range","highest temperature minus lowest temperature"]],q:"On a climate graph, what is usually shown by bars?",a:"Rainfall or precipitation."},

{id:12,module:"travel",title:"Why do people travel?",lead:"People travel for leisure, family, health, culture, work and new experiences.",paras:[
"Leisure travel includes holidays, relaxation and fun. Cultural travel can include food, heritage, festivals or learning about different ways of life.",
"People also travel for family reasons, medical treatment, study, business meetings and work. One trip can have more than one reason.",
"Transport technology changes travel choices. Faster and cheaper travel can make distant places easier to visit."
],example:"A person may travel to another country to visit family, attend a wedding and take a holiday at the same time.",terms:[["leisure","free-time activity for enjoyment"],["tourism","travel away from home for leisure, culture, business or other temporary purposes"]],q:"Name three different reasons people may travel.",a:"Examples include holidays, family, work, health, culture, study or new experiences."},
{id:13,module:"travel",title:"Travel patterns and trends",lead:"A travel pattern shows where people go and how travel changes over time.",paras:[
"Geographers look for places that receive many visitors, places where tourism is growing, and places where visitor numbers are falling.",
"Patterns are not random. Attractions, climate, safety, cost, transport connections, culture and marketing can all influence where people travel.",
"The travel worksheet lists countries with high annual visitor numbers. Mapping those countries helps show that popular destinations are clustered in certain world regions."
],example:"A country with famous cities, strong international airports and many attractions may receive more visitors because it is easier and more appealing to reach.",terms:[["pattern","a repeated arrangement or trend that can be seen in data"],["trend","a general direction of change over time"]],q:"Give two factors that can affect travel patterns.",a:"Possible answers include attractions, climate, safety, cost, transport, culture and marketing."},
{id:14,module:"travel",title:"Instagram and the tourism effect",lead:"Social media can turn a less-known place into a popular destination very quickly.",paras:[
"The provided article explains how photos, influencers and hashtags can shape travel choices. Images may show a perfect, quiet location even when the real place is crowded.",
"More attention can help local businesses because more visitors spend money on food, accommodation and activities. But sudden visitor growth can also create queues, litter, habitat damage and unrealistic expectations.",
"The article uses Calo des Moro in Mallorca as an example. It also reports that many younger travellers use social media for travel inspiration."
],example:"A waterfall or beach may become famous after thousands of people copy the same photo. The new visitors can bring income, but natural areas may need limits or protection.",terms:[["influencer","a person whose online content can affect other people's choices"],["overtourism","too many visitors for a place to manage comfortably or sustainably"]],q:"How can Instagram create both a positive and a negative tourism impact?",a:"It can attract visitors and support businesses, but it can also create overcrowding and environmental pressure."},

{id:15,module:"tourism",title:"Positive and negative impacts of tourism",lead:"Tourism can change the economy, society and environment of a place.",paras:[
"Positive economic impacts include jobs, income and investment. Tourism can also support roads, airports, shops and services.",
"Positive social impacts can include cultural exchange and support for heritage. Positive environmental impacts can happen when tourism pays for conservation.",
"Negative impacts include congestion, litter, habitat loss, rising prices, seasonal work and pressure on local culture. The same tourism activity can create both benefits and costs."
],example:"A new resort may create jobs and improve roads, but it may also clear vegetation, increase waste and make nearby housing more expensive.",terms:[["economic impact","an effect on jobs, money, business or costs"],["environmental impact","an effect on natural systems such as land, water, plants or animals"]],q:"Why is it useful to group tourism impacts as economic, social and environmental?",a:"It helps us see that tourism affects different parts of a place, not just money."},
{id:16,module:"tourism",title:"Venice: when tourism becomes too much",lead:"Venice shows how a world-famous destination can benefit from tourism while also being placed under pressure.",paras:[
"The unit materials describe overcrowding as a major problem for residents. Large visitor numbers can make daily movement difficult and put pressure on services and infrastructure.",
"Tourism also brings money to hotels, shops, restaurants and other businesses. This is why simply removing tourism is not an easy solution.",
"Cruise ships have been linked in the unit materials to pollution, congestion and pressure on the city. Sustainable management tries to protect the city while keeping the benefits of visitors."
],example:"A strategy might control where large ships can travel, manage visitor numbers or charge fees that support the protection of historic areas.",terms:[["infrastructure","basic systems such as roads, transport, water and public facilities"],["management","planned actions used to control an issue or protect a place"]],q:"Why is tourism in Venice a difficult issue to manage?",a:"Tourism brings jobs and income, but very large visitor numbers can create overcrowding, pollution and pressure on local life and infrastructure."},
{id:17,module:"tourism",title:"Ecotourism and sustainable tourism",lead:"Ecotourism aims to let people experience natural places while protecting the environment and supporting local communities.",paras:[
"Sustainable tourism tries to reduce damage and keep a place healthy for the future. Strategies can include reducing waste, using renewable energy, limiting visitor numbers and protecting wildlife.",
"Local communities should also benefit. Employing local workers, using local food and supporting local culture can keep more tourism benefits in the area.",
"The unit uses the Daintree Rainforest Wilderness Lodge as an example of an ecotourism site linked with natural protection and local cultural experiences."
],example:"A rainforest lodge can use small-scale buildings, renewable energy, local guides and controlled walking tracks so visitors experience the environment without causing as much damage.",terms:[["ecotourism","responsible tourism in natural areas that aims to protect the environment and support local communities"],["sustainability","meeting needs now while protecting the ability of future generations to meet their needs"]],q:"Name two ways a tourist destination can become more sustainable.",a:"Examples: reduce waste, recycle, use renewable energy, limit visitors, protect habitats, use local workers or educate visitors."},

{id:18,module:"transport",title:"Transport and the shrinking world",lead:"Faster transport makes distant places feel closer because travel takes less time.",paras:[
"Transport connects people to jobs, family, services, tourism and markets. It also moves goods between farms, factories, ports, shops and consumers.",
"Steam engines and internal combustion engines helped ships, trains, cars and planes travel faster. Modern transport networks can now move large numbers of people and products across long distances.",
"This is sometimes called a 'shrinking world'. The physical distance has not changed, but the time and cost needed to cross that distance can be much lower."
],example:"A journey from England to Australia once took months by sailing ship. Modern air travel can cover the same global distance in around a day.",terms:[["transport network","connected routes used to move people or goods"],["shrinking world","the idea that faster transport and communication make distance feel less important"]],q:"Why is the world described as 'shrinking'?",a:"Because improvements in transport and communication reduce the time and difficulty of connecting across long distances."},
{id:19,module:"transport",title:"How shipping containers changed trade",lead:"The standard shipping container makes it easier to move goods between ships, trains and trucks.",paras:[
"Before containers, many goods had to be loaded and unloaded piece by piece. This took more time and labour and increased the chance of damage or theft.",
"A standard container can be packed at one place, sealed, moved by truck, loaded onto a ship, transferred to rail and then moved again without unpacking the goods each time.",
"Containers help global trade by making transport faster, more predictable and cheaper. Ports, cranes, ships and roads have also changed to handle large container flows."
],example:"A container of clothes can leave a factory by truck, travel by ship to another country, then continue by rail and truck to a distribution centre.",terms:[["containerisation","using standard containers to move goods efficiently"],["freight","goods transported in large amounts"]],q:"What is one major advantage of a standard shipping container?",a:"Goods can move between different transport types without being unpacked at every step."},
{id:20,module:"transport",title:"How airplanes increase interconnection",lead:"Airplanes connect people and places quickly across countries and continents.",paras:[
"Air travel helps people visit family, work overseas, study, attend business meetings and travel for tourism.",
"Air freight is also useful for goods that need to move quickly, such as urgent medical supplies, fresh foods or high-value products.",
"Air travel supports cultural exchange because people can meet, study and work in different places. However, flying also creates environmental impacts through fuel use and emissions."
],example:"A person can attend a business meeting in another country, while a high-value electronic part can be flown to a factory that needs it quickly.",terms:[["air freight","goods moved by aircraft"],["emissions","gases released into the atmosphere, often from burning fuel"]],q:"Give two ways airplanes strengthen global interconnections.",a:"They move people quickly between countries and they can transport goods quickly to international markets."},

{id:21,module:"communication",title:"The internet connects people, services and information",lead:"Communication technology reduces the time needed to share information across distance.",paras:[
"People use messaging, video calls, social media and online games to connect with others. News, music and ideas can spread around the world almost instantly.",
"The internet can also connect people to services. Online learning can reach people far from a school or specialist. Video calls can support healthcare in remote areas.",
"Businesses use the internet for advertising, online shopping, payments and customer service. This means communication technology also supports economic interconnections."
],example:"A person in a remote area may speak with a health professional by video call instead of travelling a long distance for every appointment.",terms:[["information technology","digital systems used to create, store and share information"],["service","work or help provided to people, such as healthcare, education or banking"]],q:"How can the internet connect a person to a service?",a:"It can provide online access, for example video healthcare, online learning, banking or shopping."},
{id:22,module:"communication",title:"The digital divide",lead:"The digital divide is the gap between people who can access and use digital technology and people who cannot.",paras:[
"Internet access depends on infrastructure, cost, electricity, devices and digital skills. These conditions are not equal in every place.",
"Limited access can reduce opportunities. People may miss online education, health information, jobs, markets, banking and government services.",
"The unit materials use Africa to show that internet access differs strongly between countries and between urban and rural areas. This means global connection is growing, but it is not equal."
],example:"A student with fast internet can use videos, online libraries and digital tools. A student without reliable internet may have fewer learning resources.",terms:[["digital divide","the gap in access to digital technology and the internet"],["digital disadvantage","reduced opportunities caused by limited digital access or skills"]],q:"Why can the digital divide increase inequality?",a:"Because people without reliable digital access can miss information, education, services and economic opportunities."},
{id:23,module:"communication",title:"Communication technology can change places",lead:"Better digital connection can change how people work, learn, shop and use services.",paras:[
"When internet access improves, local businesses may reach more customers. People may use online banking and mobile payments. Students may access more learning resources.",
"Healthcare and government services can also reach remote communities more easily. These links can reduce the importance of distance.",
"But digital change can also create new risks, such as scams, misinformation or dependence on systems that not everyone can access."
],example:"Mobile technology can help a small business receive payments and contact customers without needing a large physical shop.",terms:[["connectivity","how easily people or places can connect to networks"],["remote area","a place far from major population centres or services"]],q:"Give one way better internet access can improve opportunities in a remote place.",a:"It can improve access to education, healthcare, banking, markets, jobs or information."},

{id:24,module:"trade",title:"What is global trade?",lead:"Global trade is the buying and selling of goods and services between countries.",paras:[
"Countries export products and services they sell to other countries. They import products and services they buy from other countries.",
"Trade happens because countries have different resources, climates, skills, industries and costs. No country produces every item it wants or needs.",
"Trade creates interconnections between producers, transport companies, ports, shops and consumers."
],example:"The unit gives examples of Australia exporting products such as coal and wheat and importing products such as cars and smartphones.",terms:[["export","a good or service sold to another country"],["import","a good or service bought from another country"]],q:"If Australia buys a car made overseas, is the car an import or an export for Australia?",a:"An import."},
{id:25,module:"trade",title:"Why countries trade",lead:"Countries trade to gain products, markets, income and access to resources they do not have enough of themselves.",paras:[
"A country may have a climate that is good for one crop but not another. It may have large mineral resources, skilled workers or special industries.",
"Businesses also trade to reach bigger markets. Selling to more customers can increase income and support jobs.",
"Trade can bring benefits, but it can also make places dependent on distant suppliers. A disruption at a port, factory or shipping route can affect people far away."
],example:"If a country cannot grow enough coffee because of its climate, it can import coffee from places where the crop grows well.",terms:[["market","people or places where goods and services are bought and sold"],["trade partner","a country that regularly buys from or sells to another country"]],q:"Why might a country import a product instead of making it itself?",a:"It may lack the right climate, resources, skills or enough supply, or importing may be cheaper or more efficient."},
{id:26,module:"trade",title:"Free trade, tariffs and trade links",lead:"Free trade means countries trade with fewer extra taxes or restrictions.",paras:[
"A tariff is a tax placed on imported goods. Tariffs can make imported products more expensive.",
"Free trade agreements reduce some barriers so goods and services can move more easily between countries. This can lower prices and open larger markets for businesses.",
"Trade links can change over time as economies, technology, politics and demand change. Geographers examine these changing flows using maps, graphs and trade data."
],example:"If two countries reduce tariffs on certain products, businesses may find it easier and cheaper to sell those products across the border.",terms:[["free trade","trade with fewer tariffs or restrictions"],["tariff","a tax on imported goods"]],q:"What usually happens to an imported product when a tariff is added?",a:"The product can become more expensive."},

{id:27,module:"consumption",title:"Production and consumption",lead:"Production is making goods. Consumption is using or buying goods and resources.",paras:[
"Production can include extracting raw materials, manufacturing parts, assembling products and packaging them. Consumption includes buying, using, repairing, reusing and disposing of products.",
"These stages create economic, social and environmental impacts. Production can create jobs and income, but it can also use energy, water and raw materials.",
"Consumption choices can affect demand. When millions of consumers want the same product, companies increase production and transport, which can affect places far from the buyer."
],example:"Buying a new phone can connect a consumer to mines, factories, shipping routes, software companies, shops and recycling or e-waste systems.",terms:[["production","the steps used to turn raw materials into finished goods"],["consumption","how goods and resources are bought, used and disposed of"]],q:"What is the difference between production and consumption?",a:"Production is making goods; consumption is buying, using and disposing of goods and resources."},
{id:28,module:"consumption",title:"The global journey of a smartphone",lead:"A smartphone is a global product because its materials, parts, assembly, software, sales and disposal can involve many countries.",paras:[
"Minerals and other raw materials are extracted first. Parts such as screens, chips and batteries may then be made in different places.",
"Assembly brings the parts together. Finished phones are transported to markets around the world. After use, some phones are repaired or recycled while others become electronic waste.",
"This chain creates benefits such as jobs, communication and economic activity. It can also create environmental impacts from mining, energy use and e-waste, and social concerns about working conditions."
],example:"A phone used in Australia may contain materials mined in one region, parts made in several Asian countries and software developed elsewhere.",terms:[["e-waste","discarded electronic devices and parts"],["lifecycle","the stages a product passes through from materials to disposal"]],q:"Why is a smartphone a strong example of interconnection?",a:"Because many countries and stages can be involved in materials, parts, assembly, transport, use and disposal."},
{id:29,module:"consumption",title:"Transnational corporations and Nike",lead:"A transnational corporation operates in more than one country and uses global networks to produce and sell goods.",paras:[
"Large companies may design products in one country, use suppliers and factories in other countries, and sell to customers worldwide.",
"Globalisation can help these companies reach large markets and organise production across many places. This can create jobs and investment.",
"However, the unit also asks students to consider negatives linked with global brands, such as labour conditions, unequal benefits and environmental impacts from production and transport."
],example:"Nike can be studied as a global network connecting design, manufacturing, shipping, advertising, retail and consumers.",terms:[["transnational corporation (TNC)","a company that operates in more than one country"],["supplier","a business or person that provides materials, parts or services"]],q:"Why do TNCs benefit from globalisation?",a:"They can use global suppliers, transport, communication and large international markets."},
{id:30,module:"consumption",title:"Making production and consumption more sustainable",lead:"Governments, organisations, businesses and individuals can all reduce negative impacts.",paras:[
"Governments can create laws, standards, recycling programs and education campaigns. Businesses can reduce waste, use cleaner energy, improve working conditions and design products that last longer.",
"Community groups and NGOs can raise awareness, support workers or environments and pressure decision-makers to change.",
"Individuals can repair, reuse, recycle, buy less, choose more sustainable products and learn where products come from. One action alone may be small, but many actions can change demand and behaviour."
],example:"A phone company can offer repair options and recycling. Governments can regulate e-waste. Consumers can keep devices longer instead of replacing them every year.",terms:[["ethics","ideas about what is right, fair and responsible"],["sustainable consumption","using goods in ways that reduce harm and waste over time"]],q:"Name one action a government, business and individual can take to reduce impacts.",a:"Example: government — regulate waste; business — design longer-lasting products; individual — repair or reuse instead of replacing."}
];

const GLOSSARY=[
["Assimilation","when a group gradually adopts the culture of another group"],
["Commodity","a raw material or basic product that can be bought and sold"],
["Consumer","a person who buys or uses goods and services"],
["Cultural degradation","weakening, loss or commercialisation of cultural traditions"],
["Digital divide","the gap between people with and without good access to digital technology"],
["Ecotourism","responsible tourism in natural areas that aims to protect the environment and support local communities"],
["Export","a good or service sold to another country"],
["Free trade","trade with fewer tariffs or restrictions"],
["Globalisation","the increasing connection of people and places around the world"],
["Goods and services","products people buy and work or help people pay for"],
["Import","a good or service bought from another country"],
["Information technology","digital systems used to create, store and share information"],
["Interconnection","a shared link between two or more things that can affect each other"],
["Production","the process of making goods"],
["Consumption","buying, using and disposing of goods and resources"],
["Tariff","a tax on imported goods"],
["Tourism","temporary travel away from home for leisure, culture, business or other reasons"],
["Trade","buying and selling goods and services"],
["Transnational corporation","a company that operates in more than one country"]
];

const app=document.getElementById("app"),search=document.getElementById("search"),theme=document.getElementById("theme");
let currentModule=null;
const seen=new Set(JSON.parse(localStorage.getItem("ic_seen")||"[]"));
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const moduleOf=id=>MODULES.find(m=>m.id===id);
const progress=m=>Math.round(m.topics.filter(id=>seen.has(id)).length/m.topics.length*100);
function save(){localStorage.setItem("ic_seen",JSON.stringify([...seen]));updateProgress()}
function updateProgress(){document.getElementById("progressText").textContent=seen.size+" / "+TOPICS.length+" topics explored"}
function revealCards(){const els=[...document.querySelectorAll(".reveal-card")];if(!("IntersectionObserver" in window)){els.forEach(x=>x.classList.add("visible"));return}const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("visible");io.unobserve(e.target)}}),{threshold:.1});els.forEach((x,i)=>{x.style.transitionDelay=Math.min(i,8)*35+"ms";io.observe(x)})}
function moduleCard(m){return '<button class="module-card reveal-card" data-module="'+m.id+'"><span class="module-code">'+m.code+'</span><h3>'+esc(m.title)+'</h3><p>'+esc(m.desc)+'</p><div class="meter"><span style="--p:'+progress(m)+'%"></span></div><div class="card-foot"><span>'+m.topics.length+' topics</span><b>'+progress(m)+'% explored →</b></div></button>'}

function home(){
 currentModule=null;search.value="";
 app.innerHTML='<section class="hero"><div class="hero-inner"><div><div class="eyebrow">Stage 4 · Year 7 Geography</div><h1>Everything is <span>connected.</span></h1><p>Follow the links between people, places, products, travel, technology, trade and the environment. Short reading. Clear examples. Lots to explore.</p><div class="hero-actions"><button class="btn primary" id="startBtn">Start exploring</button><button class="btn alt" id="randomBtn">Random topic</button></div><div class="pulse-line"><span class="pulse-dot"></span><span>Live connection</span><span class="rotator" id="rotator">FOOD</span></div><div class="stats"><div class="stat"><b>'+TOPICS.length+'</b><span>clear topic explainers</span></div><div class="stat"><b>'+MODULES.length+'</b><span>connected themes</span></div><div class="stat"><b>'+seen.size+'</b><span>topics explored</span></div><div class="stat"><b>7</b><span>interactive activities</span></div></div></div><div class="network-card"><h2>Your connection web</h2><p>Select a link to see how one everyday choice connects you to other places.</p><div class="you-net" id="youNet"><svg id="youLines" viewBox="0 0 100 100" preserveAspectRatio="none"></svg><div class="you-core">YOU</div>'+["FOOD","CLOTHES","APPS","FAMILY","TRAVEL","MEDIA"].map((x,i)=>'<button class="net-node" data-net="'+i+'">'+x+'</button>').join("")+'</div><div class="net-readout" id="netReadout"><strong>Choose a connection.</strong>Your everyday life reaches much further than your suburb or city.</div></div></div></section><main><div class="section-head" id="modules"><div><div class="eyebrow">Explore the unit</div><h2>Nine connected zones</h2></div><p>Each zone uses simple language first, then builds the explanation with examples and key words.</p></div><div class="module-grid">'+MODULES.map(moduleCard).join("")+'</div><section class="fun-grid"><article class="fun-card reveal-card"><div class="eyebrow">Quick mission</div><h3>Can you spot the connection?</h3><p id="missionText"></p><div c function setupClimate(){

 btns.innerHTML=months.map((m,i)=>'<button class="month-btn '+(i===0?"active":"")+'" data-month="'+i+'">'+m+'</button>').join("");
 document.querySelectorAll("[data-month]").forEach(b=>b.onclick=()=>{const i=+b.dataset.month;document.querySelectorAll("[data-month]").forEach(x=>x.classList.toggle("active",x===b));document.getElementById("climateReadout").innerHTML="<b>"+months[i]+"</b>Temperature: "+temps[i]+"°C · Precipitation: "+rain[i]+" mm"})
}
function setupInstagram(){const r=document.getElementById("viralRange");const update=()=>{const v=+r.value,vals=[Math.min(100,v+15),Math.round(v*.78),Math.max(5,Math.round(v*.92)),Math.max(5,Math.round(v*.75))];vals.forEach((x,i)=>{document.getElementById("viralBar"+i).style.setProperty("--v",x+"%");document.getElementById("viralOut"+i).textContent=x});let label,text;if(v<30){label="Low attention";text="The place is less visible online and visitor pressure is lower."}else if(v<70){label="Growing attention";text="More people discover the place. Income can rise, but crowding also grows."}else{label="Viral destination";text="Very high visibility can create strong business demand and strong pressure on the place."}document.getElementById("viralLabel").textContent=label;document.getElementById("viralText").textContent=text};r.oninput=update;update()}
function setupDigital(){const r=document.getElementById("digitalRange");const update=()=>{const v=+r.value,[a,b,c,d]=[v,Math.max(0,v-8),Math.max(0,v-4),Math.min(100,v+7)];[a,b,c,d].forEach((x,i)=>{document.getElementById("digitalBar"+i).style.setProperty("--v",x+"%");document.getElementById("digitalOut"+i).textContent=x});if(v<35){document.getElementById("digitalLabel").textContent="Limited access";document.getElementById("digitalText").textContent="People may miss online learning, telehealth, markets and fast communication."}else if(v<70){document.getElementById("digitalLabel").textContent="Growing access";document.getElementById("digitalText").textContent="More services and information become reachable, but gaps can remain."}else{document.getElementById("digitalLabel").textContent="Strong access";document.getElementById("digitalText").textContent="Digital links can support learning, services, business and communication more consistently."}};r.oninput=update;update()}
function setupImpactSorter(){let selected=null,score=0,done=new Set;document.querySelectorAll("[data-impact]").forEach(b=>b.onclick=()=>{selected=b;b.style.borderColor="var(--sand)"});const place=kind=>{if(!selected||done.has(selected.dataset.impact))return;const ok=selected.dataset.kind===kind;if(ok){score++;selected.classList.add("correct")}else selected.classList.add("wrong");done.add(selected.dataset.impact);document.getElementById(kind==="p"?"positiveZone":"negativeZone").appendChild(selected);document.getElementById("sortFeedback").innerHTML="<b>Score: "+score+" / "+done.size+"</b>"+(ok?"Correct.":"Not quite. Think about who or what is affected.");selected=null};document.getElementById("positiveBtn").onclick=()=>place("p");document.getElementById("negativeBtn").onclick=()=>place("n")}
function setupTrade(){const correct=["i","e","i","e","i","e"],done=new Set;let score=0;document.querySelectorAll("[data-trade]").forEach(b=>b.onclick=()=>{const i=+b.dataset.trade;if(done.has(i))return;done.add(i);const ok=b.dataset.pick===correct[i];if(ok){score++;b.classList.add("correct")}else b.classList.add("wrong");document.getElementById("tradeMsg"+i).textContent=ok?"Correct.":("Answer: "+(correct[i]==="i"?"IMPORT":"EXPORT"));document.getElementById("tradeScore").textContent=score+" / "+done.size+" correct"})}

document.getElementById("glossaryBtn").onclick=showGlossary;
document.getElementById("missionBtn").onclick=()=>{home();setTimeout(()=>document.querySelector(".fun-grid").scrollIntoView({behavior:"smooth"}),0)};
document.getElementById("topBtn").onclick=()=>scrollTo({top:0,behavior:"smooth"});
document.addEventListener("keydown",e=>{if(e.key==="/"&&document.activeElement!==search){e.preventDefault();search.focus()}if(e.key==="Escape"&&document.activeElement===search){search.value="";search.blur();home()}});
window.addEventListener("scroll",()=>{const h=document.documentElement.scrollHeight-innerHeight;document.getElementById("scrollbar").style.width=(h>0?scrollY/h*100:0)+"%"},{passive:true});
const savedTheme=localStorage.getItem("ic_theme");if(savedTheme)document.documentElement.dataset.theme=savedTheme;
function themeLabel(){theme.textContent=document.documentElement.dataset.theme==="dark"?"LIGHT":"DARK"}
theme.onclick=()=>{document.documentElement.dataset.theme=document.documentElement.dataset.theme==="dark"?"light":"dark";localStorage.setItem("ic_theme",document.documentElement.dataset.theme);themeLabel()};
themeLabel();updateProgress();home();
</script>
</body>
</html>
