<style>

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{

.key{font-size:.65rem;border:1px solid var(--line);border-radius:4px;padding:1px 5px;color:var(--muted)}

.hero{position:relative;overflow:hidden;border-bottom:1px solid var(--line)}
.hero:before{content:"";position:absolute;inset:0;background:

.module-card:hover{transform:translateY(-5px);border-color:color-mix(in srgb,var(--mint) 60%,var(--line));box-shadow:var(--shadow)}.module-card:hover:after{width:100%}

.module-hero:after{content:"";position:absolute;width:230px;height:230px;border-radius:50%;right:-70px;top:-100px;background:radial-gradient(circle,color-mix(in srgb,var(--coral) 10%,transparent),transparent 70%)}
.module-big-code{width:76px;height:76px;border-radius:10px;border:1px solid var(--line);display:grid;place-items:center;color:var(--coral);font:700 1rem "Space Grotesk",sans-serif;background:var(--surface)}
.module-hero h1{font:700 clamp(2.5rem,5vw,4.7rem)/.95 "Space Grotesk",sans-serif;letter-spacing:-.05em;margin:0}.module-hero p{color:var(--muted);margin:.65rem 0 0;max-width:820px}
.module-tabs{display:flex;gap:7px;overflow:auto;padding:11px 0 16px}.module-tab{white-space:nowrap;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:7px;padding:7px 9px;font-size:.8rem;font-weight:700}.module-tab.active{background:var(--mint);color:#10241c;border-color:var(--mint)}

.topic-title{font:700 1rem "Space Grotesk",sans-serif}.chev{width:30px;height:30px;border-radius:7px;border:1px solid var(--line);display:grid;place-items:center;color:var(--mint);transition:.2s}.topic[open] .chev{transform:rotate(180deg)}
.topic-body{display:grid;grid-template-columns:minmax(0,1fr) 315px;gap:18px;padding:0 16px 17px}

.side{display:grid;gap:9px;align-content:start}
.info{border:1px solid var(--line);border-radius:9px;background:var(--surface2);padding:12px}.info.green{background:color-mix(in srgb,var(--mint) 7%,var(--surface2))}
.label{font:700 .68rem "Space Grotesk",sans-serif;letter-spacing:.11em;text-transform:uppercase;color:var(--mint);margin-bottom:7px}

.check-question{color:var(--ink);font-weight:700}.reveal{border:1px solid var(--line);background:transparent;color:var(--mint);border-radius:6px;padding:6px 8px;margin-top:9px;font-weight:700}.answer{display:none;margin-top:8px;color:var(--muted)}.answer.show{display:block;animation:fadeIn .2s ease}@keyframes fadeIn{from{opacity:0}to{opacity:1}}

.activity-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.choice{border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:10px;text-align:left;color:var(--ink);font-weight:700}.choice:hover{border-color:var(--mint)}.choice.correct{background:color-mix(in srgb,var(--mint) 18%,var(--surface));border-color:var(--mint)}.choice.wrong{background:color-mix(in srgb,var(--coral) 14%,var(--surface));border-color:var(--coral)}
.sim-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.sim-panel{border:1px solid var(--line);border-radius:9px;padding:12px;background:var(--surface)}
.bar-row{display:grid;grid-template-columns:120px 1fr 44px;gap:9px;align-items:center;margin:9px 0}.bar-track{height:9px;border-radius:99px;background:var(--line);overflow:hidden}.bar-fill{height:100%;width:var(--v);background:linear-gradient(90deg,var(--mint),var(--sand),var(--coral));transition:width .35s}.bar-row output{font-weight:700;color:var(--sand)}
.range{width:100%;accent-color:var(--coral)}

.flow{display:flex;gap:8px;align-items:stretch;overflow:auto;padding-bottom:6px}.flow-step{min-width:145px;border:1px solid var(--line);border-radius:9px;background:var(--surface);padding:10px;position:relative}.flow-step b{display:block;color:var(--mint)}.flow-step small{color:var(--muted)}.flow-arrow{display:grid;place-items:center;color:var(--coral);font-weight:700}

.reveal-card{opacity:0;transform:translateY(12px);transition:.48s cubic-bezier(.2,.75,.2,1)}.reveal-card.visible{opacity:1;transform:none}

footer{border-top:1px solid var(--line);padding:28px 18px;color:var(--muted)}.footer-inner{max-width:1240px;margin:auto;display:flex;justify-content:space-between;gap:18px}.footer-inner b{color:var(--ink)}
@media(max-width:980px){.nav{display:none}.hero-inner{grid-template-columns:1fr}.module-grid{grid-template-columns:repeat(2,1fr)}.topic-body{grid-template-columns:1fr}.fun-grid,.sim-grid,.climate{grid-template-columns:1fr}.glossary-grid{grid-template-columns:repeat(2,1fr)}}

const MODULES=[{"id":"foundations","code":"01","title":"Understanding Interconnections","desc":"Build the big ideas: connection, interconnection, globalisation, global citizenship, impacts on developing economies and the ways people and places influence one another.","topics":[1,2,3,4,5,46]},{"id":"personal","code":"02","title":"Everyday Global Connections","desc":"Trace the links hidden inside food, clothes, apps, media, brands and a jar of Nutella.","topics":[6,7,8,9]},{"id":"skills","code":"03","title":"Geographical Skills","desc":"Use Australian and world maps, BOLTSS, latitude, longitude and climate graphs to describe places accurately.","topics":[10,11,12,13,14]},{"id":"travel","code":"04","title":"Travel & Tourism Patterns","desc":"Explore why people travel, where they go, how travel has recovered, and how social media and apps shape decisions.","topics":[15,16,17,18,19]},{"id":"tourism","code":"05","title":"Tourism Impacts & Sustainability","desc":"Investigate economic, social and environmental impacts through Venice, ecotourism and natural-area examples.","topics":[20,21,22,23,24,25]},{"id":"transport","code":"06","title":"Transport & the Shrinking World","desc":"Follow the changes from steam power to container ships, aircraft and lower-emission transport.","topics":[26,27,28,29]},{"id":"communication","code":"07","title":"Communication Technology","desc":"See how the internet connects people to information, learning, health, business and money — with a current focus on internet access in Africa and the digital divide.","topics":[30,31,32,33]},{"id":"trade","code":"08","title":"Trade & Global Flows","desc":"Understand imports, exports, tariffs, free trade and Australia's current trading connections.","topics":[34,35,36,37,38]},{"id":"consumption","code":"09","title":"Production, Consumption & Change","desc":"Follow the life of products through the iPhone, Nike and chocolate cases, then examine responsibility and sustainability.","topics":[39,40,41,42,43,44,45]}];

const TOPICS=[{"id":1,"module":"foundations","title":"Connection and interconnection","lead":"A connection is a link. An interconnection shows how connected people, places or things can affect one another.","paras":["A road can connect two suburbs, a flight can connect two countries, and a phone call can connect two people. These are all examples of connections.","Interconnection adds the idea of influence. Tourists are connected to a destination, but they also change it by spending money, using transport, creating waste and sharing photos. The destination changes the visitors too by giving them experiences, knowledge and memories.","Geographers look for these two-way relationships. A change in technology, transport, trade, culture or the environment in one place can create effects in another place."],"example":"A short video makes a quiet beach famous. More visitors arrive, local cafés earn more money, traffic increases and the beach may need stronger protection. One online post can therefore connect media, tourism, business and the environment.","terms":[["connection","a link between people, places or things"],["interconnection","a relationship in which connected things can affect one another"]],"q":"What extra idea does the word interconnection include?","a":"It includes influence: connected people, places or things can affect one another."},{"id":2,"module":"foundations","title":"Four ways people connect","lead":"Technology, economics, transport and culture create different kinds of links between people and places.","paras":["Technological connections include TikTok, Instagram and YouTube, video calls on Zoom or WhatsApp, streaming through services such as Netflix and Prime Video, and online games such as Fortnite, Roblox and Minecraft. A person in Sydney can use these systems to connect with people, entertainment and ideas from many countries.","Economic connections include Australia selling products and services overseas, global food chains such as McDonald's, KFC and Subway operating in many countries, and shoppers using platforms such as Amazon or eBay to buy from distant sellers.","Transport connections move people and goods. Planes carry travellers, ships carry freight and international parcel networks deliver online purchases. Cultural connections spread food, music, sport and traditions. Sushi, K-pop, the Olympics, the World Cup and migration are all examples."],"example":"One pair of sneakers can involve an online advertisement, a factory overseas, a container ship, a local shop and a fashion trend. That single product creates technological, economic, transport and cultural connections.","terms":[["economic connection","a link created through money, work, business or trade"],["cultural connection","a link created through shared or exchanged ideas, food, language, music, sport or traditions"]],"q":"Give one example of a technological connection and one transport connection.","a":"For example: a video call is technological; an international flight or container ship is a transport connection."},{"id":3,"module":"foundations","title":"Globalisation: how the world became more connected","lead":"Globalisation is the growing interconnection of economies, cultures, people and places through trade, transport, communication and investment.","paras":["The globalisation explainer used in the original learning sequence shows how improvements in transport and communication allow companies, goods, money, information and ideas to move between countries more easily. A business is no longer limited to producing and selling in one national market: design may happen in one country, raw materials may come from several others, manufacturing may occur where skills or costs are favourable, and the finished product may be sold worldwide.","This creates economic benefits. International competition can lower some prices, businesses can reach much larger markets, and countries can specialise in goods and services they produce efficiently. Globalisation also increases cultural exchange: music, food, sport, films, fashion and ideas can travel rapidly through media, migration and tourism.","The same process creates costs. A company may shift production from a high-cost country to a lower-cost location, which can reduce jobs in the original location. Workers in poorer economies may gain employment but can also face low wages, weak labour protections or unsafe conditions. Longer and more complex transport networks also use energy and create emissions.","The strongest conclusion is not that globalisation is automatically good or bad. Its effects depend on how governments, companies and consumers manage labour standards, environmental impacts, taxation, competition and access to opportunity. Geography therefore examines who benefits, who carries the costs and how impacts differ from place to place."],"example":"A current smartphone supply chain can include product design and engineering in the United States, iPhone cover glass made by Corning in Kentucky, advanced Apple silicon made by TSMC in Arizona, other chips and wafers made in Texas and New York, iPhone assembly in China mainland, and a growing assembly/component-manufacturing base in India. The finished phone is then shipped to markets such as Australia.","terms":[["globalisation","the increasing interconnection of people and places through trade, communication, transport, culture and investment"],["specialisation","focusing production on goods or services a place can produce efficiently"],["global supply chain","the network of places and businesses involved in creating and moving a product"]],"q":null,"a":null,"article":true,"sources":[["Globalisation explained – Explainity video","https://www.youtube.com/watch?v=JJ0nFD19eT8"],["UNCTAD – Global trade and development","https://unctad.org/"],["Apple – Supply Chain Innovation","https://www.apple.com/au/supply-chain/"],["Apple – U.S. manufacturing program","https://www.apple.com/newsroom/2025/08/apple-increases-us-commitment-to-600-billion-usd-announces-ambitious-program/"]],"countryExamples":[["United States","Apple designs its products there; Corning in Kentucky makes iPhone cover glass, TSMC in Arizona manufactures advanced Apple silicon, and U.S. facilities in Texas and New York make semiconductor wafers, chips and wireless/power-management components."],["China mainland","Apple's own supply-chain site identifies iPhone assembly there."],["India","Apple identifies component manufacturing there, and Foxconn and Tata operate major iPhone assembly facilities as Apple diversifies production."]]},{"id":4,"module":"foundations","title":"Article: the benefits and costs of globalisation","lead":"Globalisation can increase trade, jobs, investment, technology and cultural exchange, but the same connections can also create inequality, environmental pressure and dependence.","paras":["The globalisation-effects video used in the original learning sequence asks students to identify both positive and negative outcomes. The key geographical idea is that the same connection can benefit one group while creating costs for another.","On the positive side, businesses can reach customers in many countries and countries can sell products and services into larger markets. Foreign investment can create factories, jobs, training and infrastructure. Consumers may gain access to a wider range of goods, technology and information, while travel and media increase cultural exchange.","Global companies also benefit from being able to organise different stages of production in places with different skills, resources and costs. This can make goods cheaper or more widely available, and it can connect workers and suppliers to international markets.","The costs are less evenly distributed. Small local businesses may find it difficult to compete with multinational companies. Workers in some supply chains may receive low wages or face poor conditions. Production can use large amounts of water, energy and raw materials, while international freight contributes emissions.","Globalisation can also make places dependent on distant markets and companies. A factory town that relies heavily on one overseas buyer may be vulnerable if demand falls or production moves elsewhere. Cultural change can also be uneven: global brands and entertainment may spread rapidly while local traditions are commercialised or pushed aside.","A balanced judgement therefore asks four questions: who benefits, who carries the cost, where does the impact occur, and is the outcome sustainable over time? Globalisation is best understood as a system of interconnected benefits and risks rather than something that is simply 'good' or 'bad'."],"example":"A clothing factory can create jobs and export income in a lower-income economy, while the same supply chain may create concerns about wages, worker safety, water use and waste.","terms":[["economic benefit","a positive effect on income, employment, business or access to goods"],["external cost","a cost such as pollution that may fall on people or places outside the transaction"],["dependence","relying strongly on another market, company or supply source"]],"q":null,"a":null,"article":true,"sources":[["Globalisation effects – background video","https://www.youtube.com/watch?v=6QYOheSiMTM"],["Globalisation explained – Explainity video","https://www.youtube.com/watch?v=JJ0nFD19eT8"]]},{"id":5,"module":"foundations","title":"Global village and global citizenship","lead":"The global village is the idea that travel, media and communication make distant people feel part of one connected community.","paras":["The global village is the idea that travel, media and electronic communication make distant people feel part of one connected community. People can watch the same World Cup match, listen to the same music, follow the same news and speak across continents almost instantly.","Being connected does not mean every place becomes identical. Languages, traditions, beliefs and local identities remain important. The idea is that distance is less of a barrier to communication, culture and shared action.","A global citizen thinks about how choices can affect people and environments beyond the local area. This can include learning about human rights, climate change, poverty, waste, cultural diversity and other issues that cross borders.","Global citizenship is also about action. A person might volunteer, reduce waste, join a community project, support fairer products or exchange ideas with people in other countries. Small actions matter most when they connect with wider community, business and government action."],"example":"Sam learns that climate change affects communities around the world. Sam recycles at home, joins a local clean-up and shares ideas in an online environmental group with members in several countries. The local action is connected to a global issue.","terms":[["global village","the idea that the world feels more like one connected community"],["global citizen","a person who thinks about responsibilities and relationships beyond their own local area"]],"q":"What makes a person a global citizen?","a":"Thinking about the wider world and taking informed, responsible action on issues that affect people and places beyond the local area."},{"id":6,"module":"personal","title":"Your personal global web","lead":"Everyday choices can connect one person to many countries without that person leaving home.","paras":["Family history, migration, travel and language create personal connections. Food, clothing, music, sport, films, games and devices create many more.","A label on a shirt can show where it was made. A food package can show where ingredients came from. An app can connect its user to a company, servers and other users in several countries.","Mapping these links reveals a personal geography. It also raises questions: Which places appear most often? Which connections depend on trade? Which depend on technology? Which are cultural?"],"example":"A person might live in Australia, have family in Bangladesh, eat Japanese food, listen to Korean music, wear shoes made in Vietnam and use an American-owned app.","terms":[["personal connection","a link between a person and another person, place, product or activity"],["network","a group of connected links"]],"q":"Why can one person's daily routine involve many countries?","a":"Because family, products, food, media, travel and digital services can all come from or connect to different places."},{"id":7,"module":"personal","title":"Global brands, supply chains and local adaptation","lead":"Global brands connect countries through production and sales, but successful companies often adapt products to local cultures rather than selling exactly the same thing everywhere.","paras":["A global brand creates interconnections in two directions. Its supply chain links raw materials, factories, transport and shops across countries, while its marketing links consumers through media, sponsorship and digital platforms. The final product may look simple, but it can represent dozens of connections between places.","The fast-food example used in the learning material demonstrates another feature of globalisation: adaptation. International chains may keep a recognisable global brand while changing menus, ingredients, advertising or service styles to suit local tastes, cultural expectations and religious practices. This is sometimes described as thinking globally while acting locally.","This adaptation matters because culture does not disappear when a global company enters a new market. Instead, global and local influences interact. A brand can spread globally while still changing in response to the places where it operates.","The same pattern appears beyond food. Clothing sizes, streaming catalogues, advertising messages, payment systems and product features may all be adjusted to local markets. Globalisation therefore produces both standardisation and diversity."],"example":"A multinational restaurant may use the same logo and overall brand around the world but offer different menu items in India, Japan or Australia. The business is global, while parts of the product remain local.","terms":[["global brand","a brand marketed across many countries"],["adaptation","changing a product or strategy to fit a particular market"],["standardisation","using similar products or strategies across different markets"]],"q":null,"a":null,"article":true,"sources":[["Globalisation of McDonald's – background video","https://www.youtube.com/watch?v=HqXMvFH9EoY"]]},{"id":8,"module":"personal","title":"Case study article: MrBeast and global influencer reach","lead":"MrBeast demonstrates how a creator based in one country can reach hundreds of millions of people worldwide and turn digital attention into economic, cultural and charitable effects in real places.","paras":["The influencer section of the original material asks who the creator is, what he is known for and how he became known worldwide. Jimmy Donaldson, known online as MrBeast, is an American YouTube creator recognised for large-scale challenge videos, giveaways, entertainment projects and philanthropic videos.","One of the videos linked in the learning material is 'I Built 100 Homes And Gave Them Away!', published in 2024. The 100 homes were built across Jamaica, El Salvador, Argentina, Mexico and Colombia. The project therefore links an American creator and global online audience with housing projects and communities in five named countries, rather than an unspecified group of places.","His worldwide reach depends on digital infrastructure. YouTube can distribute the same video almost instantly across countries, recommendation systems expose it to new audiences, and subtitles or dubbing reduce language barriers. Social sharing then spreads clips and discussion onto other platforms.","The scale is now extraordinary. Social Blade recorded the main MrBeast YouTube channel at about 520 million subscribers on 7 October 2026, making it an unusually clear example of global digital reach. Subscriber totals change frequently, so the date must be attached to the figure.","Influence can create economic effects because creators promote brands, products and destinations and generate advertising demand. It can create cultural effects when formats, jokes and trends are copied internationally. It can also direct attention toward fundraising and social projects.","There are also risks. Online popularity can encourage excessive consumption, unrealistic expectations, misinformation or sudden visitor pressure on places featured in content. An influencer is therefore an example of interconnection: a digital action in one place can alter behaviour, spending and attention in many other places."],"example":"A video filmed in one country can be watched by millions of viewers elsewhere, generate advertising revenue, inspire copycat content and direct donations or visitors toward communities that most viewers have never physically visited.","terms":[["influencer","a person whose online content can affect the choices or behaviour of an audience"],["platform algorithm","a system that helps decide which content is recommended to users"],["digital reach","the size and geographic spread of an online audience"]],"q":null,"a":null,"article":true,"snapshot":"Current snapshot · 7 October 2026: Social Blade recorded the main MrBeast YouTube channel at about 520 million subscribers.","sources":[["MrBeast – I Built 100 Homes And Gave Them Away!","https://www.youtube.com/watch?v=KkCXLABwHP0"],["Social Blade – MrBeast current channel statistics","https://socialblade.com/youtube/handle/mrbeast"]],"countryExamples":[["Jamaica","The video begins with housing projects for families living in unsafe conditions and includes rebuilding away from flood risk."],["El Salvador","Families received homes; the project also added a community soccer field and equipment."],["Argentina","The team built homes for a small community so children had safer places to live and learn."],["Mexico","Additional homes were constructed for families in local communities."],["Colombia","Homes were built for families affected by severe windstorm damage; one family also received transport support."]]},{"id":9,"module":"personal","title":"Case study article: Nutella and its global ingredient network","lead":"Nutella is a strong example of interconnection because its history, ingredients, factories, transport network and consumers link many different parts of the world.","paras":["Nutella developed from Ferrero's post-war use of hazelnuts in Piedmont, Italy, when cocoa was scarce. Pietro Ferrero created an early hazelnut-and-cocoa product in 1946, it later became SuperCrema, and the first jar carrying the Nutella name appeared in 1964. Ferrero then expanded internationally; its wider manufacturing network now operates across more than 50 countries, while Ferrero products are sold in more than 170 countries.","Ferrero's latest detailed sourcing map makes the ingredient network specific. Cocoa comes from Côte d'Ivoire, Ghana, Nigeria, Ecuador and Colombia. Hazelnuts come from Türkiye, Chile, the United States, Italy, France, Georgia, Serbia and Argentina. Palm oil comes mainly from Malaysia and Indonesia, followed by Papua New Guinea and Guatemala. Most dairy ingredients come from Europe, mainly France, Germany and Italy. Sugar beet comes from European producers, while sugarcane comes mainly from Brazil, followed by the United States, Mexico and Australia.","Nutella cannot obtain every ingredient efficiently from one country because crops need different climates, soils and harvest seasons. Cocoa requires tropical conditions, hazelnuts perform well in temperate regions, and oil palm grows in humid tropical environments. Using several origins also spreads supply risk and helps Ferrero source enough volume for global production.","Manufacturing is also geographically distributed. Ferrero's Villers-Écalles plant in France is the world's largest Nutella production site. Ferrero's wider factory network includes Alba in Italy, Lithgow in Australia, Brantford in Canada, Hangzhou in China, Baramati in India, Manisa in Türkiye, Arlon in Belgium, Belsk Duzy in Poland, Poços de Caldas in Brazil, Quito in Ecuador and several plants in the United States. These examples show that the company's global presence is made up of named production locations rather than an abstract 'worldwide network'.","Finished products then move through warehouses, ports, road freight and retail distribution to consumer markets. A jar sold in Sydney can therefore link ingredient-producing countries, manufacturing locations, shipping networks, Australian retailers and the final consumer.","Older classroom materials sometimes state a precise number of Nutella jars sold each year or identify one country as the world's largest buyer. Ferrero's current public reporting does not provide a verified current annual jar total or a current country-by-country Nutella sales ranking. Those older figures should therefore not be presented as current facts.","Current sustainability information also changes the case study. Ferrero's 2025 sustainability reporting says cocoa reached 98% traceability to farm polygon maps, palm oil 98.6% traceability to plantation and hazelnuts 97% traceability to farmer. This means the modern supply chain is increasingly expected to identify not only the country of origin, but the farm or plantation behind the ingredient."],"example":"A jar bought in Sydney can connect hazelnut growers in Türkiye or Chile, cocoa farmers in West Africa or Latin America, palm-oil producers in Southeast Asia, a Ferrero factory, freight networks, Australian retailers and the final consumer.","terms":[["traceability","the ability to follow an ingredient back through the supply chain to its origin"],["raw material","a basic material used to make a product"],["supply resilience","the ability of a supply chain to continue operating when one source or route is disrupted"]],"q":null,"a":null,"snapshot":"Current evidence · Ferrero 2025: cocoa 98% traceable to farm polygon maps, palm oil 98.6% to plantation, hazelnuts 97% to farmer; Ferrero brands are sold in 170+ countries.","article":true,"sources":[["Nutella – Our Heritage","https://www.nutella.com/au/en/inside-nutella/our-heritage"],["Ferrero – 2025 Sustainability Report highlights","https://www.ferrero.com/us/en/news-stories/news/ferrero-group-2025-sustainability-report-spotlights-ferrero-farming-values-as-a-driver-of-resilience-across-supply-chains"],["Ferrero – Our sourcing approach","https://www.ferrero.com/int/en/people-planet/source-our-ingredients-sustainably/our-sourcing-approach"],["Nutella global-product background presentation","https://prezi.com/ojmtw6kd6nrb/nutella-a-global-product/"],["Nutella background video","https://www.youtube.com/watch?v=EN-plHDGQAM"],["Ferrero – 2024 Sustainability Report","https://www.ferrero.com/int/sites/ferrero_int/files/2025-07/ferrero-group-2024-sustainability-report.pdf"],["Ferrero – Key figures 2024/25","https://www.ferrero.com/au/en/about-us/key-figures"]],"countryExamples":[["Côte d'Ivoire, Ghana, Nigeria, Ecuador, Colombia","Cocoa."],["Türkiye, Chile, United States, Italy, France, Georgia, Serbia, Argentina","Hazelnuts."],["Malaysia, Indonesia, Papua New Guinea, Guatemala","Palm oil."],["France, Germany, Italy","Main dairy-sourcing countries."],["Brazil, United States, Mexico, Australia","Main sugarcane origins; sugar beet is sourced from European producers."],["France","Villers-Écalles is Ferrero's largest Nutella production site."],["Australia","Ferrero manufacturing plant at Lithgow."],["China","Ferrero manufacturing plant at Hangzhou."],["India","Ferrero manufacturing plant at Baramati."],["Türkiye","Ferrero manufacturing plant at Manisa."]]},{"id":10,"module":"skills","title":"Australia map essentials","lead":"A strong map reader can locate major Australian features and use direction and position accurately.","paras":["Australia's national capital is Canberra. Tasmania is the island state south of mainland Australia. Queensland, New South Wales and Victoria lie along the east and southeast of the mainland, with capitals Brisbane, Sydney and Melbourne.","The Tropic of Capricorn, at about 23.5°S, crosses the Australian mainland. Uluru is in the southern part of the Northern Territory.","Important water bodies around Australia include the Indian Ocean to the west, the Pacific Ocean to the east, the Southern Ocean to the south, the Tasman Sea between Australia and New Zealand, and the Great Australian Bight along the southern coastline."],"example":"If a map question asks you to locate Uluru, first find the Northern Territory, then place it in the southern interior rather than near Darwin.","terms":[["capital city","the city where a national or state government is based"],["Great Australian Bight","the large open bay along the southern coast of mainland Australia"]],"q":"Which latitude line crosses mainland Australia?","a":"The Tropic of Capricorn, about 23.5°S."},{"id":11,"module":"skills","title":"World maps, oceans and hemispheres","lead":"World maps help us describe where places are in relation to continents, oceans and hemispheres.","paras":["The Equator divides Earth into the Northern and Southern Hemispheres. The Prime Meridian helps divide locations into eastern and western positions.","Major oceans connect continents through shipping, travel and climate systems. The Pacific Ocean lies east of Australia, while the Indian Ocean lies to the west.","Relative location describes where something is compared with another place. Absolute location uses coordinates such as latitude and longitude."],"example":"Australia is south of the Equator and mostly east of the Prime Meridian. It lies between the Indian and Pacific oceans.","terms":[["hemisphere","half of Earth"],["relative location","the position of a place described in relation to other places"]],"q":"Which two major oceans lie on the western and eastern sides of Australia?","a":"The Indian Ocean to the west and the Pacific Ocean to the east."},{"id":12,"module":"skills","title":"BOLTSS: making a useful map","lead":"BOLTSS is a checklist for the information a clear geographical map should include.","paras":["B is Border, the line around the map. O is Orientation, usually a north arrow. L is Legend, the key explaining symbols and colours.","T is Title, which states the map's purpose. The first S is Scale, showing the relationship between map distance and real distance. The final S is Source, explaining where the information came from.","A map can be colourful but still weak if the reader cannot work out what symbols mean, which way is north or where the information came from."],"example":"A map showing countries connected to your clothes should include a title, a legend for different product types, a north arrow if direction matters and a source for the country information.","terms":[["legend","a key explaining map symbols and colours"],["scale","the relationship between a distance on a map and the real distance"]],"q":"What do the two S letters in BOLTSS stand for?","a":"Scale and Source."},{"id":13,"module":"skills","title":"Latitude and longitude","lead":"Latitude and longitude work together like a global address.","paras":["Latitude measures north–south position from the Equator. The Equator is 0°. The Tropic of Cancer is about 23.5°N, the Tropic of Capricorn about 23.5°S, the Arctic Circle about 66.5°N and the Antarctic Circle about 66.5°S.","The tropics lie between the Tropic of Cancer and the Tropic of Capricorn. The Sun can be very high in the sky in this region, so tropical areas are generally warm. Rainfall varies, but many tropical places have clear wet and dry seasons.","Longitude measures east–west position from the Prime Meridian at 0°, which passes through Greenwich in London. The Prime Meridian also crosses parts of France, Spain, Algeria, Mali, Burkina Faso, Togo and Ghana.","The International Date Line is roughly opposite the Prime Meridian near 180°. It bends through the Pacific to avoid splitting some countries and island groups into different calendar days.","Crossing the International Date Line changes the calendar date. Near the Bering Strait, eastern Russia and Alaska are geographically close but can be on different calendar days."],"example":"Sydney is south of the Equator and east of the Prime Meridian, so its coordinates use S and E.","terms":[["latitude","distance north or south of the Equator, measured in degrees"],["longitude","distance east or west of the Prime Meridian, measured in degrees"],["International Date Line","the line near 180° longitude where the calendar date changes"]],"q":"What is the reference line for longitude?","a":"The Prime Meridian at 0° longitude."},{"id":14,"module":"skills","title":"How to read a climate graph","lead":"A climate graph shows how temperature and precipitation change through a year.","paras":["The horizontal axis normally shows the months. A line shows average monthly temperature in degrees Celsius. Columns show monthly precipitation, usually in millimetres.","To describe the graph, find the warmest and coolest months, calculate the temperature range, and identify the wettest and driest months. Then look for a seasonal pattern.","Halifax, Canada, is used in the interactive example on this site. The graph lets you select a month and read temperature and precipitation together. The important skill is not memorising the numbers; it is learning how the two sets of data are displayed and compared."],"example":"If the line rises strongly from winter to summer and then falls, the place has a clear seasonal temperature pattern. If the bars stay similar, precipitation is spread more evenly through the year.","terms":[["precipitation","water falling from the atmosphere, including rain and snow"],["temperature range","the highest temperature minus the lowest temperature"]],"q":"What do the columns usually show on a climate graph?","a":"Precipitation or rainfall."},{"id":15,"module":"travel","title":"Why do people travel?","lead":"People travel for leisure, family, health, culture, study, work and new experiences.","paras":["Leisure travel includes holidays, relaxation and recreation. Cultural travel may focus on food, heritage, festivals or learning about different ways of life.","People also travel to visit relatives and friends, seek medical treatment, attend meetings, study, inspect work sites or build business networks.","One trip can have several purposes. Faster transport and digital booking systems have also made it easier for many people to organise long-distance trips."],"example":"A person may travel overseas for a family wedding, visit relatives, explore local food and spend several days on holiday during the same journey.","terms":[["leisure","free time used for enjoyment"],["tourism","temporary travel away from home for leisure, culture, business or other purposes"]],"q":"Name three different reasons people may travel.","a":"Examples include holidays, family, culture, health, study, work or business."},{"id":16,"module":"travel","title":"International tourism: current global patterns","lead":"International tourism has recovered beyond pre-pandemic levels, but growth is uneven and can change quickly when conflict, prices, climate events or transport disruption affect travel.","paras":["UN Tourism recorded an estimated 1.52 billion international tourist arrivals in 2025, about 4% more than in 2024 and roughly 6% above 2019. Europe remained the world's largest destination region, welcoming about 793 million international tourists in 2025.","The newest global update available in September 2026 shows a slower pattern. Around 690 million tourists travelled internationally in the first half of 2026, only 0.4% more than in the same period of 2025. Europe grew about 3% and Africa about 4%, while the Middle East recorded a large decline linked to conflict and air-travel disruption.","These figures show why tourism maps and rankings need a date. Travel patterns respond to exchange rates, airline capacity, visa rules, safety, major events, social media, climate conditions and household budgets. A country that grows quickly one year may slow the next.","The geographical pattern is also highly concentrated. Famous cities, beaches and heritage sites attract large shares of visitors, which can create employment and income but also crowding, pressure on housing, waste and environmental damage. This leads directly to the study of overtourism and sustainable tourism."],"example":"A viral destination may experience rapid visitor growth, but a conflict, heatwave or rise in airfares can change demand within months. Tourism is therefore both globally connected and highly sensitive to events.","terms":[["international tourist arrival","an overnight visitor who travels to another country"],["tourism pattern","the spatial distribution and movement of tourists"],["tourism resilience","the ability of tourism systems to cope with disruption and recover"]],"q":null,"a":null,"snapshot":"Latest global update · H1 2026: about 690 million international tourists, +0.4% year on year. Full-year 2025: 1.52 billion arrivals.","article":true,"sources":[["UN Tourism – World Tourism Barometer","https://www.untourism.int/zh-hans/node/11628"]]},{"id":17,"module":"travel","title":"Article: social media and the tourism effect","lead":"Social media can change where people travel by turning landscapes, cafés and viewpoints into globally recognisable destinations, creating both new income and new pressure.","paras":["The tourism material uses the 'Instagram effect' to show how digital communication can alter real travel patterns. A striking photograph or short video can be viewed by people in many countries, copied by other travellers and repeated until one particular viewpoint becomes a destination in its own right.","Wanagiri Hidden Hills in Bali and the hot-air-balloon landscapes of Cappadocia in Türkiye are useful examples. Visitors do not only travel to see the wider region; many arrive with a specific photograph or online image already in mind. Social media therefore affects perceptions of place before the journey begins.","This can be economically positive. Online exposure can bring customers to accommodation, restaurants, guides, transport providers and small businesses. Less-known places may gain an international audience without the cost of a large traditional advertising campaign.","The same attention can create environmental and social problems when visitor numbers rise faster than local management. Paths may erode, vegetation can be damaged, litter and traffic can increase, and residents may lose access to spaces that were previously quiet. Queues for one photograph can also concentrate visitors into a very small area.","Social media can create unrealistic expectations because images are carefully selected, edited or photographed at quiet times. A traveller may arrive expecting an empty landscape and instead find crowds, commercial photo props or conditions very different from the image.","The geographical lesson is that online and physical spaces are interconnected. A trend on a phone can redirect flows of people, money and transport toward a real location. Sustainable destination management may therefore require visitor limits, stronger paths, waste facilities, public-transport planning and campaigns encouraging travellers to spread out across different places and seasons."],"example":"If thousands of people copy the same photograph at one viewpoint, local businesses can gain customers while the exact spot experiences erosion, queues, litter and traffic.","terms":[["Instagram effect","the influence of highly shareable online images on travel interest and visitor flows"],["destination image","the ideas and expectations people hold about a place"],["overtourism","visitor pressure that exceeds what a place or community can comfortably manage"]],"q":null,"a":null,"article":true,"sources":[["UN Tourism – tourism trends and destination management","https://www.untourism.int/"],["Venice overtourism case – ABC News","https://www.abc.net.au/news/2019-03-13/saving-venice/10893508"]]},{"id":18,"module":"travel","title":"Australian tourism after COVID-19: recovery and current conditions","lead":"Australian tourism has recovered strongly from the pandemic, but different statistics measure different parts of the visitor economy and should not be mixed together.","paras":["The pandemic caused an extraordinary interruption to Australian tourism because international borders closed and long-distance travel collapsed. Domestic travel became much more important, with Australians taking regional trips and staycations while international visitation remained restricted. The linked post-COVID tourism material emphasised the importance of tourism for jobs, businesses, regional communities, infrastructure and cultural exchange.","Recovery is now clear in official Tourism Research Australia data. In the year ending June 2026, Australia recorded 8.4 million international trips. International visitors spent A$40.5 billion in Australia and total trip spending was A$57.0 billion when spending outside Australia connected with the trip was also included.","The recovery is strong but not identical to the pre-pandemic pattern. By the year ending December 2025, international visitor spending in Australia was already 25% above the comparable 2019 level, while the number of trips was still about 5% below 2019. This means visitors were, on average, staying longer or spending more even though trip numbers had not fully returned to the old level.","Tourism Research Australia's 2025 annual benchmark placed total visitor spending across Australia's visitor economy at A$192.4 billion. A different WTTC measure forecast the broader Travel & Tourism contribution to the Australian economy at A$314.4 billion in 2025 and 1.7 million jobs. These numbers are not contradictory: visitor spending and total economic contribution measure different things.","Popular Australian destinations include major cities, beaches, the Great Barrier Reef, national parks and culturally significant landscapes. Tourism supports accommodation, food services, transport, retail and attractions, but growth must be managed because sensitive places can be damaged by crowding, emissions, waste and poorly planned development.","Travel technology has also changed the recovery. Airline apps, online booking sites, digital maps, review platforms and social media reduce the effort needed to compare prices, plan routes and discover destinations. They make travel easier while also concentrating attention on places that become popular online."],"example":"A visitor who flies to Cairns, stays in a hotel, books a reef tour, eats at restaurants and buys local products supports several connected sectors of the Australian economy.","terms":[["visitor economy","the businesses and activities supported by people travelling away from their usual environment"],["domestic tourism","travel within a person's own country"],["international visitor spend","money spent in Australia by overseas visitors"]],"q":null,"a":null,"snapshot":"Latest official snapshot · Year ending June 2026: 8.4m international trips; A$40.5b spent in Australia; A$57.0b total trip spend.","article":true,"sources":[["Tourism Research Australia – International tourism results","https://www.tra.gov.au/en/tourism-statistics/international-tourism-results"],["Tourism Research Australia – Annual benchmark report","https://www.tra.gov.au/en/tourism-industry-analysis/annual-benchmark-report"],["WTTC – Australia Travel & Tourism 2025","https://wttc.org/news/australias-travel-tourism-sector-set-to-reach-record-315bn-in-2025"],["Post-COVID tourism background article","https://www.torrens.edu.au/blog/6-reasons-why-tourism-is-so-important-to-australias-post-covid19-economy"]]},{"id":19,"module":"travel","title":"Travel apps and changing travel behaviour","lead":"Digital tools now influence how people plan, book, navigate and review trips.","paras":["Map apps help with navigation and public transport. Airline and accommodation apps support bookings and updates. Review platforms provide opinions from previous visitors, while ride-hailing apps connect travellers with local transport.","These tools reduce uncertainty. A traveller can compare prices, translate information, check opening times and change plans while already travelling.","Digital convenience can also create problems. Reviews may be unreliable, app-based recommendations can send too many people to the same place, and travellers without good internet access or payment options may be disadvantaged."],"example":"A visitor can use Google Maps for directions, an airline app for a boarding pass, Booking.com for accommodation and a ride-hailing app for a trip from the station.","terms":[["digital platform","an online system that connects users, information or services"],["review","a user's opinion or rating of a service, product or place"]],"q":"Give two ways travel apps can make a trip easier.","a":"Examples include navigation, booking, price comparison, transport updates, translation and reviews."},{"id":20,"module":"tourism","title":"Positive and negative impacts of tourism","lead":"Tourism can change the economy, society and environment at the same time.","paras":["Positive economic impacts include jobs, business income and investment. Visitor demand may also support better roads, airports, public spaces and other infrastructure.","Positive social impacts can include cultural exchange and support for heritage. Environmental benefits can occur when tourism income helps pay for national parks, conservation or restoration.","Negative impacts include overcrowding, pollution, habitat damage, rising prices, seasonal jobs and cultural commercialisation. The same project can produce both positive and negative effects."],"example":"A resort creates jobs and pays local suppliers, but it may also increase traffic, waste and demand for land or water.","terms":[["economic impact","an effect on jobs, income, business or costs"],["social impact","an effect on communities, culture, behaviour or quality of life"],["environmental impact","an effect on natural systems such as land, water, plants and animals"]],"q":"Why should tourism impacts be examined in more than one category?","a":"Because tourism can affect the economy, communities and the environment in different ways at the same time."},{"id":21,"module":"tourism","title":"Case study article: Venice, overtourism and visitor management","lead":"Venice shows how tourism can support an economy while simultaneously placing intense pressure on housing, public space, infrastructure, residents and a fragile lagoon environment.","paras":["The ABC 'Saving Venice' report linked in the learning sequence documented the social consequences of mass tourism before the pandemic. In 2019 it reported more than 25 million tourists visiting Venice over a year while only about 53,000 residents remained in the historic city. It described crowded public spaces, short-stay day visitors, conversion of housing to tourist accommodation and rising rents that made it harder for local people to remain.","Tourism also brings major benefits. Visitors support hotels, restaurants, guides, transport, shops, museums and many other jobs. Tourism income helps maintain Venice's role as one of the world's great cultural destinations. The problem is therefore not simply the existence of tourism; it is the scale, timing and type of visitor pressure in a city with limited space and a delicate built environment.","Cruise tourism became one of the most visible conflicts. The ABC report showed local opposition to very large ships entering the lagoon and described concerns about crowding, pollution, wave action and damage to the physical environment. Italy introduced a major protection measure in 2021: ships over 25,000 gross tonnes, longer than 180 metres, over 35 metres high or exceeding specified sulphur limits were prohibited from transiting the San Marco Basin, San Marco Canal and Giudecca Canal.","Venice has also experimented with an access fee for some day visitors. In 2026 the fee operated on 60 selected days between April and July. The city's provisional results recorded 679,553 paid vouchers and €5.215 million in revenue. More importantly for visitor management, the city reported that the average daily number of paid vouchers was 32.3% lower than in 2024 and that the most extreme high-flow days occurred less frequently. The city still describes the measure as experimental, so it should not be treated as a complete solution to overtourism.","Environmental risk extends beyond crowds. Venice is built in a lagoon and has long faced flooding, subsidence and sea-level risk. Climate change increases the long-term challenge because higher sea levels can make damaging high-water events more difficult to manage. Measures such as the MOSE flood-barrier system, restrictions on large ships and visitor-management policies address different parts of the problem.","The central lesson is that sustainable tourism requires balance. Venice needs tourism income, but it also needs permanent residents, functioning neighbourhoods, affordable housing, protected heritage and a healthy lagoon. A successful strategy must therefore manage visitor numbers and behaviour while protecting the city as a living community."],"example":"A day visitor may contribute some spending but also uses bridges, streets, water transport, waste services and public space. When very large numbers arrive at the same time, these small individual impacts combine into major pressure.","terms":[["overtourism","visitor pressure that exceeds what a destination can comfortably manage"],["day-tripper","a visitor who arrives and leaves without staying overnight"],["carrying capacity","the level of use a place can accommodate without unacceptable damage or loss of quality"]],"q":null,"a":null,"snapshot":"2026 access-fee results · 60 charge days; 679,553 paid vouchers; €5.215m revenue; average daily paid vouchers reported 32.3% below 2024.","article":true,"sources":[["ABC News – Saving Venice","https://www.abc.net.au/news/2019-03-13/saving-venice/10893508"],["Venice – 2026 access-fee results","https://live.comune.venezia.it/index.php/it/2026/07/contributo-di-accesso-i-dati-provvisori-del-2026-calano-la-media-giornaliera-dei-voucher-e"],["Italian law restricting large cruise ships","https://www.normattiva.it/atto/caricaDettaglioAtto?atto.codiceRedazionale=21G00114&atto.dataPubblicazioneGazzetta=2021-07-20"],["Venice tourism background video 1","https://www.youtube.com/watch?v=8KB0CkzvT6Y"],["Venice tourism background video 2","https://www.youtube.com/watch?v=TwX0PmLdbqc"]]},{"id":22,"module":"tourism","title":"How tourism can damage environments","lead":"Tourism can affect coasts, mountains, forests, wetlands, reefs, wildlife and soils if visitor use and development are poorly managed.","paras":["On coasts, people can trample sand dunes and developers may clear vegetation for resorts, roads, parking and other facilities. Unplanned growth can spread buildings along scenic coastlines and increase waste and sewage.","In marine environments, anchors, boating, diving and shoreline development can damage coral and seagrass. Land clearing increases sediment in water, while nutrient-rich sewage can disturb coral-reef conditions.","In mountains and forests, clearing land for ski facilities or resorts can increase erosion and land risk. Trails can compact soil and damage vegetation. Wildlife viewing can also disturb feeding, breeding or movement if people get too close.","Draining coastal wetlands removes habitats that support many species. Building on fertile soils can also reduce land available for agriculture. Good planning tries to keep visitors away from sensitive areas and set limits before damage becomes difficult to reverse."],"example":"A popular walking trail becomes wider as visitors step around muddy sections. Vegetation dies, bare soil is exposed and heavy rain then washes more soil away.","terms":[["erosion","the wearing away and movement of soil or rock"],["biodiversity","the variety of living things in an area"],["sediment","small particles of soil or rock carried by water"]],"q":"How can a walking trail eventually cause biodiversity loss?","a":"Heavy trampling can kill vegetation and compact or expose soil, leading to erosion and habitat loss."},{"id":23,"module":"tourism","title":"What is ecotourism?","lead":"Ecotourism is responsible travel in natural areas that aims to protect the environment and support local communities.","paras":["Ecotourism is not simply any holiday in nature. A more sustainable operation tries to reduce waste, protect wildlife, control visitor behaviour and use water and energy carefully.","Local communities should benefit through employment, local purchasing, cultural experiences and a real voice in tourism decisions. This helps keep more benefits in the destination.","Common strategies include renewable energy, recycling, locally grown food, low-emission transport, visitor limits, environmental rules and education about conservation."],"example":"A small rainforest lodge uses solar power, employs local guides, keeps visitors on marked tracks and contributes money to habitat restoration.","terms":[["ecotourism","responsible tourism in natural areas that supports conservation and local communities"],["sustainable tourism","tourism managed so economic, social and environmental benefits can continue into the future"]],"q":"What makes ecotourism different from simply visiting a natural place?","a":"It includes active efforts to protect the environment and support local communities."},{"id":24,"module":"tourism","title":"Case study article: Daintree Wilderness Lodge and sustainable ecotourism","lead":"Daintree Wilderness Lodge demonstrates how accommodation can reduce its footprint while helping visitors experience a sensitive rainforest landscape and learn about Kuku Yalanji Country.","paras":["Daintree Wilderness Lodge is located in the Wet Tropics World Heritage Area of Far North Queensland on Kuku Yalanji Country. It operates at a very small scale: the property has seven eco-certified cabins set within rainforest, rather than a large resort complex.","The physical design is a major sustainability feature. The cabins are elevated and connected by raised walkways so construction and guest movement disturb less of the forest floor. The lodge states that it was hand-built with minimal machinery and disturbance. This matters in rainforest because soil, roots, leaf litter and small organisms are all part of the ecosystem.","The lodge is also off-grid. Its main power source is a stand-alone solar array with battery and generator backup. Water is drawn from a spring via a bore and tested, while a Bio Cycle wastewater system treats waste. Recycling and waste-reduction systems are used to reduce pressure on the surrounding environment.","Sustainable tourism is not only about technology. The lodge's location on Kuku Yalanji Country creates opportunities for visitors to engage with Indigenous-owned cultural tours that teach bush foods, medicines, stories and traditions. This strengthens the connection between tourism, culture and Country rather than treating the rainforest only as scenery.","The case also explains why ecotourism can be important. Carefully managed nature tourism can provide income and employment that depend on keeping an environment healthy. It can educate visitors, support conservation and direct spending toward local businesses and guides. However, the label 'eco' only has value when practices genuinely reduce impact and when visitor activity is managed responsibly.","Other tourist destinations can apply the same principles at different scales: limit damage to sensitive areas, reduce waste, conserve water, use renewable energy, employ local people, support local food and businesses, protect wildlife, control visitor numbers where necessary and educate guests about appropriate behaviour."],"example":"Raised cabins and walkways allow guests to stay inside the rainforest while reducing direct trampling and disturbance of the forest floor.","terms":[["ecotourism","responsible nature-based tourism that supports conservation and local communities"],["off-grid","operating without relying fully on public utility networks"],["regenerative tourism","tourism that aims to leave communities and environments better rather than only reducing harm"]],"q":null,"a":null,"snapshot":"Current snapshot · Daintree Wilderness Lodge operates seven elevated eco-certified cabins and reports a stand-alone solar system, Bio Cycle wastewater treatment, recycling and low-impact construction.","article":true,"sources":[["Daintree Wilderness Lodge – Sustainability","https://daintreewildernesslodge.com.au/sustainability/"],["Daintree Wilderness Lodge – Eco-certified cabins","https://daintreewildernesslodge.com.au/stay/daintree-cabins/"],["Daintree Wilderness Lodge – Indigenous cultural tours","https://daintreewildernesslodge.com.au/local-attractions/indigenous-cultural-tours-walkabout-cultural-adventures/"]]},{"id":25,"module":"tourism","title":"Ecotourism examples around the world","lead":"Different natural destinations use different strategies because ecosystems and communities have different needs.","paras":["The Great Barrier Reef in Australia depends on reef protection, visitor education and careful boating or diving. The Galápagos Islands in Ecuador use strict conservation rules because many species are unique and vulnerable.","Costa Rica is known for protected rainforests, wildlife reserves and lodges linked with nature tourism. Yellowstone National Park in the United States combines visitor access with wildlife and geothermal protection.","In Borneo, tourism can support rainforest and orangutan conservation, but it must avoid stressing wildlife or encouraging habitat loss. The strongest ecotourism model protects the environment while allowing local communities to benefit."],"example":"A wildlife tour that keeps a safe distance, uses trained local guides and limits group size can create income without encouraging visitors to approach or feed animals.","terms":[["carrying capacity","the level of use a place can handle without unacceptable damage"],["conservation","protection and careful management of environments and species"]],"q":"Why might an island wildlife destination need stricter visitor controls than a large urban attraction?","a":"Island ecosystems may contain rare species and limited habitats that can be damaged more easily by high visitor pressure."},{"id":26,"module":"transport","title":"Transport and the shrinking world","lead":"Faster and cheaper transport makes long distances feel smaller because people and goods can cross them more easily.","paras":["The steam engine transformed ships and railways. The internal combustion engine later supported cars, trucks and many aircraft technologies. Each change increased speed, reliability or the amount that could be moved.","Modern transport connects people to work, family, tourism and services. It connects businesses to suppliers and customers and makes global production possible.","The phrase shrinking world does not mean Earth is physically smaller. It means that the time, cost and difficulty of connecting across distance have been reduced."],"example":"A voyage between Europe and Australia once took many weeks or months by sailing ship. Modern aircraft can cover the intercontinental journey in about a day.","terms":[["transport network","connected routes used to move people or goods"],["shrinking world","the idea that faster transport and communication reduce the importance of distance"]],"q":"Why is the world described as shrinking?","a":"Because improved transport and communication reduce the time and difficulty of connecting over long distances."},{"id":27,"module":"transport","title":"How the shipping container changed global trade","lead":"Standard shipping containers reduced the time and cost of moving goods between ships, trains and trucks, helping create today's highly interconnected global supply chains.","paras":["Before containerisation, cargo was often loaded and unloaded piece by piece. This was slow, labour-intensive and vulnerable to damage or theft. Standard containers transformed the system because the same sealed box could move from factory to truck, rail terminal, ship and another truck without repeatedly unpacking the goods.","Containerisation helped ports become faster and more specialised. Cranes, container terminals, tracking systems and standard dimensions allowed much larger volumes of goods to move through global networks. Factories could be located far from consumers because transport became more predictable and relatively cheaper.","The result is visible in everyday products. Clothing, furniture, electronics, toys and machinery can cross oceans in containers and then move inland by rail or road. This helps businesses use global supply chains but also increases dependence on ports, shipping routes and logistics systems.","UN Trade and Development reports that more than 80% of international trade in goods by volume is carried by sea. Its 2025 review also shows the vulnerability of these networks: global maritime trade growth was expected to slow to about 0.5% in 2025 as geopolitical tensions and route disruptions increased distances and costs.","Container shipping therefore creates both efficiency and interdependence. When a major port closes or ships avoid a chokepoint, containers may arrive late, freight costs can rise and factories or shops thousands of kilometres away may feel the effects."],"example":"A pair of shoes can leave a factory in a sealed container, travel by truck to a port, cross the ocean by container ship and move by rail and truck to a distribution centre without the individual boxes being handled at every stage.","terms":[["containerisation","the use of standard freight containers across different transport modes"],["intermodal transport","moving goods using more than one form of transport without unloading the cargo itself"],["chokepoint","a narrow route through which a large amount of transport or trade must pass"]],"q":null,"a":null,"article":true,"snapshot":"Current context · UNCTAD 2025: more than 80% of world merchandise trade by volume moves by sea; maritime trade growth was projected at only 0.5% in 2025.","sources":[["UNCTAD – Review of Maritime Transport 2025","https://unctad.org/publication/review-maritime-transport-2025"]]},{"id":28,"module":"transport","title":"How airplanes strengthen global interconnections","lead":"Air transport compresses time by moving people and high-value or time-sensitive goods across continents within hours rather than days or weeks.","paras":["Airplanes strengthen personal connections because people can visit relatives, migrate, study overseas and travel for holidays much more quickly than in the past. They also support cultural exchange as tourists, students and workers carry ideas, languages, food traditions and experiences between places.","Air travel is also essential for business. Executives, specialists and workers can attend meetings or reach worksites in distant countries, while aviation links major global cities through hub airports. These routes help firms manage international operations and connect service industries such as finance, education and tourism.","Air cargo performs a different role from shipping. Ships are best for very large volumes at lower cost, while aircraft are valuable for goods where speed matters, including pharmaceuticals, electronics, urgent spare parts, fresh produce and e-commerce shipments. IATA reported that global air-cargo demand in August 2026 was 4.4% higher than a year earlier, with international cargo traffic up 5.3%.","The environmental trade-off is important. Aviation uses large amounts of energy and creates greenhouse-gas emissions. This is why the geography of transport involves choices between speed, price and environmental impact. For freight that does not need to move urgently, lower-carbon modes such as sea or rail may be more appropriate.","The 'shrinking world' does not mean physical distance has changed. It means improvements in speed, cost and communication make distant places feel more accessible and connected."],"example":"A medical device made in another continent can be flown to Australia within a short time when a hospital needs it urgently, while less time-sensitive equipment may travel by sea.","terms":[["air cargo","goods transported by aircraft"],["hub airport","a major airport where passengers or cargo connect between routes"],["time-space compression","the idea that faster transport and communication make distance feel less significant"]],"q":null,"a":null,"article":true,"snapshot":"Latest cargo indicator · August 2026: global air-cargo demand +4.4% year on year; international cargo traffic +5.3%.","sources":[["Airplanes and global interconnections – background video 1","https://www.youtube.com/watch?v=B65k9h0Y7HY"],["Airplanes and global interconnections – background video 2","https://www.youtube.com/watch?v=YYFckQbvpxI"],["IATA – Air Cargo Market Analysis August 2026","https://www.iata.org/en/publications/economics/reports/air-cargo-market-analysis-august-2026/"]]},{"id":29,"module":"transport","title":"Transport emissions and new technology","lead":"Transport creates connections, but burning fossil fuels also creates pollution and greenhouse-gas emissions.","paras":["Cars, trucks, ships and aircraft traditionally rely heavily on petrol, diesel or other fossil fuels. These fuels release carbon dioxide when burned.","Vehicle manufacturers have developed electric and hybrid vehicles to reduce fuel use and tailpipe emissions. Public transport, walking and cycling can also reduce emissions per person in some journeys.","No transport technology has zero impact. Electric vehicles still require materials and electricity, and public infrastructure uses land and resources. Sustainable transport compares the whole system rather than assuming one technology solves every problem."],"example":"Replacing a short car trip with walking or cycling avoids fuel use, while an electric bus can move many passengers with lower direct emissions than many separate petrol cars.","terms":[["hybrid vehicle","a vehicle combining more than one power source, often an engine and electric motor"],["electric vehicle","a vehicle powered mainly by electricity stored in batteries"]],"q":"Why are electric and hybrid vehicles being developed?","a":"To reduce dependence on fossil fuels and lower some transport emissions."},{"id":30,"module":"communication","title":"How the internet connects people and services","lead":"Digital networks let information, entertainment, education, health services and business cross distance quickly.","paras":["Messaging, video calls, social media and online games connect people who may never be in the same place. Music, films, news and trends can spread internationally within minutes.","Online learning can connect people to courses and information beyond their local area. Telehealth can allow a person in a remote community to speak with a health professional by video.","Businesses use websites and apps for advertising, shopping, payments and customer service. Digital communication therefore creates social and economic connections at the same time."],"example":"A person in a remote town can video-call a specialist, pay a bill online and order a product from a business in another city on the same day.","terms":[["information technology","digital systems used to create, store and share information"],["telehealth","healthcare delivered partly through communication technology"]],"q":"How can the internet reduce the importance of distance for services?","a":"It can deliver information, communication and some services online without requiring the user and provider to be in the same place."},{"id":31,"module":"communication","title":"Internet access in Africa: a current digital-divide article","lead":"Internet access is expanding across Africa, but current data still show the world's largest regional connectivity gaps in overall use, rural access, gender and affordability.","paras":["The digital divide is not simply a question of whether technology exists. The IEEE background article used in the learning material explains that people can be excluded by missing infrastructure, high costs and lack of skills. As education, healthcare, work, banking and government services become more digital, being offline can deepen existing social and economic disadvantage.","ITU's comparable 2025 regional data show the scale of the challenge. About 36% of the population in the ITU Africa region used the internet in 2025, compared with 74% worldwide. That makes Africa the least-connected ITU region.","Place matters strongly. Around 55% of urban residents in Africa were online in 2025, compared with only 21% of rural residents. The urban internet-use rate was therefore more than two-and-a-half times the rural rate. Long distances, lower population density, electricity reliability and the cost of extending networks all contribute.","Gender and age also matter. ITU estimated internet use at about 40% for men and 31% for women in Africa. Among people aged 15–24, about 50% were online compared with 32% of the rest of the population. These differences show that a single continental average hides major inequalities.","The older classroom map identified countries such as Egypt, Morocco, South Africa and Tunisia as relatively connected and Somalia, Niger and the Central African Republic as having very low access. Those examples came from older data and should not be used as a current ranking because national statistics are updated in different years and regional definitions differ. The current website therefore uses comparable ITU regional indicators and then examines Kenya as a detailed country case.","Infrastructure remains essential. ITU notes that mobile networks are the backbone of internet access across Africa. But coverage alone does not solve the divide: a person may live within a network area and still remain offline because a smartphone or data package is unaffordable, electricity is unreliable or digital skills are limited."],"example":"Two students can live in the same country but have very different digital opportunities if one has affordable urban broadband and the other depends on weak or expensive rural mobile coverage.","terms":[["digital divide","inequality in access to and effective use of digital technology"],["usage gap","when network coverage exists but people still do not use the internet"],["digital inclusion","ensuring people can afford, access and use digital services safely and effectively"]],"q":null,"a":null,"snapshot":"ITU 2025 · Africa internet use 36%; urban 55% vs rural 21%; men 40% vs women 31%; ages 15–24 about 50% vs 32% for the rest of the population.","article":true,"sources":[["IEEE – What Is the Digital Divide?","https://ctu.ieee.org/blog/2022/12/14/what-is-the-digital-divide/"],["ITU – Facts and Figures 2025","https://www.itu.int/itu-d/reports/statistics/facts-figures-2025/"],["ITU – State of digital development in Africa","https://www.itu.int/itu-d/reports/statistics/wp-content/uploads/sites/5/2025/04/2500037E_SDDT_2025_Africa_FINAL.pdf"]]},{"id":32,"module":"communication","title":"Case study article: Kenya, mobile phones and M-PESA","lead":"Kenya shows how mobile technology can connect people to financial services, markets and information even where traditional bank infrastructure is limited.","paras":["The Kenya video used in the learning sequence focuses on the way mobile phones became practical development tools rather than only communication devices. Farmers and small businesses can use phones for market information, customers can transfer money without travelling to a bank branch, and households can send support to relatives in other places.","M-PESA is the best-known example. It was launched commercially in Kenya in 2007 after early testing showed that users wanted to send money to one another through mobile phones. The system grew through a wide agent network where customers could convert between cash and digital value, allowing services to reach places without a conventional bank branch.","Current data show how deeply mobile money is embedded in Kenya. A World Bank analysis using the 2024 FinAccess survey reported that 82.3% of Kenyan adults were current users of mobile money. Safaricom's FY2025 results reported 35.82 million one-month active M-PESA customers and almost 299,000 agents.","The scale of transactions is also large. Safaricom reported total M-PESA transaction value of KSh38.29 trillion in FY2025. This includes person-to-person transfers, merchant payments and other services. Mobile money has therefore become part of the country's economic infrastructure rather than a niche technology.","The case study also demonstrates interconnection. A phone network links households, businesses, banks, agents, government systems and international transfers. But access is not automatically equal: people still need network coverage, an affordable phone, identification, digital skills and protection from fraud.","The wider lesson for Africa is that communication technology can sometimes leap over missing physical infrastructure. A service delivered through a mobile network can reach remote users more quickly than building a traditional branch network, although it does not remove every barrier to inclusion."],"example":"A rural farmer can receive a mobile payment, check prices, pay a supplier and send money to a family member using the same phone network.","terms":[["mobile money","a service that stores and transfers value through a mobile account"],["agent network","local businesses or representatives that provide cash-in, cash-out and customer services"],["financial inclusion","access to useful and affordable financial services"]],"q":null,"a":null,"snapshot":"Current case data · Kenya: 82.3% of adults were current mobile-money users in 2024; Safaricom FY2025 reported 35.82m active M-PESA customers and KSh38.29tn in transaction value.","article":true,"sources":[["Kenya mobile-phone background video","https://www.youtube.com/watch?v=zGCxiD4qREM"],["World Bank – Mobile money use in Kenya","https://documents1.worldbank.org/curated/en/099112425071537101/pdf/P509058-c0bd5027-d246-4da9-bc0c-fafb5fb4a3e2.pdf"],["Safaricom – FY25 audited results","https://www.safaricom.co.ke/images/Downloads/FY25-Press-Release_May-9-2025.pdf"]]},{"id":33,"module":"communication","title":"What makes internet access possible?","lead":"The internet feels wireless, but it depends on physical infrastructure, electricity, cables, towers, devices and data centres.","paras":["Mobile towers connect phones locally, while fibre-optic networks move large amounts of data. Undersea fibre-optic cables carry most international internet traffic between continents.","Remote areas can be expensive to connect because networks must cover long distances for fewer users. High device prices, data costs and unreliable electricity can create extra barriers.","When connectivity improves, people can gain better access to information, markets, online learning, telehealth and digital payments. But technology works best when people also have digital skills and safe, affordable services."],"example":"A video call between Australia and Africa may feel instant, but the data can travel through
