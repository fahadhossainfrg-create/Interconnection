<style>

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
 margin:0;background:

.key{font-size:.65rem;border:1px solid var(--line);border-radius:4px;padding:1px 5px;color:var(--muted)}
.theme{border-color:var(--line);min-width:90px;background:var(--surface)}
.hero{position:relative;overflow:hidden;border-bottom:1px solid var(--line)}
.hero:before{content:"";position:absolute;inset:0;background:

.module-card:hover{transform:translateY(-5px);border-color:color-mix(in srgb,var(--mint) 60%,var(--line));box-shadow:var(--shadow)}.module-card:hover:after{width:100%}

.module-hero{border:1px solid var(--line);border-radius:14px;background:linear-gradient(135deg,var(--surface2),var(--surface));padding:26px;display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;position:relative;overflow:hidden}
.module-hero:after{content:"";position:absolute;width:230px;height:230px;border-radius:50%;right:-70px;top:-100px;background:radial-gradient(circle,color-mix(in srgb,var(--coral) 10%,transparent),transparent 70%)}
.module-big-code{width:76px;height:76px;border-radius:10px;border:1px solid var(--line);display:grid;place-items:center;color:var(--coral);font:700 1rem "Space Grotesk",sans-serif;background:var(--surface)}
.module-hero h1{font:700 clamp(2.5rem,5vw,4.7rem)/.95 "Space Grotesk",sans-serif;letter-spacing:-.05em;margin:0}.module-hero p{color:var(--muted);margin:.65rem 0 0;max-width:820px}
.module-tabs{display:flex;gap:7px;overflow:auto;padding:11px 0 16px}.module-tab{white-space:nowrap;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:7px;padding:7px 9px;font-size:.8rem;font-weight:700}.module-tab.active{background:var(--mint);color:#10241c;border-color:var(--mint)}

.topic>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:auto 1fr auto;gap:11px;align-items:center;padding:14px 16px}.topic>summary::-webkit-details-marker{display:none}

.topic-title{font:700 1rem "Space Grotesk",sans-serif}.chev{width:30px;height:30px;border-radius:7px;border:1px solid var(--line);display:grid;place-items:center;color:var(--mint);transition:.2s}.topic[open] .chev{transform:rotate(180deg)}
.topic-body{display:grid;grid-template-columns:minmax(0,1fr) 315px;gap:18px;padding:0 16px 17px}

.side{display:grid;gap:9px;align-content:start}
.info{border:1px solid var(--line);border-radius:9px;background:var(--surface2);padding:12px}.info.green{background:color-mix(in srgb,var(--mint) 7%,var(--surface2))}
.label{font:700 .68rem "Space Grotesk",sans-serif;letter-spacing:.11em;text-transform:uppercase;color:var(--mint);margin-bottom:7px}

.check-question{color:var(--ink);font-weight:700}.reveal{border:1px solid var(--line);background:transparent;color:var(--mint);border-radius:6px;padding:6px 8px;margin-top:9px;font-weight:700}.answer{display:none;margin-top:8px;color:var(--muted)}.answer.show{display:block;animation:fadeIn .2s ease}@keyframes fadeIn{from{opacity:0}to{opacity:1}}

.activity-wrap{margin:20px 0 10px;border:1px solid var(--line);border-radius:12px;background:linear-gradient(160deg,var(--surface),var(--surface2));padding:18px}

.activity-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.choice{border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:10px;text-align:left;color:var(--ink);font-weight:700}.choice:hover{border-color:var(--mint)}.choice.correct{background:color-mix(in srgb,var(--mint) 18%,var(--surface));border-color:var(--mint)}.choice.wrong{background:color-mix(in srgb,var(--coral) 14%,var(--surface));border-color:var(--coral)}
.sim-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.sim-panel{border:1px solid var(--line);border-radius:9px;padding:12px;background:var(--surface)}
.bar-row{display:grid;grid-template-columns:120px 1fr 44px;gap:9px;align-items:center;margin:9px 0}.bar-track{height:9px;border-radius:99px;background:var(--line);overflow:hidden}.bar-fill{height:100%;width:var(--v);background:linear-gradient(90deg,var(--mint),var(--sand),var(--coral));transition:width .35s}.bar-row output{font-weight:700;color:var(--sand)}
.range{width:100%;accent-color:var(--coral)}
.sorter{display:grid;grid-template-columns:1fr 1fr;gap:10px}.dropzone{min-height:150px;border:1px dashed var(--line);border-radius:9px;padding:10px}.dropzone h4{margin:0 0 8px;font-family:"Space Grotesk",sans-serif}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);padding:6px 8px;font-weight:700;font-size:.84rem}
.flow{display:flex;gap:8px;align-items:stretch;overflow:auto;padding-bottom:6px}.flow-step{min-width:145px;border:1px solid var(--line);border-radius:9px;background:var(--surface);padding:10px;position:relative}.flow-step b{display:block;color:var(--mint)}.flow-step small{color:var(--muted)}.flow-arrow{display:grid;place-items:center;color:var(--coral);font-weight:700}

.quiz-score{font:700 2rem "Space Grotesk",sans-serif;color:var(--sand)}

.reveal-card{opacity:0;transform:translateY(12px);transition:.48s cubic-bezier(.2,.75,.2,1)}.reveal-card.visible{opacity:1;transform:none}
.top{position:fixed;right:18px;bottom:18px;width:46px;height:46px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--mint);box-shadow:var(--shadow);z-index:30}
footer{border-top:1px solid var(--line);padding:28px 18px;color:var(--muted)}.footer-inner{max-width:1240px;margin:auto;display:flex;justify-content:space-between;gap:18px}.footer-inner b{color:var(--ink)}
@media(max-width:980px){.nav{display:none}.hero-inner{grid-template-columns:1fr}.module-grid{grid-template-columns:repeat(2,1fr)}.topic-body{grid-template-columns:1fr}.fun-grid,.sim-grid,.climate{grid-template-columns:1fr}.glossary-grid{grid-template-columns:repeat(2,1fr)}}

const MODULES=[{"id":"foundations","code":"01","title":"Understanding Interconnections","desc":"Build the big ideas: connection, interconnection, globalisation, global citizenship and the ways people and places influence one another.","topics":[1,2,3,4,5]},{"id":"personal","code":"02","title":"Everyday Global Connections","desc":"Trace the links hidden inside food, clothes, apps, media, brands and a jar of Nutella.","topics":[6,7,8,9]},{"id":"skills","code":"03","title":"Geographical Skills","desc":"Use Australian and world maps, BOLTSS, latitude, longitude and climate graphs to describe places accurately.","topics":[10,11,12,13,14]},{"id":"travel","code":"04","title":"Travel & Tourism Patterns","desc":"Explore why people travel, where they go, how travel has recovered, and how social media and apps shape decisions.","topics":[15,16,17,18,19]},{"id":"tourism","code":"05","title":"Tourism Impacts & Sustainability","desc":"Investigate economic, social and environmental impacts through Venice, ecotourism and natural-area examples.","topics":[20,21,22,23,24,25]},{"id":"transport","code":"06","title":"Transport & the Shrinking World","desc":"Follow the changes from steam power to container ships, aircraft and lower-emission transport.","topics":[26,27,28,29]},{"id":"communication","code":"07","title":"Communication Technology","desc":"See how the internet connects people to information, learning, health, business and money — and why access is unequal.","topics":[30,31,32,33]},{"id":"trade","code":"08","title":"Trade & Global Flows","desc":"Understand imports, exports, tariffs, free trade and Australia's current trading connections.","topics":[34,35,36,37,38]},{"id":"consumption","code":"09","title":"Production, Consumption & Change","desc":"Follow the life of products through the iPhone, Nike and chocolate cases, then examine responsibility and sustainability.","topics":[39,40,41,42,43,44,45]}];

const TOPICS=[{"id":1,"module":"foundations","title":"Connection and interconnection","lead":"A connection is a link. An interconnection shows how connected people, places or things can affect one another.","paras":["A road can connect two suburbs, a flight can connect two countries, and a phone call can connect two people. These are all examples of connections.","Interconnection adds the idea of influence. Tourists are connected to a destination, but they also change it by spending money, using transport, creating waste and sharing photos. The destination changes the visitors too by giving them experiences, knowledge and memories.","Geographers look for these two-way relationships. A change in technology, transport, trade, culture or the environment in one place can create effects in another place."],"example":"A short video makes a quiet beach famous. More visitors arrive, local cafés earn more money, traffic increases and the beach may need stronger protection. One online post can therefore connect media, tourism, business and the environment.","terms":[["connection","a link between people, places or things"],["interconnection","a relationship in which connected things can affect one another"]],"q":"What extra idea does the word interconnection include?","a":"It includes influence: connected people, places or things can affect one another."},{"id":2,"module":"foundations","title":"Four ways people connect","lead":"Technology, economics, transport and culture create different kinds of links between people and places.","paras":["Technological connections include TikTok, Instagram and YouTube, video calls on Zoom or WhatsApp, streaming through services such as Netflix and Prime Video, and online games such as Fortnite, Roblox and Minecraft. A person in Sydney can use these systems to connect with people, entertainment and ideas from many countries.","Economic connections include Australia selling products and services overseas, global food chains such as McDonald's, KFC and Subway operating in many countries, and shoppers using platforms such as Amazon or eBay to buy from distant sellers.","Transport connections move people and goods. Planes carry travellers, ships carry freight and international parcel networks deliver online purchases. Cultural connections spread food, music, sport and traditions. Sushi, K-pop, the Olympics, the World Cup and migration are all examples."],"example":"One pair of sneakers can involve an online advertisement, a factory overseas, a container ship, a local shop and a fashion trend. That single product creates technological, economic, transport and cultural connections.","terms":[["economic connection","a link created through money, work, business or trade"],["cultural connection","a link created through shared or exchanged ideas, food, language, music, sport or traditions"]],"q":"Give one example of a technological connection and one transport connection.","a":"For example: a video call is technological; an international flight or container ship is a transport connection."},{"id":3,"module":"foundations","title":"What is globalisation?","lead":"Globalisation is the increasing connection of people and places across the world.","paras":["Goods, services, money, information, ideas and people can move between places more quickly and in larger amounts than in the past. Trade, politics, culture, technology and transport all help create these links.","Container ships make it cheaper to move large amounts of goods. Aircraft make long-distance travel much faster. The internet allows information, entertainment and business activity to move almost instantly.","Globalisation does not mean every place becomes the same. Local cultures, laws, environments and economies still matter. It means that decisions and events in one place can increasingly affect people in other places."],"example":"A phone can be designed in one country, contain materials from several countries, be assembled in another, sold in Australia and connected to online services hosted around the world.","terms":[["globalisation","the increasing connection of people and places around the world"],["flow","movement of people, goods, services, money, information or ideas"]],"q":"Name two technologies that have made globalisation faster.","a":"Examples include container ships, aircraft, mobile phones and the internet."},{"id":4,"module":"foundations","title":"Benefits and costs of globalisation","lead":"Globalisation can create opportunities, but benefits and problems are not shared equally.","paras":["Possible benefits include more trade, jobs, investment, technology, products and cultural exchange. A business can reach customers in other countries, and people can learn ideas from many places.","Possible costs include pressure on small local businesses, low wages or unsafe work in some supply chains, environmental damage and the weakening or commercialisation of local traditions.","The strongest geographical explanations ask who gains, who may lose, where an effect happens and whether it lasts. A new factory, for example, may create jobs while also increasing water use, traffic or pollution."],"example":"A global clothing company may create factory work in a lower-income country. The jobs can provide income, but poor labour protection may mean long hours, low pay or unsafe conditions.","terms":[["impact","an effect or result"],["developing economy","an economy where average incomes and access to some services may still be lower than in wealthier economies"]],"q":"Why is it not enough to say globalisation is simply good or bad?","a":"Because it can create benefits and costs at the same time, and different people and places experience them differently."},{"id":5,"module":"foundations","title":"Global village and global citizenship","lead":"The global village is the idea that travel, media and communication make distant people feel part of one connected community.","paras":["People can watch the same sporting event, follow the same news, speak across continents and share music or ideas almost instantly. Distance still exists, but it is a smaller barrier to communication.","A global citizen thinks about the wider effects of choices. Global citizenship can involve learning about other cultures, caring about human rights, reducing waste, helping communities and thinking about environmental problems that cross borders.","Small actions connect to larger systems. Recycling does not solve climate change by itself, but it can be part of wider changes in behaviour, policy and production."],"example":"Sam learns that climate change affects communities around the world. Sam recycles, joins a local clean-up and shares ideas with an online environmental group that has members in several countries.","terms":[["global village","the idea that the world feels more like one connected community"],["global citizen","a person who thinks about responsibilities and relationships beyond their own local area"]],"q":"What makes a person a global citizen?","a":"Thinking about the wider world and taking informed, responsible action on issues that affect people and places beyond the local area."},{"id":6,"module":"personal","title":"Your personal global web","lead":"Everyday choices can connect one person to many countries without that person leaving home.","paras":["Family history, migration, travel and language create personal connections. Food, clothing, music, sport, films, games and devices create many more.","A label on a shirt can show where it was made. A food package can show where ingredients came from. An app can connect its user to a company, servers and other users in several countries.","Mapping these links reveals a personal geography. It also raises questions: Which places appear most often? Which connections depend on trade? Which depend on technology? Which are cultural?"],"example":"A person might live in Australia, have family in Bangladesh, eat Japanese food, listen to Korean music, wear shoes made in Vietnam and use an American-owned app.","terms":[["personal connection","a link between a person and another person, place, product or activity"],["network","a group of connected links"]],"q":"Why can one person's daily routine involve many countries?","a":"Because family, products, food, media, travel and digital services can all come from or connect to different places."},{"id":7,"module":"personal","title":"Global brands and supply chains","lead":"A global brand depends on a network of design, materials, manufacturing, transport, marketing and consumers.","paras":["A company does not need to make every part of a product in one country. It may design in one place, buy materials from others, use specialist factories elsewhere and sell through stores and websites around the world.","Transport networks move materials and finished products. Digital systems coordinate orders, payments, advertising and customer service. These systems allow a brand to operate across many countries.","Global brands can spread styles and products quickly. They can create jobs and investment, but they can also affect local competition, working conditions and environmental pressure."],"example":"A T-shirt may use cotton from one country, be sewn in another, shipped through a major port, advertised on social media and sold in an Australian shopping centre.","terms":[["supply chain","the connected stages and places used to make and move a product"],["global brand","a brand sold or recognised in many countries"]],"q":"What are three stages that could appear in a global supply chain?","a":"Examples include raw materials, manufacturing, transport, distribution, retail and consumption."},{"id":8,"module":"personal","title":"Influencers and worldwide reach","lead":"Online creators can become globally known because digital platforms move videos, trends and advertising across borders.","paras":["Video platforms and social media allow a creator to reach people in many countries without using traditional television networks. Recommendation systems, sharing and subtitles can help content cross language and national borders.","MrBeast is one clear example of a creator whose large-scale challenge and charity videos are watched internationally. A video can influence entertainment trends, products, donations and even travel interest.","Online influence is an interconnection: creators affect audiences, but audiences also affect creators through views, comments, sharing, subscriptions and purchasing decisions."],"example":"A creator posts a video about building and giving away houses. Viewers around the world watch and share it, while the attention creates discussion about charity, media and the power of online audiences.","terms":[["influencer","a person whose online content can affect other people's attention, opinions or choices"],["audience","the people who watch, read or listen to content"]],"q":"Why can an online creator become globally known faster than was possible in the past?","a":"Digital platforms can distribute content quickly to very large international audiences."},{"id":9,"module":"personal","title":"Case study: Nutella as a global product","lead":"A jar of Nutella connects agriculture, climate, factories, transport, offices, shops and consumers across the world.","paras":["Ferrero began in Alba, Italy, in 1946. Pietro Ferrero developed an early hazelnut-and-cocoa product after World War II, when cocoa was scarce. In 1964, Michele Ferrero developed the Nutella spread known today.","Nutella is now available in about 170 countries, and Ferrero reported in 2024 that a jar was sold about every two seconds. Hazelnuts come from several regions; Ferrero identifies Türkiye, Italy, Chile and the United States as major origins. Cocoa is sourced mainly from West Africa, especially Côte d’Ivoire and Ghana, with other origins also used.","Ingredients come from different places because crops need different climates, harvest seasons and growing conditions. Multiple supply regions can also help with availability, quality and scale. After manufacturing, jars move through warehouses, freight networks, supermarkets and other retailers.","A headquarters such as Ferrero's roots in Alba helps coordinate brand strategy and major decisions, while local offices and distributors adapt sales and marketing to particular countries."],"example":"Hazelnuts may be grown around the Mediterranean or in Chile and the United States, while cocoa may come from West Africa. These ingredients travel before they become part of a product sold in an Australian supermarket.","terms":[["raw material","a basic material or ingredient used to make a product"],["distribution","moving finished products to places where they will be stored or sold"]],"q":"Why does Nutella source ingredients from more than one country?","a":"Different ingredients need different climates, and using several regions helps with seasonal supply, quality, availability and the amount needed for a global market.","snapshot":"Current snapshot · Nutella is available in about 170 countries; Ferrero reported in 2024 that a jar is sold about every two seconds."},{"id":10,"module":"skills","title":"Australia map essentials","lead":"A strong map reader can locate major Australian features and use direction and position accurately.","paras":["Australia's national capital is Canberra. Tasmania is the island state south of mainland Australia. Queensland, New South Wales and Victoria lie along the east and southeast of the mainland, with capitals Brisbane, Sydney and Melbourne.","The Tropic of Capricorn, at about 23.5°S, crosses the Australian mainland. Uluru is in the southern part of the Northern Territory.","Important water bodies around Australia include the Indian Ocean to the west, the Pacific Ocean to the east, the Southern Ocean to the south, the Tasman Sea between Australia and New Zealand, and the Great Australian Bight along the southern coastline."],"example":"If a map question asks you to locate Uluru, first find the Northern Territory, then place it in the southern interior rather than near Darwin.","terms":[["capital city","the city where a national or state government is based"],["Great Australian Bight","the large open bay along the southern coast of mainland Australia"]],"q":"Which latitude line crosses mainland Australia?","a":"The Tropic of Capricorn, about 23.5°S."},{"id":11,"module":"skills","title":"World maps, oceans and hemispheres","lead":"World maps help us describe where places are in relation to continents, oceans and hemispheres.","paras":["The Equator divides Earth into the Northern and Southern Hemispheres. The Prime Meridian helps divide locations into eastern and western positions.","Major oceans connect continents through shipping, travel and climate systems. The Pacific Ocean lies east of Australia, while the Indian Ocean lies to the west.","Relative location describes where something is compared with another place. Absolute location uses coordinates such as latitude and longitude."],"example":"Australia is south of the Equator and mostly east of the Prime Meridian. It lies between the Indian and Pacific oceans.","terms":[["hemisphere","half of Earth"],["relative location","the position of a place described in relation to other places"]],"q":"Which two major oceans lie on the western and eastern sides of Australia?","a":"The Indian Ocean to the west and the Pacific Ocean to the east."},{"id":12,"module":"skills","title":"BOLTSS: making a useful map","lead":"BOLTSS is a checklist for the information a clear geographical map should include.","paras":["B is Border, the line around the map. O is Orientation, usually a north arrow. L is Legend, the key explaining symbols and colours.","T is Title, which states the map's purpose. The first S is Scale, showing the relationship between map distance and real distance. The final S is Source, explaining where the information came from.","A map can be colourful but still weak if the reader cannot work out what symbols mean, which way is north or where the information came from."],"example":"A map showing countries connected to your clothes should include a title, a legend for different product types, a north arrow if direction matters and a source for the country information.","terms":[["legend","a key explaining map symbols and colours"],["scale","the relationship between a distance on a map and the real distance"]],"q":"What do the two S letters in BOLTSS stand for?","a":"Scale and Source."},{"id":13,"module":"skills","title":"Latitude and longitude","lead":"Latitude and longitude work together like a global address.","paras":["Latitude measures north-south position from the Equator. The Equator is 0°. The Tropic of Cancer is about 23.5°N, the Tropic of Capricorn about 23.5°S, the Arctic Circle about 66.5°N and the Antarctic Circle about 66.5°S.","The tropics lie between the Tropic of Cancer and Tropic of Capricorn. Sunlight can be very direct in this region, so tropical areas are generally warm, although rainfall patterns differ from place to place.","Longitude measures east-west position from the Prime Meridian at 0°, which passes through Greenwich in London. The International Date Line is roughly opposite at 180° and bends through the Pacific so it does not split some countries and island groups into different calendar days.","Crossing the International Date Line changes the calendar date. Places such as far eastern Russia and Alaska can be geographically close while being on different calendar days."],"example":"Sydney is south of the Equator and east of the Prime Meridian, so its coordinates use S and E.","terms":[["latitude","distance north or south of the Equator, measured in degrees"],["longitude","distance east or west of the Prime Meridian, measured in degrees"],["International Date Line","the line near 180° longitude where the calendar date changes"]],"q":"What is the reference line for longitude?","a":"The Prime Meridian at 0° longitude."},{"id":14,"module":"skills","title":"How to read a climate graph","lead":"A climate graph shows how temperature and precipitation change through a year.","paras":["The horizontal axis normally shows the months. A line shows average monthly temperature in degrees Celsius. Columns show monthly precipitation, usually in millimetres.","To describe the graph, find the warmest and coolest months, calculate the temperature range, and identify the wettest and driest months. Then look for a seasonal pattern.","Halifax, Canada, is used in the interactive example on this site. The graph lets you select a month and read temperature and precipitation together. The important skill is not memorising the numbers; it is learning how the two sets of data are displayed and compared."],"example":"If the line rises strongly from winter to summer and then falls, the place has a clear seasonal temperature pattern. If the bars stay similar, precipitation is spread more evenly through the year.","terms":[["precipitation","water falling from the atmosphere, including rain and snow"],["temperature range","the highest temperature minus the lowest temperature"]],"q":"What do the columns usually show on a climate graph?","a":"Precipitation or rainfall."},{"id":15,"module":"travel","title":"Why do people travel?","lead":"People travel for leisure, family, health, culture, study, work and new experiences.","paras":["Leisure travel includes holidays, relaxation and recreation. Cultural travel may focus on food, heritage, festivals or learning about different ways of life.","People also travel to visit relatives and friends, seek medical treatment, attend meetings, study, inspect work sites or build business networks.","One trip can have several purposes. Faster transport and digital booking systems have also made it easier for many people to organise long-distance trips."],"example":"A person may travel overseas for a family wedding, visit relatives, explore local food and spend several days on holiday during the same journey.","terms":[["leisure","free time used for enjoyment"],["tourism","temporary travel away from home for leisure, culture, business or other purposes"]],"q":"Name three different reasons people may travel.","a":"Examples include holidays, family, culture, health, study, work or business."},{"id":16,"module":"travel","title":"Where people travel: current global patterns","lead":"International tourism is concentrated in some countries, but travel patterns change with cost, safety, transport, attractions and world events.","paras":["UN Tourism recorded about 1.4 billion international tourist arrivals worldwide in 2024, marking a recovery to pre-pandemic global levels.","Using UN Tourism data, the OECD reports that the five most visited countries in 2024 were France with 102.0 million international arrivals, Spain with 93.8 million, the United States with 72.4 million, Türkiye with 60.6 million and Italy with 57.7 million.","These countries attract visitors for different reasons, including cities, beaches, culture, heritage, food and transport connections. A high number of visitors does not automatically mean tourism is sustainable; destinations still need to manage crowding, housing, transport and environmental pressure."],"example":"France combines Paris, regional cities, heritage sites, countryside and strong European transport links, helping it attract visitors for many different types of trip.","terms":[["tourist arrival","an international visitor arriving in a destination for an overnight trip"],["travel pattern","the spatial or time-based arrangement of where people travel"]],"q":"Which country received the most international tourist arrivals in 2024?","a":"France, with about 102 million international tourist arrivals.","snapshot":"Current snapshot · 1.4 billion international tourist arrivals worldwide in 2024. Top destination: France, 102.0 million."},{"id":17,"module":"travel","title":"Social media and the tourism effect","lead":"A photo, video or hashtag can rapidly increase attention on a destination.","paras":["Social media can promote places that were previously less known. Wanagiri Hidden Hills in Bali and the hot-air-balloon landscapes of Cappadocia in Türkiye show how distinctive images can become part of a destination's online identity.","Benefits can include more customers for accommodation, restaurants, guides and transport. Online attention can also spread cultural knowledge and encourage people to visit new regions.","Problems can appear when visitor numbers grow faster than the place can manage. Crowding, litter, damaged vegetation and long queues can increase. Carefully edited images can also create unrealistic expectations about how quiet or perfect a place will be."],"example":"A viewpoint becomes famous because thousands of visitors copy the same photograph. Local businesses gain customers, but the walking track erodes and residents experience heavier traffic.","terms":[["viral","spreading very quickly through online sharing"],["overtourism","visitor pressure that exceeds what a place or community can comfortably manage"]],"q":"How can social media cause both a benefit and a problem for one destination?","a":"It can bring visitors and income, while also creating crowding, environmental damage or pressure on residents."},{"id":18,"module":"travel","title":"Tourism in Australia after the pandemic","lead":"Australian tourism has moved from pandemic disruption into a new period of strong domestic and international activity.","paras":["Tourism Research Australia reports total tourism consumption of A$211.1 billion in 2024–25. Tourism GDP was A$81.1 billion and tourism accounted for 696,000 filled jobs in that financial year.","During the pandemic, international travel fell sharply and Australians relied more heavily on domestic trips, regional travel and staycations. International tourism later recovered as borders reopened and flight capacity returned.","Domestic tourism remains important because it spreads visitor spending across cities and regional areas. International visitors are also important because money spent in Australia counts as an export of tourism services."],"example":"A regional town can benefit from Australians taking weekend trips even when international visitor numbers are weak. When overseas visitors return, accommodation and attractions gain another source of demand.","terms":[["tourism consumption","the value of goods and services consumed by visitors"],["tourism GDP","the value tourism adds to the economy"]],"q":"How much total tourism consumption was recorded in Australia in 2024–25?","a":"A$211.1 billion.","snapshot":"Current snapshot · Australia 2024–25: A$211.1b tourism consumption, A$81.1b tourism GDP and 696,000 filled tourism jobs."},{"id":19,"module":"travel","title":"Travel apps and changing travel behaviour","lead":"Digital tools now influence how people plan, book, navigate and review trips.","paras":["Map apps help with navigation and public transport. Airline and accommodation apps support bookings and updates. Review platforms provide opinions from previous visitors, while ride-hailing apps connect travellers with local transport.","These tools reduce uncertainty. A traveller can compare prices, translate information, check opening times and change plans while already travelling.","Digital convenience can also create problems. Reviews may be unreliable, app-based recommendations can send too many people to the same place, and travellers without good internet access or payment options may be disadvantaged."],"example":"A visitor can use Google Maps for directions, an airline app for a boarding pass, Booking.com for accommodation and a ride-hailing app for a trip from the station.","terms":[["digital platform","an online system that connects users, information or services"],["review","a user's opinion or rating of a service, product or place"]],"q":"Give two ways travel apps can make a trip easier.","a":"Examples include navigation, booking, price comparison, transport updates, translation and reviews."},{"id":20,"module":"tourism","title":"Positive and negative impacts of tourism","lead":"Tourism can change the economy, society and environment at the same time.","paras":["Positive economic impacts include jobs, business income and investment. Visitor demand may also support better roads, airports, public spaces and other infrastructure.","Positive social impacts can include cultural exchange and support for heritage. Environmental benefits can occur when tourism income helps pay for national parks, conservation or restoration.","Negative impacts include overcrowding, pollution, habitat damage, rising prices, seasonal jobs and cultural commercialisation. The same project can produce both positive and negative effects."],"example":"A resort creates jobs and pays local suppliers, but it may also increase traffic, waste and demand for land or water.","terms":[["economic impact","an effect on jobs, income, business or costs"],["social impact","an effect on communities, culture, behaviour or quality of life"],["environmental impact","an effect on natural systems such as land, water, plants and animals"]],"q":"Why should tourism impacts be examined in more than one category?","a":"Because tourism can affect the economy, communities and the environment in different ways at the same time."},{"id":21,"module":"tourism","title":"Case study: Venice and overtourism","lead":"Venice shows the challenge of protecting a famous historic city while keeping the economic benefits of tourism.","paras":["Large visitor numbers place pressure on narrow streets, water transport, public spaces, waste systems and everyday life for residents. Tourism also supports hotels, restaurants, shops, guides and other jobs, so the challenge is management rather than simply stopping tourism.","Large cruise ships have been a major concern because of crowding, emissions and their scale beside the historic city. Italy introduced restrictions in 2021 that stopped large cruise ships from using the historic route past St Mark's Basin and the Giudecca Canal, shifting more cruise activity toward Marghera and the wider lagoon-port system.","Venice has also tested a day-visitor access fee. In 2025 the fee operated on 54 days from April to July. The city reported 723,497 paid access vouchers and about €5.42 million in revenue. The price was €5 for earlier booking and €10 for late booking on applicable days.","Management remains debated. Charging a fee can help manage and measure day visits, but UNESCO has continued to call for stronger action to reduce tourism pressure and protect the heritage city. Sea-level rise and flooding add another long-term challenge."],"example":"A visitor staying overnight may already contribute through accommodation charges, while a day visitor on a designated date may need an access-fee voucher. Different measures try to spread costs and control pressure.","terms":[["overtourism","visitor pressure that exceeds what a destination and community can comfortably manage"],["access fee","a charge used to manage or regulate entry"],["heritage","places, buildings, traditions or landscapes valued and protected for their cultural importance"]],"q":"Why is managing Venice tourism difficult?","a":"Tourism supports jobs and businesses, but very large visitor flows can crowd public spaces, strain infrastructure and threaten the historic environment.","snapshot":"Current snapshot · Venice's 2025 access-fee trial ran for 54 days and recorded 723,497 paid vouchers, raising about €5.42 million."},{"id":22,"module":"tourism","title":"How tourism can damage environments","lead":"Tourism can affect coasts, mountains, forests, wetlands, reefs, wildlife and soils if visitor use and development are poorly managed.","paras":["On coasts, people can trample sand dunes and developers may clear vegetation for resorts, roads, parking and other facilities. Unplanned growth can spread buildings along scenic coastlines and increase waste and sewage.","In marine environments, anchors, boating, diving and shoreline development can damage coral and seagrass. Land clearing increases sediment in water, while nutrient-rich sewage can disturb coral-reef conditions.","In mountains and forests, clearing land for ski facilities or resorts can increase erosion and land risk. Trails can compact soil and damage vegetation. Wildlife viewing can also disturb feeding, breeding or movement if people get too close.","Draining coastal wetlands removes habitats that support many species. Building on fertile soils can also reduce land available for agriculture. Good planning tries to keep visitors away from sensitive areas and set limits before damage becomes difficult to reverse."],"example":"A popular walking trail becomes wider as visitors step around muddy sections. Vegetation dies, bare soil is exposed and heavy rain then washes more soil away.","terms":[["erosion","the wearing away and movement of soil or rock"],["biodiversity","the variety of living things in an area"],["sediment","small particles of soil or rock carried by water"]],"q":"How can a walking trail eventually cause biodiversity loss?","a":"Heavy trampling can kill vegetation and compact or expose soil, leading to erosion and habitat loss."},{"id":23,"module":"tourism","title":"What is ecotourism?","lead":"Ecotourism is responsible travel in natural areas that aims to protect the environment and support local communities.","paras":["Ecotourism is not simply any holiday in nature. A more sustainable operation tries to reduce waste, protect wildlife, control visitor behaviour and use water and energy carefully.","Local communities should benefit through employment, local purchasing, cultural experiences and a real voice in tourism decisions. This helps keep more benefits in the destination.","Common strategies include renewable energy, recycling, locally grown food, low-emission transport, visitor limits, environmental rules and education about conservation."],"example":"A small rainforest lodge uses solar power, employs local guides, keeps visitors on marked tracks and contributes money to habitat restoration.","terms":[["ecotourism","responsible tourism in natural areas that supports conservation and local communities"],["sustainable tourism","tourism managed so economic, social and environmental benefits can continue into the future"]],"q":"What makes ecotourism different from simply visiting a natural place?","a":"It includes active efforts to protect the environment and support local communities."},{"id":24,"module":"tourism","title":"Case study: Daintree Ecolodge","lead":"Daintree Ecolodge shows how accommodation can connect tourism with rainforest conservation and Eastern Kuku Yalanji culture.","paras":["The lodge is located in the World Heritage-listed Daintree Rainforest in Queensland. Its current sustainability approach emphasises conservation, local culture and a small-scale rainforest experience.","The lodge reports using 100% renewable electricity through onsite solar and GreenPower. It uses a bio-cycle wastewater system, avoids single-use plastics in guest areas and kitchens, and purchases locally where possible.","Its partnership with Rainforest Rescue supports restoration of previously cleared lowland rainforest and native plant nurseries. Experiences are also guided by Eastern Kuku Yalanji culture, and the lodge supports local artists and cultural connection.","These practices show that sustainability is more than one technology. Energy, water, waste, habitat, employment, culture and visitor behaviour all need to work together."],"example":"A guest can stay in a small treetop-style bayan, learn about rainforest ecology and culture, while part of the tourism operation supports restoration rather than clearing new land.","terms":[["B Corp","a business certification assessing social and environmental performance, accountability and transparency"],["restoration","helping a damaged ecosystem recover"]],"q":"Name two sustainability strategies used by Daintree Ecolodge.","a":"Examples include renewable electricity, wastewater treatment and reuse, reducing single-use plastics, local purchasing, cultural partnerships and rainforest restoration.","snapshot":"Current snapshot · Daintree Ecolodge is a certified B Corp and reports renewable electricity, wastewater reuse, no single-use plastics in guest areas, and a Rainforest Rescue partnership."},{"id":25,"module":"tourism","title":"Ecotourism examples around the world","lead":"Different natural destinations use different strategies because ecosystems and communities have different needs.","paras":["The Great Barrier Reef in Australia depends on reef protection, visitor education and careful boating or diving. The Galápagos Islands in Ecuador use strict conservation rules because many species are unique and vulnerable.","Costa Rica is known for protected rainforests, wildlife reserves and lodges linked with nature tourism. Yellowstone National Park in the United States combines visitor access with wildlife and geothermal protection.","In Borneo, tourism can support rainforest and orangutan conservation, but it must avoid stressing wildlife or encouraging habitat loss. The strongest ecotourism model protects the environment while allowing local communities to benefit."],"example":"A wildlife tour that keeps a safe distance, uses trained local guides and limits group size can create income without encouraging visitors to approach or feed animals.","terms":[["carrying capacity","the level of use a place can handle without unacceptable damage"],["conservation","protection and careful management of environments and species"]],"q":"Why might an island wildlife destination need stricter visitor controls than a large urban attraction?","a":"Island ecosystems may contain rare species and limited habitats that can be damaged more easily by high visitor pressure."},{"id":26,"module":"transport","title":"Transport and the shrinking world","lead":"Faster and cheaper transport makes long distances feel smaller because people and goods can cross them more easily.","paras":["The steam engine transformed ships and railways. The internal combustion engine later supported cars, trucks and many aircraft technologies. Each change increased speed, reliability or the amount that could be moved.","Modern transport connects people to work, family, tourism and services. It connects businesses to suppliers and customers and makes global production possible.","The phrase shrinking world does not mean Earth is physically smaller. It means that the time, cost and difficulty of connecting across distance have been reduced."],"example":"A voyage between Europe and Australia once took many weeks or months by sailing ship. Modern aircraft can cover the intercontinental journey in about a day.","terms":[["transport network","connected routes used to move people or goods"],["shrinking world","the idea that faster transport and communication reduce the importance of distance"]],"q":"Why is the world described as shrinking?","a":"Because improved transport and communication reduce the time and difficulty of connecting over long distances."},{"id":27,"module":"transport","title":"Case study: how the shipping container changed trade","lead":"A standard steel box changed world trade by reducing the time, labour and cost of handling cargo.","paras":["Before containerisation, many goods were loaded and unloaded piece by piece. A ship could carry thousands of separate crates, bags and boxes. Handling took time and increased the risk of damage, theft and delays.","A famous example is the SS Warrior voyage in 1954, which carried more than 190,000 separate items between New York and Germany. Loading and unloading alone took about ten days, and the whole journey took roughly three months.","American trucking businessman Malcolm McLean developed the idea of moving goods in standard metal containers that could be transferred between truck and ship without unpacking the cargo. The first successful container operations in the 1950s helped prove that the system could save large amounts of handling time.","Ports later built cranes, terminals and computer systems around containers. A sealed box can now move from a factory by truck, travel across an ocean, transfer to rail and continue inland. Containerisation helped make large global supply chains practical."],"example":"Clothes made in Bangladesh can be packed near a factory, trucked to a port, shipped to Australia and moved to a distribution centre while staying inside the same container.","terms":[["containerisation","using standard containers to move cargo efficiently between transport types"],["cargo","goods carried by a ship, aircraft, train or truck"],["freight","goods transported in large amounts"]],"q":"Why did containers reduce the cost and time of shipping?","a":"They reduced repeated handling because the same sealed container can move between trucks, ships and trains without unpacking every item."},{"id":28,"module":"transport","title":"How airplanes strengthen global interconnections","lead":"Aircraft connect distant people and markets quickly, supporting travel, trade, work and cultural exchange.","paras":["Passenger aircraft make it possible to visit family, attend meetings, study overseas and travel for holidays without spending weeks crossing oceans.","Air freight is useful for goods that are urgent, perishable, lightweight or high-value. Medical supplies, electronics, flowers and fresh foods can reach distant markets quickly.","Air travel also supports cultural exchange because people meet, study and work in different societies. The main trade-off is environmental: aviation uses large amounts of fuel and produces greenhouse-gas emissions."],"example":"An urgent medical component can be flown to another country within hours, while the people installing it can also travel quickly if specialist skills are needed.","terms":[["air freight","goods transported by aircraft"],["emissions","gases released into the atmosphere, often by burning fuel"]],"q":"Give two ways aircraft increase global interconnection.","a":"They move people quickly across long distances and move urgent or valuable goods between international markets."},{"id":29,"module":"transport","title":"Transport emissions and new technology","lead":"Transport creates connections, but burning fossil fuels also creates pollution and greenhouse-gas emissions.","paras":["Cars, trucks, ships and aircraft traditionally rely heavily on petrol, diesel or other fossil fuels. These fuels release carbon dioxide when burned.","Vehicle manufacturers have developed electric and hybrid vehicles to reduce fuel use and tailpipe emissions. Public transport, walking and cycling can also reduce emissions per person in some journeys.","No transport technology has zero impact. Electric vehicles still require materials and electricity, and public infrastructure uses land and resources. Sustainable transport compares the whole system rather than assuming one technology solves every problem."],"example":"Replacing a short car trip with walking or cycling avoids fuel use, while an electric bus can move many passengers with lower direct emissions than many separate petrol cars.","terms":[["hybrid vehicle","a vehicle combining more than one power source, often an engine and electric motor"],["electric vehicle","a vehicle powered mainly by electricity stored in batteries"]],"q":"Why are electric and hybrid vehicles being developed?","a":"To reduce dependence on fossil fuels and lower some transport emissions."},{"id":30,"module":"communication","title":"How the internet connects people and services","lead":"Digital networks let information, entertainment, education, health services and business cross distance quickly.","paras":["Messaging, video calls, social media and online games connect people who may never be in the same place. Music, films, news and trends can spread internationally within minutes.","Online learning can connect people to courses and information beyond their local area. Telehealth can allow a person in a remote community to speak with a health professional by video.","Businesses use websites and apps for advertising, shopping, payments and customer service. Digital communication therefore creates social and economic connections at the same time."],"example":"A person in a remote town can video-call a specialist, pay a bill online and order a product from a business in another city on the same day.","terms":[["information technology","digital systems used to create, store and share information"],["telehealth","healthcare delivered partly through communication technology"]],"q":"How can the internet reduce the importance of distance for services?","a":"It can deliver information, communication and some services online without requiring the user and provider to be in the same place."},{"id":31,"module":"communication","title":"The digital divide: a current global pattern","lead":"The digital divide is the gap between people who can use digital technology effectively and people who cannot.","paras":["Access depends on network infrastructure, electricity, device cost, data prices, skills and geography. Remote and low-income communities often face greater barriers.","ITU estimates that about 74% of the world's population used the internet in 2025. In Africa the figure was about 36%, showing a major regional gap.","The urban-rural divide is also large. In Africa in 2025, about 55% of urban residents used the internet compared with about 21% of rural residents.","Country patterns also vary. ITU 2024 data show relatively high internet-use rates in Morocco, South Africa, Tunisia and Egypt, while countries such as Niger, the Central African Republic and Somalia have much lower rates. For example, ITU reports 76.5% for Tunisia and 74.6% for Egypt, compared with 15.6% for Niger in 2024.","Limited access can reduce opportunities for education, health information, jobs, markets, banking and government services. Digital disadvantage can therefore deepen other forms of inequality."],"example":"Two students may be equally motivated, but one with reliable home internet can access videos, research and online collaboration while the other must depend on limited connections.","terms":[["digital divide","the gap in access to and effective use of digital technology"],["digital disadvantage","reduced opportunities caused by limited digital access, affordability or skills"]],"q":"What percentage of Africa's population used the internet in 2025 according to ITU estimates?","a":"About 36%.","snapshot":"Current snapshot · ITU 2025: world internet use about 74%; Africa about 36%; Africa urban 55% versus rural 21%."},{"id":32,"module":"communication","title":"Case study: Kenya and M-PESA","lead":"M-PESA shows how mobile-phone technology can connect people to financial services without a traditional bank branch.","paras":["M-PESA launched in Kenya in 2007. It allows users to send and receive money, pay bills, buy goods and access other financial services using mobile technology.","Safaricom reported more than 35 million M-PESA customers in its FY2025 investor information. It also reported that formal financial inclusion in Kenya reached 84.8% in 2024, compared with 19% in 2006.","This does not mean M-PESA alone caused every part of the increase. It is one important part of a wider change involving mobile networks, regulation, banking, agents and new digital services.","The case shows that communication infrastructure can become economic infrastructure. A phone network can connect a person not only to messages but also to payments, markets, remittances and business."],"example":"A small seller can receive a digital payment from a customer and then send money to a family member without needing a bank branch in the same town.","terms":[["mobile money","a service that lets people store, send or receive money through a mobile account"],["financial inclusion","people having useful and affordable access to financial services"]],"q":"Why is M-PESA a strong example of interconnection?","a":"It links mobile communication with payments, business, family transfers and access to financial services.","snapshot":"Current snapshot · Safaricom FY2025: M-PESA had more than 35 million customers; Kenya's formal financial inclusion was reported at 84.8% in 2024."},{"id":33,"module":"communication","title":"What makes internet access possible?","lead":"The internet feels wireless, but it depends on physical infrastructure, electricity, cables, towers, devices and data centres.","paras":["Mobile towers connect phones locally, while fibre-optic networks move large amounts of data. Undersea fibre-optic cables carry most international internet traffic between continents.","Remote areas can be expensive to connect because networks must cover long distances for fewer users. High device prices, data costs and unreliable electricity can create extra barriers.","When connectivity improves, people can gain better access to information, markets, online learning, telehealth and digital payments. But technology works best when people also have digital skills and safe, affordable services."],"example":"A video call between Australia and Africa may feel instant, but the data can travel through local networks and long-distance fibre cables crossing the ocean floor.","terms":[["infrastructure","the physical systems needed for services to operate"],["fibre-optic cable","a cable that carries data as pulses of light"]],"q":"Why can remote communities be harder to connect to the internet?","a":"Networks must cover long distances for fewer users, and infrastructure, electricity, devices and data can be expensive."},{"id":34,"module":"trade","title":"What is global trade?","lead":"Global trade is the buying and selling of goods and services between countries.","paras":["An export is a good or service sold to another country. An import is a good or service bought from another country.","Countries trade because they have different climates, resources, skills, industries and costs. Trade gives consumers and businesses access to products that may not be available locally.","Trade creates links between farms, mines, factories, ports, shipping companies, airports, shops, digital services and consumers."],"example":"Australia can export wheat or education services and import passenger cars, computers or telecommunications equipment.","terms":[["export","a good or service sold to another country"],["import","a good or service bought from another country"],["global trade","buying and selling goods and services between countries"]],"q":"A smartphone made overseas and bought in Australia is what from Australia's point of view?","a":"An import."},{"id":35,"module":"trade","title":"Why countries trade","lead":"Countries trade because no place has every resource, climate, industry or skill it wants in the same amount.","paras":["A tropical crop may not grow well in a cold climate. Some countries have large mineral deposits, while others specialise in manufacturing, finance, education or technology.","Businesses also trade to reach larger markets. Selling to international customers can increase demand, income and employment.","Trade also creates dependence. A factory that relies on one overseas supplier may face delays if a port closes, a conflict interrupts shipping or a natural disaster damages production."],"example":"Australia imports coffee from warmer growing regions and exports resources and services that overseas buyers want.","terms":[["market","people or places where goods and services are bought and sold"],["trade partner","a country that regularly buys from or sells to another country"]],"q":"Give one reason a country may import a product.","a":"It may lack the climate, resources, skills or supply to produce enough locally, or importing may be more efficient."},{"id":36,"module":"trade","title":"Free trade, tariffs and agreements","lead":"Free trade agreements reduce some barriers so countries can exchange goods and services more easily.","paras":["A tariff is a tax on an imported good. A tariff can make the imported product more expensive and may protect local producers, but it can also raise costs for consumers or businesses.","Australia and New Zealand have a long-standing free-trade relationship through the Closer Economic Relations agreement. Australia also has many other agreements with individual countries and regional groups.","The China–Australia Free Trade Agreement, known as ChAFTA, entered into force in 2015. DFAT states that by 1 January 2029, 99% of Australia's goods exports to China will enter duty-free.","Free trade does not remove every rule. Quarantine, safety standards, customs procedures and rules about where a product comes from can still apply."],"example":"If an import tariff is removed, an overseas product may enter at a lower cost. An Australian exporter may also gain better access to the other country's market.","terms":[["tariff","a tax on imported goods"],["free trade agreement","an agreement that reduces selected trade barriers between economies"]],"q":"What usually happens to the price pressure on an import when a tariff is removed?","a":"The tariff cost disappears, which can make the import cheaper, although other costs still affect the final price.","snapshot":"Current snapshot · ChAFTA entered into force in 2015; DFAT says 99% of Australian goods exports to China will enter duty-free by 1 January 2029."},{"id":37,"module":"trade","title":"Australia's current trading connections","lead":"Australia's trade network is strongly connected to Asia, but major links also extend to North America, Europe and New Zealand.","paras":["DFAT's 2025 calendar-year data show China's position as Australia's largest export market, worth about A$195.6 billion. Japan was second at about A$65.1 billion, followed by the United States at A$59.9 billion, the Republic of Korea at A$44.2 billion and India at A$32.2 billion.","For imports, China was the largest source at about A$130.2 billion, followed by the United States at A$98.6 billion, Japan at A$32.4 billion, Singapore at A$28.2 billion and Thailand at A$23.6 billion.","Australia's largest exports in 2025 included iron ore, coal, natural gas, gold and education-related travel services. Wheat was also a major export, worth about A$9.9 billion.","These figures change over time as prices, demand, exchange rates and world events change. A current trade map is therefore a snapshot rather than a permanent pattern."],"example":"Australia can export iron ore to Asian manufacturing markets while importing vehicles, fuel, electronics and services from different partners.","terms":[["two-way trade","the combined value of imports and exports between trading partners"],["trade value","the monetary value of goods and services traded"]],"q":"Which economy was Australia's largest export market in 2025?","a":"China.","snapshot":"Current snapshot · 2025 export markets: China A$195.6b, Japan A$65.1b, US A$59.9b, Republic of Korea A$44.2b, India A$32.2b."},{"id":38,"module":"trade","title":"Trade routes, disruption and interdependence","lead":"Trade networks make products widely available, but they also mean a disruption in one place can affect distant places.","paras":["Ships follow major sea routes between ports, while railways, roads and aircraft connect ports and airports to inland markets. Digital systems coordinate orders, tracking and payments.","A disruption can come from severe weather, conflict, strikes, port congestion, a factory shutdown or a shortage of shipping capacity. When one link fails, delays and costs can spread through the network.","Businesses can reduce risk by using several suppliers, keeping emergency stock or changing transport routes. These choices may increase resilience but can also cost more."],"example":"If a major shipping route is blocked, containers may take a longer route. Delivery times and freight prices can rise even for customers thousands of kilometres away.","terms":[["interdependence","a situation where people or places depend on one another"],["resilience","the ability to cope with disruption and recover"]],"q":"How can a port disruption affect a shop in another country?","a":"Goods may arrive late or cost more because the shop depends on the wider transport and supply network."},{"id":39,"module":"consumption","title":"Production and consumption","lead":"Production is how goods are made. Consumption is how goods and resources are bought, used, reused and disposed of.","paras":["Production can begin with farming, mining or other raw-material extraction. Materials are processed, parts are manufactured and products are assembled and packaged.","Consumption includes purchasing, using, maintaining, repairing, sharing, reusing, recycling and disposal. Consumer demand can influence how much companies produce.","Every stage can create economic, social and environmental effects. A factory may create jobs while using energy and water. A consumer gains a useful product but may later create waste."],"example":"Buying a phone connects a customer to mining, factories, software, freight, retail, repair and e-waste systems.","terms":[["production","the processes that turn materials into goods"],["consumption","the ways goods and resources are purchased, used and disposed of"]],"q":"What is the main difference between production and consumption?","a":"Production is making goods; consumption is buying, using, reusing and disposing of them."},{"id":40,"module":"consumption","title":"Case study: the global journey of an iPhone","lead":"An iPhone is a strong example of a global product because its materials, parts, assembly, software and recycling depend on a large international network.","paras":["The journey begins with design and sourcing. Materials used in electronics can include aluminium, copper, lithium, cobalt, gold and rare-earth elements. These materials come from different mining and processing regions.","Specialist suppliers make components such as chips, displays, cameras and batteries. Apple says its supply chain includes thousands of supplier facilities in more than 60 countries.","Components are assembled into finished devices and shipped to markets around the world. After use, a device may be sold second-hand, repaired, traded in or recycled.","There is no single fixed 'intended lifespan' that applies to every iPhone. Lifespan depends on how the device is used, software support, battery condition, repair, damage and the owner's decision about replacement."],"example":"A phone used in Sydney may include minerals mined in one region, chips from specialist factories elsewhere, final assembly in Asia, software designed in the United States and recycling after its useful life.","terms":[["lifecycle","the stages a product moves through from materials to end of use"],["component","one part used to build a larger product"]],"q":"Why is an iPhone a global product?","a":"Its materials, parts, assembly, transport, software, sales and recycling involve many countries and companies.","snapshot":"Current snapshot · Apple says its supply chain includes thousands of supplier facilities in more than 60 countries."},{"id":41,"module":"consumption","title":"iPhone impacts and more sustainable electronics","lead":"Smartphones create benefits, but mining, manufacturing, energy use and e-waste also create environmental and social challenges.","paras":["Environmental impacts begin before the phone reaches a shop. Mining changes land and uses energy and water. Manufacturing requires electricity and complex materials. Transport adds emissions, while discarded devices can become e-waste if they are not reused or recycled safely.","Economic benefits include jobs, sales, app-based businesses and access to the digital economy. Social benefits include communication, navigation, learning and emergency access. Concerns can include unequal digital access and labour conditions in parts of global supply chains.","Apple reported in 2026 that 30% of the material by weight across products shipped in 2025 came from recycled content. It also reports 100% recycled cobalt in Apple-designed batteries and 100% recycled rare-earth elements in magnets.","Apple screens returned devices for reuse and repair, while products that cannot be reused may enter recycling systems including Daisy and Cora. Keeping devices longer, repairing them and recycling responsibly can reduce some demand for new materials."],"example":"Replacing a battery can extend a phone's useful life. When a device is finally recycled, valuable metals can be recovered instead of being lost in landfill.","terms":[["e-waste","discarded electronic equipment"],["recycled content","material recovered from previous products or waste and used again"]],"q":"Name two ways smartphone impacts can be reduced.","a":"Examples include keeping devices longer, repairing them, using recycled materials and recycling devices through responsible systems.","snapshot":"Current snapshot · Apple reported that 30% of material by weight across products shipped in 2025 came from recycled content."},{"id":42,"module":"consumption","title":"Case study: Nike as a transnational corporation","lead":"Nike is a transnational corporation because its brand, suppliers, factories, offices and markets operate across many countries.","paras":["Nearly all Nike footwear and apparel is made by independent contract manufacturers rather than Nike-owned factories. This allows the company to use a large specialist supply network.","Nike's fiscal 2025 filing reported 97 finished-footwear factories in 11 countries. About 51% of Nike Brand footwear was made in Vietnam, 28% in Indonesia and 17% in China. It also reported 303 finished-apparel factories in 34 countries.","Nike's current manufacturing map covers the broader Nike Inc. finished-goods network and lists about 570 factories and nearly 1.2 million workers across 37 geographies. These are workers in supplier factories, not the same as Nike's direct employees.","Globalisation benefits Nike by connecting design, suppliers, transport, marketing and large consumer markets. At the same time, a global supply chain creates responsibility for working conditions, wages, environmental impacts and transparency."],"example":"A sneaker can be designed and marketed by Nike, manufactured by an independent factory in Vietnam, shipped through global freight networks and sold in Australia.","terms":[["transnational corporation","a company that operates across more than one country"],["contract manufacturer","an independent company paid to manufacture products for another company"]],"q":"Why is it important to distinguish Nike employees from supplier-factory workers?","a":"Because many people manufacturing Nike products work for independent suppliers rather than being directly employed by Nike.","snapshot":"Current snapshot · Nike FY2025: 97 footwear factories in 11 countries; Vietnam made about 51% of Nike Brand footwear."},{"id":43,"module":"consumption","title":"Case study: the dark side of chocolate","lead":"Chocolate connects consumers to cocoa farms, traders, processors and factories, but the supply chain can also involve poverty, child labour risk and environmental pressure.","paras":["Much of the world's cocoa comes from West Africa, especially Côte d’Ivoire and Ghana. Millions of smallholder farming households depend on cocoa income.","Low household income, limited schools and services, labour shortages and rural poverty can increase the risk of child labour. The International Cocoa Initiative estimates about 1.56 million children are in child labour in cocoa-growing areas of Côte d’Ivoire and Ghana, equal to about 45% of children in cocoa-growing households.","Not every task done by a child on a family farm is classified as child labour. The concern is work that is harmful, dangerous, excessive, or prevents education and healthy development.","Environmental concerns can include deforestation, loss of biodiversity, soil pressure and climate risk. Price changes can also make farmer income unstable, which affects families' ability to invest in safer farms and education."],"example":"A cheap chocolate bar can be connected to a farming household thousands of kilometres away. The retail price does not show how income and risk are divided between farmers, traders, processors, manufacturers and retailers.","terms":[["child labour","work that harms a child's health or development or interferes with education"],["smallholder farmer","a farmer operating a relatively small farm, often using family labour"],["traceability","the ability to follow a product back through its supply chain"]],"q":"Why is child labour in cocoa described as a complex problem rather than only a problem of individual families?","a":"Because poverty, schooling, farm income, labour availability, services, laws and supply-chain systems all affect the risk.","snapshot":"Current snapshot · International Cocoa Initiative estimate: about 1.56 million children are in child labour in cocoa-growing areas of Côte d’Ivoire and Ghana."},{"id":44,"module":"consumption","title":"Who can respond to production and consumption problems?","lead":"Governments, NGOs, companies and individuals have different powers, so effective change usually needs more than one group.","paras":["Governments can create laws, safety rules, environmental standards, waste systems and inspections. In the cocoa sector, current 2024–2029 action frameworks in Ghana and Côte d’Ivoire include education, social protection, traceability and child-protection systems.","NGOs can support communities, monitor conditions, provide education, restore environments and campaign for change. Organisations such as World Vision are examples of NGOs working on development and community issues.","Businesses can trace suppliers, improve standards, redesign products, reduce waste and publish supply-chain information. Consumers can keep products longer, repair and recycle, choose products carefully and ask companies for better information.","No group can solve a complex global supply-chain problem alone. Rules need enforcement, businesses need workable systems, communities need resources and consumers need realistic choices."],"example":"Reducing e-waste may involve government recycling rules, company take-back programs, repair businesses and consumers choosing to repair a device instead of replacing it immediately.","terms":[["NGO","a non-government organisation working independently from government, often on social, humanitarian or environmental issues"],["regulation","an official rule used to control an activity"]],"q":"Why are several groups usually needed to solve a global supply-chain problem?","a":"Because governments, businesses, NGOs and consumers control different parts of the system and have different powers and responsibilities."},{"id":45,"module":"consumption","title":"Making production and consumption more sustainable","lead":"Sustainable production and consumption try to reduce harm while still meeting people's needs.","paras":["Businesses can design products that last longer, use recycled materials, reduce packaging, improve energy efficiency and make repair easier. They can also improve supply-chain transparency and working conditions.","Governments can set product standards, regulate pollution, support recycling and create rules for waste and worker safety. Communities and NGOs can raise awareness and help monitor impacts.","Individuals can buy less when a purchase is not needed, reuse products, repair them, share or buy second-hand, recycle correctly and learn where products come from.","The strongest solution is often circular: materials remain in use for longer and waste becomes an input for another product instead of being thrown away."],"example":"A phone is used for several years, its battery is replaced, it is sold second-hand, and the device is eventually recycled so some metals can be recovered for new products.","terms":[["circular economy","a system that keeps products and materials in use for longer through reuse, repair and recycling"],["sustainable consumption","using goods and resources in ways that reduce long-term harm"]],"q":"What is one way to make a product's lifecycle more circular?","a":"Repair, reuse, refurbishment, sharing or recycling can keep a product or its materials in use for longer."}];

const GLOSSARY=[["Assimilation","when a group gradually adopts the culture of another group"],["Biodiversity","the variety of living things in an area"],["BOLTSS","Border, Orientation, Legend, Title, Scale and Source"],["Cargo","goods carried by a ship, aircraft, train or truck"],["Commodity","a raw material or basic product that can be bought and sold"],["Connection","a link between people, places or things"],["Consumer","a person who buys or uses goods and services"],["Consumption","buying, using, reusing and disposing of goods and resources"],["Cultural degradation","weakening, loss or commercialisation of cultural traditions"],["Digital divide","the gap in access to and effective use of digital technology"],["Ecotourism","responsible tourism in natural areas that supports conservation and local communities"],["Export","a good or service sold to another country"],["Free trade","trade with fewer selected tariffs or restrictions"],["Global citizen","a person who thinks about responsibilities and connections beyond the local area"],["Globalisation","the increasing connection of people and places around the world"],["Import","a good or service bought from another country"],["Interconnection","a relationship in which connected things can affect one another"],["Latitude","distance north or south of the Equator"],["Longitude","distance east or west of the Prime Meridian"],["Overtourism","visitor pressure that exceeds what a destination can comfortably manage"],["Production","the processes that turn materials into goods"],["Supply chain","the linked stages and places used to make and move a product"],["Sustainability","meeting needs while protecting the ability of future generations to meet their needs"],["Tariff","a tax on imported goods"],["Tourism","temporary travel away from home for leisure, culture, business or other purposes"],["Trade","buying and selling goods and services"],["Transnational corporation","a company that operates across more than one country"]];

s://www.apple.com/au/environment/","note":"Current recycled-material and recycling information."},{"name":"NIKE Manufacturing Map","url":"https://manufacturingmap.nikeinc.com/","note":"Current independent supplier-factory network."},{"name":"NIKE Investor Relations","url":"https://investors.nike.com/","note":"Annual reports and current manufacturing disclosures."},{"name":"International Cocoa Initiative","url":"https://www.cocoainitiative.org/issues/child-labour-cocoa","note":"Current estimates and explanation of child labour in cocoa."},{"name":"US Department of Labor","url":"https://www.dol.gov/agencies/ilab","note":"Current child-labour findings and policy responses."}];

const app=document.getElementById("app"),search=document.getElementById("search"),theme=document.getElementById("theme");
let currentModule=null;
const seen=new Set(JSON.parse(localStorage.getItem("ic_seen")||"[]"));
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const moduleOf=id=>MODULES.find(m=>m.id===id);
const progress=m=>Math.round(m.topics.filter(id=>seen.has(id)).length/m.topics.length*100);
function save(){localStorage.setItem("ic_seen",JSON.stringify([...seen]));updateProgress()}
function updateProgress(){document.getElementById("progressText").textContent=seen.size+" / "+TOPICS.length+" topics explored"}
function revealCards(){const els=[...document.querySelectorAll(".reveal-card")];if(!("IntersectionObserver" in window)){els.forEach(x=>x.classList.add("visible"));return}const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("visible");io.unobserve(e.target)}}),{threshold:.1});els.forEach((x,i)=>{x.style.transitionDelay=Math.min(i,8)*35+"ms";io.observe(x)})}

function home(){

function setupClimate(){
